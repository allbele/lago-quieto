<script>
// Lago Quieto — peixes: sombras em Bézier, curvam para anéis, saltam, mergulham ao clique.
(function(){
  'use strict';
  const TWO_PI = Math.PI * 2;
  const TRAIL = 4;           // posições do rastro
  const JUMP_T = 0.6;        // duração do arco (s)
  const DIVE_T = 1.6;        // mergulho ao clique (s)
  const CURVE_R = 250;       // raio de atração dos anéis

  const fish = [];
  let goldSeen = false;
  let lastW = 0, lastH = 0, lastTop = 0, lastBot = 0; // geometria do último resize

  function makeFish(gold){
    const f = { gold: !!gold, x: 0, y: 0, ang: 0, len: 22, alpha: 0, trail: [],
      p0: null, p1: null, p2: null, p3: null, u: 0, dur: 6,   // curva atual
      pull: null, pullT: 0,                                    // atração ao anel
      jumping: 0, jx: 0, jy: 0, jumped: false, jumpTimer: 0,
      diving: 0, dx: 0, dy: 0, tx: 0, ty: 0, born: false };
    for (let i = 0; i < TRAIL; i++) f.trail.push({ x: 0, y: 0 });
    return f;
  }
  function waterBand(game){
    const top = game.horizonY + 24, bot = game.H - 30;
    return { top, bot };
  }
  function randPoint(game){
    const b = waterBand(game);
    return { x: 20 + game.rand() * (game.W - 40), y: b.top + game.rand() * (b.bot - b.top) };
  }
  // Nova curva de Bézier partindo da posição atual (ou entrando pela borda se recém-nascido)
  function newPath(f, game){
    if (!f.born){
      const b = waterBand(game);
      f.born = true;
      f.x = game.rand() < 0.5 ? -40 : game.W + 40;
      f.y = b.top + game.rand() * (b.bot - b.top);
    }
    f.p0 = { x: f.x, y: f.y };
    f.p3 = randPoint(game);
    // controles: seguem a direção atual e depois curvam
    const d = 120 + game.rand() * 160;
    f.p1 = { x: f.x + Math.cos(f.ang) * d, y: f.y + Math.sin(f.ang) * d * 0.5 };
    f.p2 = { x: f.p3.x + (game.rand() - 0.5) * 260, y: f.p3.y + (game.rand() - 0.5) * 120 };
    f.u = 0;
    const dist = Math.hypot(f.p3.x - f.p0.x, f.p3.y - f.p0.y);
    f.dur = Math.max(4, dist / (28 + game.rand() * 14)); // ~30-40 px/s
    f.jumpTimer = 6 + game.rand() * 14;
  }
  function bez(a, b, c, d, t){
    const s = 1 - t;
    return s*s*s*a + 3*s*s*t*b + 3*s*t*t*c + t*t*t*d;
  }
  function pushTrail(f){
    for (let i = TRAIL - 1; i > 0; i--){ f.trail[i].x = f.trail[i-1].x; f.trail[i].y = f.trail[i-1].y; }
    f.trail[0].x = f.x; f.trail[0].y = f.y;
  }
  function startJump(f, game){
    f.jumping = 1e-6; f.jumped = false; f.jx = f.x; f.jy = f.y;
    game.audio.play(f.gold ? 'fishJumpGold' : 'fishJump', { x: f.x / game.W, y: 0.4, gain: 1 });
    if (f.gold && !goldSeen){ goldSeen = true; game.achievement('golden_fish'); }
  }
  function startDive(f, game){
    f.diving = 1e-6; f.dx = f.x; f.dy = f.y;
    // ressurge 200 px adiante na direção atual, dentro da água
    const b = waterBand(game);
    let tx = f.x + Math.cos(f.ang) * 200, ty = f.y + Math.sin(f.ang) * 200 * 0.4;
    if (tx < 20 || tx > game.W - 20){ tx = f.x - Math.cos(f.ang) * 200; f.ang += Math.PI; }
    f.tx = Math.min(game.W - 20, Math.max(20, tx));
    f.ty = Math.min(b.bot, Math.max(b.top, ty));
    game.spawnRipple(f.x, f.y, { strength: 0.6, rings: 2 });
    game.spawnDrops(f.x, f.y, 2);
    game.audio.play('plop', { x: f.x / game.W, y: 0.3, gain: 0.25 });
  }
  function fishCount(game){
    if (!game.has('fish')) return 0;
    return game.has('fish2') ? 3 : 1;
  }
  function fadeOf(f, game){
    return f.gold || fish.indexOf(f) > 0 ? game.unlockFade('fish2') : game.unlockFade('fish');
  }

  LQ.register('fish', {
    init(game){
      fish.length = 0;
      fish.push(makeFish(false)); fish.push(makeFish(false)); fish.push(makeFish(true));
      for (const f of fish) f.ang = game.rand() * TWO_PI;
      const b = waterBand(game); lastW = game.W; lastH = game.H; lastTop = b.top; lastBot = b.bot;
    },
    // janela mudou: reposiciona proporcionalmente à faixa d'água e recomeça a curva daí
    onResize(game){
      const b = waterBand(game);
      if (!lastW || !lastH){ lastW = game.W; lastH = game.H; lastTop = b.top; lastBot = b.bot; return; }
      const sx = game.W / lastW, sy = (b.bot - b.top) / Math.max(1, lastBot - lastTop);
      for (const f of fish){
        if (!f.born) continue;
        f.x *= sx; f.y = b.top + (f.y - lastTop) * sy;
        f.x = Math.min(game.W + 40, Math.max(-40, f.x));
        f.y = Math.min(b.bot, Math.max(b.top, f.y));
        for (const p of f.trail){ p.x = f.x; p.y = f.y; }
        f.jumping = 0; f.diving = 0; f.pull = null;
        newPath(f, game);
      }
      lastW = game.W; lastH = game.H; lastTop = b.top; lastBot = b.bot;
    },
    update(dt, game){
      const n = fishCount(game);
      const band = waterBand(game);
      for (let i = 0; i < fish.length; i++){
        const f = fish[i];
        if (i >= n){ f.alpha = 0; continue; }
        f.alpha = 0.35 * fadeOf(f, game);
        if (!f.p0) newPath(f, game);

        // Mergulho (clique): invisível, reaparece adiante
        if (f.diving > 0){
          f.diving += dt;
          const k = Math.min(1, f.diving / DIVE_T);
          f.x = f.dx + (f.tx - f.dx) * k; f.y = f.dy + (f.ty - f.dy) * k;
          if (k >= 1){
            f.diving = 0;
            game.spawnRipple(f.x, f.y, { strength: 0.4, rings: 1 });
            for (const p of f.trail){ p.x = f.x; p.y = f.y; }
            newPath(f, game);
          }
          continue;
        }
        // Salto: sombra parada, corpo em arco na camada de luz
        if (f.jumping > 0){
          f.jumping += dt;
          if (f.jumping >= JUMP_T){
            f.jumping = 0;
            game.spawnRipple(f.x, f.y, { strength: 0.7, rings: 2 });
            game.spawnDrops(f.x, f.y, 4, f.gold ? game.palette.gold : null); // dourado: gotas douradas
          }
          continue;
        }

        // Avança na curva
        f.u += dt / f.dur;
        if (f.u >= 1){ newPath(f, game); }
        let nx = bez(f.p0.x, f.p1.x, f.p2.x, f.p3.x, f.u);
        let ny = bez(f.p0.y, f.p1.y, f.p2.y, f.p3.y, f.u);
        // Atração ao anel (dura ~1.5 s, mistura suavemente)
        if (f.pull){
          f.pullT -= dt;
          const w = game.ease.smoothstep(Math.min(1, f.pullT / 1.5)) * 0.6;
          nx += (f.pull.x - nx) * w * dt * 2; ny += (f.pull.y - ny) * w * dt * 2;
          const d = Math.hypot(f.pull.x - nx, f.pull.y - ny);
          if (f.pullT <= 0 || d < 20){
            if (game.calm > 8 && d < 40 && f.pullT > 0) startJump(f, game);
            f.pull = null;
          }
        }
        const mvx = nx - f.x, mvy = ny - f.y;
        if (Math.abs(mvx) + Math.abs(mvy) > 0.05){
          const target = Math.atan2(mvy, mvx);
          let da = target - f.ang; while (da > Math.PI) da -= TWO_PI; while (da < -Math.PI) da += TWO_PI;
          f.ang += da * Math.min(1, dt * 4);
        }
        f.x = nx; f.y = Math.min(band.bot, Math.max(band.top, ny)); // nunca acima do horizonte
        // Rastro: guarda a cada ~80 ms
        f._tt = (f._tt || 0) + dt;
        if (f._tt >= 0.08){ f._tt = 0; pushTrail(f); }
        // Salto espontâneo (só com fish2 ou modo ambiente)
        f.jumpTimer -= dt;
        if (f.jumpTimer <= 0){
          f.jumpTimer = 15 + game.rand() * 30;
          const spont = game.has('fish2') || game.sinceClick > 20;
          if (spont && f.y > game.horizonY + 40) startJump(f, game);
        }
      }
    },
    onRipple(x, y, game){
      const n = fishCount(game);
      let best = null, bd = CURVE_R;
      for (let i = 0; i < n; i++){
        const f = fish[i];
        if (f.jumping || f.diving || !f.born) continue;
        const d = Math.hypot(f.x - x, (f.y - y) * 1.5);
        if (d < bd){ bd = d; best = f; }
      }
      if (best){
        best.pull = { x, y }; best.pullT = 1.5 + game.rand() * 0.5;
        // recomeça a curva a partir de onde está para a atração não brigar com o Bézier
        best.p0 = { x: best.x, y: best.y }; best.u = 0;
        best.p3 = { x: x + (game.rand() - 0.5) * 120, y: y + (game.rand() - 0.5) * 40 };
        best.p1 = { x: best.x + Math.cos(best.ang) * 60, y: best.y + Math.sin(best.ang) * 30 };
        best.p2 = { x: x, y: y };
        best.dur = Math.max(1.6, bd / 90);
        // calm alto: o mais próximo salta chegando (0.5–2 s depois do clique)
        if (game.calm > 8) best.pullT = Math.min(best.pullT, 1.2);
      }
    },
    onClick(x, y, game){
      const n = fishCount(game);
      for (let i = 0; i < n; i++){
        const f = fish[i];
        if (f.jumping || f.diving || f.alpha <= 0.05) continue;
        const dx = x - f.x, dy = y - f.y;
        if (dx * dx + dy * dy * 4 < 26 * 26){ startDive(f, game); return true; }
      }
      return false;
    },
    draw(layer, ctx, game){
      const n = fishCount(game);
      if (n === 0) return;
      if (layer === 'fish'){
        ctx.fillStyle = game.palette.dark;
        for (let i = 0; i < n; i++){
          const f = fish[i];
          if (f.alpha <= 0.01 || f.diving || f.jumping) continue;
          // rastro: 4 posições, alpha decrescente
          for (let k = TRAIL - 1; k >= 0; k--){
            const p = f.trail[k];
            ctx.globalAlpha = f.alpha * (0.5 - k * 0.11);
            ctx.beginPath(); ctx.ellipse(p.x, p.y, f.len * 0.7 * (1 - k * 0.12), f.len * 0.22, f.ang, 0, TWO_PI); ctx.fill();
          }
          ctx.globalAlpha = f.alpha;
          ctx.beginPath(); ctx.ellipse(f.x, f.y, f.len, f.len * 0.36, f.ang, 0, TWO_PI); ctx.fill();
          // cauda
          const tx = f.x - Math.cos(f.ang) * f.len * 1.1, ty = f.y - Math.sin(f.ang) * f.len * 1.1;
          ctx.beginPath(); ctx.ellipse(tx, ty, f.len * 0.35, f.len * 0.2, f.ang + 0.6, 0, TWO_PI); ctx.fill();
        }
        ctx.globalAlpha = 1;
      } else if (layer === 'light'){
        // corpo saltando: arco 600 ms, parábola até 46 px; reflexo claro na camada aditiva
        for (let i = 0; i < n; i++){
          const f = fish[i];
          if (!f.jumping) continue;
          const k = f.jumping / JUMP_T;
          const h = Math.sin(Math.PI * k) * 46;
          const x = f.jx + (k - 0.5) * 40, y = f.jy - h;
          const rot = (k - 0.5) * 2.2; // sobe inclinado, desce de cabeça
          const col = f.gold ? game.palette.gold : game.palette.light;
          const a = 0.55 * Math.sin(Math.PI * Math.min(1, k * 1.15)) * fadeOf(f, game);
          ctx.fillStyle = col;
          for (let e = 3; e >= 1; e--){ // 3 elipses concêntricas = glow
            ctx.globalAlpha = a * (e === 1 ? 1 : 0.18 / e);
            ctx.beginPath(); ctx.ellipse(x, y, f.len * 0.8 * (1 + (e - 1) * 0.45), f.len * 0.28 * (1 + (e - 1) * 0.6), rot, 0, TWO_PI); ctx.fill();
          }
          // sombra que fica na água
          ctx.globalAlpha = a * 0.3;
          ctx.beginPath(); ctx.ellipse(f.jx, f.jy, f.len * 0.8, f.len * 0.25, 0, 0, TWO_PI); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
    }
  });
})();

<script>
// Lago Quieto — lírios d'água: discos derivando, balançam com anéis, florescem ao clique.
(function(){
  'use strict';
  const TWO_PI = Math.PI * 2;
  const BLOOM_T = 3;   // flor abre em 3 s
  const lilies = [];
  // Área dos controles (coleção + barra de ícones, centro inferior): lírios não entram
  // (bot = H-100 mantém o centro acima da coleção; a zona central até H-150 cobre raio+balanço)
  const UI_H = 100, ZONE_H = 150, UI_HALF_W = 230;
  function inZone(y, game){ return y > game.H - ZONE_H; }
  function zoneL(game){ return game.W / 2 - UI_HALF_W; }
  function zoneR(game){ return game.W / 2 + UI_HALF_W; }
  function safeX(x, y, game){
    if (!inZone(y, game) || x < zoneL(game) || x > zoneR(game)) return x;
    const left = zoneL(game), right = zoneR(game);
    if (left < 30 && right > game.W - 30) return x; // tela estreita: sem espaço lateral
    if (left < 30) return right;
    if (right > game.W - 30) return left;
    return x < game.W / 2 ? left : right;
  }

  function place(game){
    lilies.length = 0;
    const n = 3 + Math.floor(game.rand() * 3); // 3-5
    const top = game.horizonY + game.H * 0.12, bot = game.H - UI_H;
    for (let i = 0; i < n; i++){
      const y = top + (i + game.rand()) / n * (bot - top);
      const depth = (y - game.horizonY) / (game.H - game.horizonY); // 0 longe, 1 perto
      const x = safeX(30 + game.rand() * (game.W - 60), y, game);
      lilies.push({
        x, y, r: 10 + depth * 16,
        rot: game.rand() * TWO_PI, notch: game.rand() * TWO_PI,
        vx: (game.rand() - 0.5) * 3, ph: game.rand() * TWO_PI,
        bob: 0, bobV: 0,            // oscilação vertical por anéis (mola amortecida)
        bloomed: false, bloom: 0
      });
    }
    game.lilyCount = n;
  }

  LQ.register('lilies', {
    init(game){ place(game); },
    onUnlock(id, game){ if (id === 'lilies') place(game); },
    onResize(game){
      const top = game.horizonY + game.H * 0.12, bot = game.H - UI_H;
      for (const L of lilies){
        L.x = Math.min(game.W - 30, Math.max(30, L.x));
        L.y = Math.min(bot, Math.max(top, L.y));
        L.x = safeX(L.x, L.y, game);
      }
    },
    update(dt, game){
      if (!game.has('lilies')) return;
      for (const L of lilies){
        // deriva lenta, ida e volta
        L.x += L.vx * dt;
        if (L.x < 30){ L.x = 30; L.vx = Math.abs(L.vx); }
        else if (L.x > game.W - 30){ L.x = game.W - 30; L.vx = -Math.abs(L.vx); }
        // não deriva para debaixo dos controles (centro inferior): as bordas da zona são paredes
        if (inZone(L.y, game)){
          const zl = zoneL(game), zr = zoneR(game);
          if (L.x > zl && L.x < zr){
            if (L.x - zl < zr - L.x && zl >= 30){ L.x = zl; L.vx = -Math.abs(L.vx); }
            else if (zr <= game.W - 30){ L.x = zr; L.vx = Math.abs(L.vx); }
          }
        }
        if (game.rand() < 0.002) L.vx = (game.rand() - 0.5) * 3;
        // mola amortecida para o balanço (com teto: spam nunca vira raio negativo)
        const acc = -L.bob * 30 - L.bobV * 3;
        L.bobV = Math.min(80, Math.max(-80, L.bobV + acc * dt));
        L.bob = Math.min(25, Math.max(-25, L.bob + L.bobV * dt));
        if (L.bloom > 0 && L.bloom < BLOOM_T) L.bloom = Math.min(BLOOM_T, L.bloom + dt);
      }
    },
    onRipple(x, y, game){
      if (!game.has('lilies')) return;
      for (const L of lilies){
        const d = Math.hypot(L.x - x, (L.y - y) / 0.35);
        if (d < 220) L.bobV += 40 * (1 - d / 220);
      }
    },
    onClick(x, y, game){
      if (!game.has('lilies') || game.unlockFade('lilies') < 0.5) return false;
      for (const L of lilies){
        const dx = x - L.x, dy = (y - L.y - L.bob) / 0.45;
        if (dx * dx + dy * dy < (L.r + 4) * (L.r + 4)){
          L.bobV += 25;
          if (!L.bloomed){
            L.bloomed = true; L.bloom = 1e-6;
            game.state.liliesBloomed++;
            game.audio.play('bloom', { x: x / game.W, y: 0.4, gain: 1 });
            game.ui.refreshCollection('flower');
            if (lilies.every(l => l.bloomed)) game.achievement('night_bloom');
          } else {
            game.audio.play('pulse', { x: x / game.W, y: 0.4, gain: 1 });
          }
          game.spawnRipple(L.x, L.y + L.r * 0.5, { strength: 0.35, rings: 1 });
          return true;
        }
      }
      return false;
    },
    draw(layer, ctx, game){
      if (!game.has('lilies')) return;
      const fade = game.unlockFade('lilies');
      if (fade <= 0.01) return;
      if (layer === 'lilies'){
        ctx.fillStyle = game.palette.dark;
        for (const L of lilies){
          const y = L.y + L.bob, sway = Math.max(0.7, Math.min(1.3, 1 + L.bob * 0.01));
          ctx.globalAlpha = 0.9 * fade;
          // disco elíptico com um recorte (folha de lírio)
          ctx.beginPath();
          ctx.ellipse(L.x, y, L.r * sway, L.r * 0.45 / sway, 0, 0, TWO_PI);
          ctx.fill();
          ctx.fillStyle = game.palette.horizon;
          ctx.globalAlpha = 0.9 * fade;
          ctx.beginPath();
          ctx.moveTo(L.x, y);
          ctx.lineTo(L.x + Math.cos(L.notch) * L.r * 1.05, y + Math.sin(L.notch) * L.r * 0.5);
          ctx.lineTo(L.x + Math.cos(L.notch + 0.5) * L.r * 1.05, y + Math.sin(L.notch + 0.5) * L.r * 0.5);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = game.palette.dark;
          // brilho de borda molhada: fina elipse mais clara na parte de trás
          ctx.globalAlpha = 0.12 * fade;
          ctx.fillStyle = game.palette.light;
          ctx.beginPath(); ctx.ellipse(L.x, y - L.r * 0.1, L.r * 0.8, L.r * 0.18, 0, Math.PI, TWO_PI); ctx.fill();
          ctx.fillStyle = game.palette.dark;
        }
        ctx.globalAlpha = 1;
      } else if (layer === 'light'){
        // flores brancas abrindo (pétalas = elipses radiais), centro dourado
        for (const L of lilies){
          if (L.bloom <= 0) continue;
          const k = game.ease.smoothstep(L.bloom / BLOOM_T);
          const y = L.y + L.bob - L.r * 0.25;
          const pr = L.r * 0.55 * k;
          ctx.fillStyle = game.palette.light;
          const petals = 8;
          for (let i = 0; i < petals; i++){
            const a = L.rot + i / petals * TWO_PI;
            const px = L.x + Math.cos(a) * pr * 0.55, py = y + Math.sin(a) * pr * 0.25;
            ctx.globalAlpha = 0.28 * fade * k;
            ctx.beginPath(); ctx.ellipse(px, py, pr * 0.6, pr * 0.22, a, 0, TWO_PI); ctx.fill();
          }
          // glow suave sob a flor (sprite cacheado)
          const sp = game.sprite.glow(game.palette.light, 30);
          ctx.globalAlpha = 0.12 * k * fade;
          ctx.drawImage(sp, L.x - L.r, y - L.r * 0.5, L.r * 2, L.r);
          ctx.fillStyle = game.palette.gold;
          ctx.globalAlpha = 0.6 * k * fade;
          ctx.beginPath(); ctx.ellipse(L.x, y, pr * 0.22, pr * 0.12, 0, 0, TWO_PI); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
    }
  });
})();

</script>
<script>
// Lago Quieto — sapo: silhueta na margem com 3 poses (parado, inflado, pulando), coaxa e pula.
(function(){
  'use strict';
  const TWO_PI = Math.PI * 2;
  const JUMP_T = 0.7;
  const frog = { x: 0, y: 0, dir: 1, pose: 0, puff: 0, croakTimer: 50, jumping: 0, jx: 0, jy: 0, tx: 0, ty: 0, blink: 0 };

  function home(game){
    // senta na margem inferior direita (juncos ficam à esquerda)
    frog.x = game.W * (0.72 + game.rand() * 0.18);
    frog.y = game.H - 22 - game.rand() * 10;
    frog.dir = -1;
    frog.croakTimer = 40 + game.rand() * 50;
  }
  function croak(game){
    frog.puff = 1e-6;
    game.audio.play('frog', { x: frog.x / game.W, y: 0.9, gain: 1 });
  }
  function jump(game){
    if (frog.jumping) return;
    frog.jumping = 1e-6; frog.jx = frog.x; frog.jy = frog.y;
    // pula para um ponto próximo na margem, virando-se
    let tx = frog.x + frog.dir * (60 + game.rand() * 50);
    if (tx < game.W * 0.55 || tx > game.W - 30){ frog.dir = -frog.dir; tx = frog.x + frog.dir * 80; }
    frog.tx = Math.min(game.W - 30, Math.max(game.W * 0.55, tx));
    frog.ty = game.H - 22 - game.rand() * 12;
    croak(game);
  }

  LQ.register('frog', {
    init(game){ home(game); },
    onUnlock(id, game){ if (id === 'frog') home(game); },
    onResize(game){
      // volta a sentar na margem inferior (y era relativo ao H antigo); x limitado à faixa da direita
      frog.jumping = 0;
      frog.x = Math.min(game.W - 30, Math.max(game.W * 0.55, frog.x));
      frog.y = game.H - 22 - game.rand() * 10;
    },
    update(dt, game){
      if (!game.has('frog')) return;
      if (frog.x > game.W - 20) home(game); // após resize
      if (frog.puff > 0){ frog.puff += dt; if (frog.puff > 0.45) frog.puff = 0; }
      if (frog.jumping > 0){
        frog.jumping += dt;
        const k = Math.min(1, frog.jumping / JUMP_T);
        frog.x = frog.jx + (frog.tx - frog.jx) * k;
        frog.y = frog.jy + (frog.ty - frog.jy) * k;
        if (k >= 1){
          frog.jumping = 0;
          // pouso na margem: anel na água logo acima
          game.spawnRipple(frog.x - frog.dir * 10, frog.y - 14, { strength: 0.6, rings: 2 });
          game.spawnDrops(frog.x, frog.y - 12, 3);
          game.audio.play('plop', { x: frog.x / game.W, y: 0.9, gain: 0.2 });
        }
        return;
      }
      frog.croakTimer -= dt;
      if (frog.croakTimer <= 0){ frog.croakTimer = 40 + game.rand() * 50; croak(game); }
      frog.blink -= dt;
      if (frog.blink <= -0.15) frog.blink = 3 + game.rand() * 5;
    },
    onClick(x, y, game){
      if (!game.has('frog') || game.unlockFade('frog') < 0.5) return false;
      if (Math.hypot(x - frog.x, y - frog.y) < 60){ jump(game); return true; }
      return false;
    },
    draw(layer, ctx, game){
      if (layer !== 'lilies' || !game.has('frog')) return;
      const fade = game.unlockFade('frog');
      if (fade <= 0.01) return;
      let x = frog.x, y = frog.y, pose = 0, h = 0;
      if (frog.jumping > 0){
        const k = frog.jumping / JUMP_T;
        h = Math.sin(Math.PI * k) * 34; pose = 2;
      } else if (frog.puff > 0) pose = 1;
      const puff = pose === 1 ? Math.sin(Math.PI * frog.puff / 0.45) : 0;
      const d = frog.dir;
      ctx.save();
      ctx.translate(x, y - h);
      ctx.scale(d, 1);
      ctx.fillStyle = game.palette.dark;
      ctx.globalAlpha = 0.95 * fade;
      // corpo
      const bw = 14 + (pose === 2 ? 3 : 0), bh = 9 - (pose === 2 ? 2 : 0);
      ctx.beginPath(); ctx.ellipse(0, -bh, bw, bh, pose === 2 ? -0.35 : 0, 0, TWO_PI); ctx.fill();
      // cabeça
      ctx.beginPath(); ctx.ellipse(10, -bh - 4, 8, 6, 0, 0, TWO_PI); ctx.fill();
      // olhos (protuberâncias)
      ctx.beginPath(); ctx.arc(12, -bh - 9, 2.6, 0, TWO_PI); ctx.arc(7, -bh - 10, 2.4, 0, TWO_PI); ctx.fill();
      // papo inflado
      if (puff > 0){
        ctx.globalAlpha = 0.85 * fade;
        ctx.beginPath(); ctx.ellipse(10, -bh + 2, 6 + 6 * puff, 4 + 5 * puff, 0, 0, TWO_PI); ctx.fill();
        ctx.globalAlpha = 0.95 * fade;
      }
      // pernas
      ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.strokeStyle = game.palette.dark;
      ctx.beginPath();
      if (pose === 2){
        ctx.moveTo(-10, -bh); ctx.lineTo(-20, -bh + 4); ctx.lineTo(-30, -bh + 10); // traseira esticada
        ctx.moveTo(8, -bh + 4); ctx.lineTo(14, -bh + 12);                          // dianteira
      } else {
        ctx.moveTo(-10, -bh + 2); ctx.lineTo(-18, -bh - 4); ctx.lineTo(-14, 0);    // traseira dobrada
        ctx.moveTo(8, -bh + 5); ctx.lineTo(10, 0);                                 // dianteira
      }
      ctx.stroke();
      // reflexo dos olhos (pisca)
      if (frog.blink > 0 && pose !== 2){
        ctx.fillStyle = game.palette.light;
        ctx.globalAlpha = 0.5 * fade;
        ctx.fillRect(12, -bh - 10, 1.5, 1.5); ctx.fillRect(7, -bh - 11, 1.5, 1.5);
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  });
})();

<script>
// Céu: estrelas, lua, nuvem, estrela cadente, aurora, montanhas, pássaros do amanhecer.
(function(){
  'use strict';
  const LQ = window.LQ;
  const TAU = Math.PI * 2;

  // PRNG local com semente fixa (formas estáveis entre resizes)
  function mkRand(seed){ let s = seed | 1; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
  function hexToRgb(h){ const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function lerpHex(a, b, t){
    const A = hexToRgb(a), B = hexToRgb(b);
    return '#' + [0, 1, 2].map(i => Math.max(0, Math.min(255, Math.round(A[i] + (B[i] - A[i]) * t))).toString(16).padStart(2, '0')).join('');
  }

  // ---------- estrelas ----------
  const STAR_TOTAL = 60, DYN = 12;
  const stars = [];        // {nx, ny, size, phase, speed}
  let starCv = null, starCvN = -1, starCvW = 0, starCvH = 0, starCvVer = -1;
  let visibleN = 15;
  let lastW = 0, lastH = 0;

  // ---------- lua ----------
  let moonCv = null, moonKey = '';
  let moonRise = null;     // game.t em que começou a nascer (null = ainda não)
  const MOON_RISE_T = 90;
  let cloudX = -1, cloudSpeed = 8;

  // ---------- estrela cadente ----------
  let shootTimer = 0;
  const shoot = { active: false, x: 0, y: 0, vx: 0, vy: 0, age: 0 };

  // ---------- aurora ----------
  let auroraCv = null, auroraCtx = null;

  // ---------- montanhas ----------
  let mBack = null, mFront = null;
  let mColVer = -1, mColBack = '#000', mColFront = '#000';

  // ---------- pássaros ----------
  const birds = [];        // {x, y, vx, phase}
  let prevPhase = -1, dawnDone = false;


  function buildStars(game){
    stars.length = 0;
    const r = mkRand(7331);
    for (let i = 0; i < STAR_TOTAL; i++){
      stars.push({ nx: r(), ny: Math.pow(r(), 0.8), size: r() < 0.25 ? 2 : 1, phase: r() * TAU, speed: 0.6 + r() * 1.6, a: 0.35 + r() * 0.5 });
    }
  }
  function starCount(game){
    return Math.round(15 + 20 * game.unlockFade('stars2') + 25 * game.unlockFade('sky_alive'));
  }
  // Bakea as estrelas assentadas (todas menos as DYN dinâmicas) num offscreen
  function bakeStars(game, n){
    const W = game.W, hy = game.horizonY;
    if (!starCv) starCv = document.createElement('canvas');
    starCv.width = W; starCv.height = hy;
    const g = starCv.getContext('2d');
    g.fillStyle = game.palette.light;
    const settled = Math.max(0, n - DYN);
    for (let i = 0; i < settled; i++){
      const s = stars[i];
      g.globalAlpha = s.a * 0.8;
      g.fillRect(Math.round(s.nx * W), Math.round(s.ny * hy), s.size, s.size);
    }
    starCvN = n; starCvW = W; starCvH = hy; starCvVer = game.paletteVersion;
  }

  function buildMoon(game){
    const R = Math.max(8, Math.round(Math.min(game.W, game.H) * 0.035));
    const key = R + '|' + game.palette.light;
    if (key === moonKey && moonCv) return R;
    moonKey = key;
    const G = R * 3;
    if (!moonCv) moonCv = document.createElement('canvas'); // reutiliza o offscreen
    moonCv.width = moonCv.height = G * 2;
    const g = moonCv.getContext('2d');
    const grad = g.createRadialGradient(G, G, R * 0.9, G, G, G);
    grad.addColorStop(0, game.palette.light + '55');
    grad.addColorStop(0.4, game.palette.light + '18');
    grad.addColorStop(1, game.palette.light + '00');
    g.fillStyle = grad; g.fillRect(0, 0, G * 2, G * 2);
    g.fillStyle = game.palette.light;
    g.beginPath(); g.arc(G, G, R, 0, TAU); g.fill();
    // leve sombra de crateras
    g.fillStyle = game.palette.horizon; g.globalAlpha = 0.12;
    g.beginPath(); g.arc(G - R * 0.3, G - R * 0.2, R * 0.28, 0, TAU); g.fill();
    g.beginPath(); g.arc(G + R * 0.35, G + R * 0.3, R * 0.18, 0, TAU); g.fill();
    return R;
  }

  function buildMountains(game){
    const W = game.W, hy = game.horizonY;
    const r = mkRand(4242);
    function ridge(hMax, seg, yBase){
      const p = new Path2D();
      p.moveTo(-10, hy + 4);
      p.lineTo(-10, hy - yBase);
      let x = -10;
      const step = W / seg;
      for (let i = 0; i <= seg + 1; i++){
        const h = hMax * (0.35 + 0.65 * Math.abs(Math.sin(i * 1.7 + r() * 0.8)) * (0.6 + 0.4 * r()));
        x = -10 + i * step;
        p.lineTo(x, hy - yBase - h);
      }
      p.lineTo(W + 10, hy - yBase);
      p.lineTo(W + 10, hy + 4);
      p.closePath();
      return p;
    }
    mBack = ridge(hy * 0.22, 9, hy * 0.02);
    mFront = ridge(hy * 0.13, 14, 0);
  }

  function ensureAurora(game){
    const w = Math.max(48, Math.round(game.W / 8)), h = Math.max(32, Math.round(game.horizonY / 2)); // 1/8: mais blur de graça
    if (!auroraCv){ auroraCv = document.createElement('canvas'); auroraCtx = auroraCv.getContext('2d'); }
    if (auroraCv.width !== w || auroraCv.height !== h){ auroraCv.width = w; auroraCv.height = h; }
  }
  // Redesenha o offscreen da aurora: 6 faixas com alpha senoidal, bordas verticais suaves
  // (3 retângulos empilhados por coluna), ondas com fase/frequência distintas por faixa, janela
  // horizontal suave (não vai de borda a borda) e faixas de baixo esmaecendo (sem 'degrau').
  function paintAurora(game, k){
    ensureAurora(game);
    const g = auroraCtx, w = auroraCv.width, h = auroraCv.height, t = game.t;
    g.clearRect(0, 0, w, h);
    const cols = [game.palette.auroraG, game.palette.auroraP];
    const sx = (game.W / 4) / w; // frequências em 'px de offscreen 1/4' (spec), independentes da escala real
    for (let b = 0; b < 6; b++){
      g.fillStyle = cols[b % 2];
      const yb = h * (0.08 + b * 0.13), bh = h * 0.14;
      const fadeB = b >= 4 ? (b === 4 ? 0.7 : 0.4) : 1;
      for (let x = 0; x < w; x += 2){
        const X = x * sx;
        const a = 0.5 + 0.5 * Math.sin(X * 0.025 + t * 0.3 + b * 0.7);
        const y = yb + Math.sin(X * 0.05 * (0.6 + b * 0.15) + t * 0.2 + b * 1.9) * h * 0.12
                     + Math.sin(X * 0.013 + t * 0.07 + b) * h * 0.05;
        const win = Math.pow(Math.sin(Math.PI * (x + 1) / (w + 2)), 0.6); // janela horizontal
        const base = (0.045 + 0.045 * a) * k * 0.55 * win * fadeB;
        g.globalAlpha = base * 0.35; g.fillRect(x, y - bh * 0.6, 2, bh);
        g.globalAlpha = base;        g.fillRect(x, y, 2, bh);
        g.globalAlpha = base * 0.35; g.fillRect(x, y + bh * 0.6, 2, bh);
      }
    }
    g.globalAlpha = 1;
  }

  LQ.register('sky', {
    init(game){
      buildStars(game);
      buildMountains(game);
      lastW = game.W; lastH = game.H;
      shootTimer = 120 + game.rand() * 120;
      cloudX = -game.W * 0.2;
      // lua já desbloqueada em sessão anterior: nasce imediatamente cheia
      if (game.has('moon')) moonRise = -MOON_RISE_T; // já cheia
      dawnDone = game.state.achievements.indexOf('until_dawn') >= 0;
    },

    onUnlock(id, game){
      if (id === 'moon' && moonRise === null) moonRise = game.t;
      if (id === 'sky_alive') shootTimer = 30 + game.rand() * 60;
    },

    onResize(game){ lastW = game.W; lastH = game.H; buildMountains(game); starCvN = -1; },
    update(dt, game){
      if (game.W !== lastW || game.H !== lastH){ lastW = game.W; lastH = game.H; buildMountains(game); starCvN = -1; }
      visibleN = starCount(game);

      // nuvem fina cruzando a lua
      if (game.has('sky_alive')){
        cloudX += cloudSpeed * dt;
        if (cloudX > game.W * 1.3) cloudX = -game.W * 0.3;
      }

      // estrela cadente
      if (game.has('sky_alive') && game.dayPhase < 0.3){
        if (!shoot.active){
          shootTimer -= dt;
          if (shootTimer <= 0){
            shootTimer = 120 + game.rand() * 120;
            shoot.active = true; shoot.age = 0;
            shoot.x = game.W * (0.1 + game.rand() * 0.8); shoot.y = game.horizonY * (0.05 + game.rand() * 0.4);
            const dir = game.rand() < 0.5 ? -1 : 1, sp = 500 + game.rand() * 300;
            shoot.vx = dir * sp; shoot.vy = sp * (0.25 + game.rand() * 0.25);
            game.audio.play('shooting', { x: shoot.x / game.W, gain: 1 });
          }
        } else {
          shoot.age += dt; shoot.x += shoot.vx * dt; shoot.y += shoot.vy * dt;
          if (shoot.age > 0.4) shoot.active = false;
        }
      }

      // lua
      if (moonRise !== null){
        const R = buildMoon(game);
        const k = game.ease.smoothstep((game.t - moonRise) / MOON_RISE_T);
        game.moonR = R;
        game.moonX = game.W * 0.78;
        game.moonY = game.horizonY + R * 1.5 - k * (game.horizonY + R * 1.5 - game.horizonY * 0.32);
        if (k >= 1 && moonRise >= 0) game.achievement('full_moon'); // só se nasceu nesta sessão
      } else game.moonR = 0;

      // amanhecer: pássaros ao começar a clarear; achievement no dia pleno
      if (game.has('dawn')){
        const ph = game.dayPhase;
        if (prevPhase >= 0 && prevPhase < 0.15 && ph >= 0.15 && ph > prevPhase){
          birds.length = 0;
          const dir = game.rand() < 0.5 ? 1 : -1;
          for (let i = 0; i < 3; i++){
            birds.push({ x: dir > 0 ? -40 - i * 30 : game.W + 40 + i * 30, y: game.horizonY * (0.3 + i * 0.07 + game.rand() * 0.05), vx: dir * (35 + game.rand() * 10), phase: game.rand() * TAU });
          }
          game.audio.play('birds', { x: dir > 0 ? 0.1 : 0.9, gain: 1 });
        }
        if (ph >= 0.99 && !dawnDone){ dawnDone = true; game.achievement('until_dawn'); }
        prevPhase = ph;
      }
      for (let i = birds.length - 1; i >= 0; i--){
        const b = birds[i]; b.x += b.vx * dt; b.phase += dt * 6;
        if (b.x < -80 || b.x > game.W + 80) birds.splice(i, 1);
      }
    },

    draw(layer, ctx, game){
      const W = game.W, hy = game.horizonY, P = game.palette;
      const night = 1 - game.dayPhase; // estrelas somem de dia

      if (layer === 'sky'){
        if (starCvN !== visibleN || starCvW !== W || starCvH !== hy || starCvVer !== game.paletteVersion) bakeStars(game, visibleN);
        if (night > 0.02){
          ctx.globalAlpha = night;
          ctx.drawImage(starCv, 0, 0);
          // estrelas dinâmicas (piscam mais com o vento)
          const wind = 0.5 + 0.5 * game.unlockFade('wind');
          ctx.fillStyle = P.light;
          const from = Math.max(0, visibleN - DYN);
          for (let i = from; i < visibleN; i++){
            const s = stars[i];
            const tw = 0.5 + 0.5 * Math.sin(game.t * s.speed + s.phase);
            ctx.globalAlpha = night * s.a * (1 - wind * 0.7 + wind * 0.7 * tw);
            ctx.fillRect(Math.round(s.nx * W), Math.round(s.ny * hy), s.size, s.size);
          }
          ctx.globalAlpha = 1;
        }
        // pássaros do amanhecer (3 chevrons)
        if (birds.length){
          ctx.strokeStyle = P.dark; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.6;
          for (const b of birds){
            const f = 3 + 2 * Math.sin(b.phase);
            ctx.beginPath(); ctx.moveTo(b.x - 6, b.y - f); ctx.lineTo(b.x, b.y); ctx.lineTo(b.x + 6, b.y - f); ctx.stroke();
          }
          ctx.globalAlpha = 1;
        }
      }

      else if (layer === 'aurora'){
        const k = game.unlockFade('aurora') * night;
        if (k <= 0.01) return;
        paintAurora(game, k);
        ctx.drawImage(auroraCv, 0, 0, W, hy * 0.7);
      }

      else if (layer === 'moon'){
        if (moonRise !== null && game.moonR > 0){
          const R = game.moonR, G = R * 3;
          ctx.globalAlpha = 0.55 + 0.45 * night;
          ctx.drawImage(moonCv, game.moonX - G, game.moonY - G, G * 2, G * 2);
          ctx.globalAlpha = 1;
          // nuvem fina
          if (game.has('sky_alive')){
            ctx.fillStyle = P.light; ctx.globalAlpha = 0.08 * game.unlockFade('sky_alive');
            ctx.beginPath(); ctx.ellipse(cloudX, game.moonY + R * 0.3, R * 3.2, R * 0.45, 0, 0, TAU); ctx.fill();
            ctx.beginPath(); ctx.ellipse(cloudX + R * 1.5, game.moonY + R * 0.55, R * 2, R * 0.3, 0, 0, TAU); ctx.fill();
            ctx.globalAlpha = 1;
          }
        }
      }

      else if (layer === 'mountains'){
        const k = game.unlockFade('fog_clear');
        if (k <= 0.01 || !mBack) return;
        const px = game.mouse.x < 0 ? 0 : (game.mouse.x / W - 0.5) * 2; // parallax 2 px
        ctx.globalAlpha = k;
        if (mColVer !== game.paletteVersion){ // cores só mudam com a paleta
          mColVer = game.paletteVersion;
          mColBack = lerpHex(P.horizon, P.zenith, 0.45);
          mColFront = lerpHex(lerpHex(P.horizon, P.zenith, 0.85), P.dark, 0.25);
        }
        ctx.fillStyle = mColBack;
        ctx.translate(px * 0.5, 0); ctx.fill(mBack); ctx.translate(-px * 0.5, 0);
        ctx.fillStyle = mColFront;
        ctx.translate(px, 0); ctx.fill(mFront); ctx.translate(-px, 0);
        ctx.globalAlpha = 1;
      }

      else if (layer === 'water'){
        // reflexo espelhado das estrelas perto do horizonte (alpha 0.35)
        if (night > 0.02 && starCv){
          const sh = Math.round(hy * 0.4);
          ctx.globalAlpha = 0.35 * night;
          ctx.save(); ctx.translate(0, hy); ctx.scale(1, -1);
          ctx.drawImage(starCv, 0, hy - sh, W, sh, 0, -sh, W, sh);
          ctx.restore();
          // aurora refletida
          const ka = game.eco ? 0 : game.unlockFade('aurora') * night;
          if (ka > 0.01 && auroraCv){
            ctx.globalAlpha = 0.15 * night;
            ctx.save(); ctx.translate(0, hy); ctx.scale(1, -1);
            ctx.drawImage(auroraCv, 0, -hy * 0.7, W, hy * 0.7);
            ctx.restore();
          }
          ctx.globalAlpha = 1;
        }
      }

      else if (layer === 'light'){
        if (shoot.active){
          const f = 1 - shoot.age / 0.4;
          ctx.strokeStyle = P.light; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.7 * f;
          ctx.beginPath(); ctx.moveTo(shoot.x, shoot.y); ctx.lineTo(shoot.x - shoot.vx * 0.12, shoot.y - shoot.vy * 0.12); ctx.stroke();
          const sp = game.sprite.glow(P.light, 10);
          ctx.globalAlpha = 0.6 * f;
          ctx.drawImage(sp, shoot.x - 10, shoot.y - 10, 20, 20);
          ctx.globalAlpha = 1;
        }
      }
    }
  });
})();

</script>
<script>
// Névoa baixa: faixa com gradiente cacheado (game.fogSprite), alpha 0.15, offset senoidal; dissipa em 60 s.
(function(){
  'use strict';
  const LQ = window.LQ;
  const BASE_A = 0.15, CLEAR_T = 60;
  let clearAt = -1;   // game.t em que começou a dissipar
  let alpha = BASE_A;

  LQ.register('fog', {
    init(game){
      if (game.has('fog_clear')){ clearAt = -CLEAR_T; alpha = 0; }
    },
    onUnlock(id, game){
      if (id === 'fog_clear' && clearAt < 0){
        clearAt = game.t;
        game.audio.ambient.set({ fogOpen: true });
      }
    },
    update(dt, game){
      let k = 1;
      if (clearAt >= 0) k = 1 - game.ease.smoothstep((game.t - clearAt) / CLEAR_T);
      alpha = BASE_A * k * (1 - 0.6 * game.dayPhase);
    },
    draw(layer, ctx, game){
      if (layer !== 'fog' || alpha < 0.003) return;
      const sp = game.fogSprite; if (!sp) return;
      const off = Math.sin(game.t * 0.3) * 10;
      const y = game.horizonY - sp.height * 0.45;
      ctx.globalAlpha = alpha;
      ctx.drawImage(sp, -20 + off, y);
      // segunda passada mais tênue e defasada dá profundidade
      ctx.globalAlpha = alpha * 0.4;
      ctx.drawImage(sp, -20 - off * 0.6, y + sp.height * 0.25);
      ctx.globalAlpha = 1;
    }
  });
})();

</script>

window.LQ = window.LQ || {};
(function(){
  'use strict';
  const LQ = window.LQ;

  // ---------- Paletas (mesmas chaves de game.palette; núcleo lerpa night→day) ----------
  const T = LQ.themes = LQ.themes || {};
  T.night = {}; // padrão do núcleo
  T.winter = {
    night: { zenith: '#04060c', horizon: '#0a1220', shore: '#0c1a2a', ring: '#8fb3c9',
      light: '#eaf3ff', firefly: '#ffb347', gold: '#f0c060', dark: '#0a1a18',

      light: '#ffffff', firefly: '#ffb347', gold: '#f0c060', dark: '#1d2f36',
      auroraG: '#9fd8e6', auroraP: '#8a8ad0', dawn: '#e8e0e8', fog: '#ffffff' }
  };
  T.autumn = {
    night: { zenith: '#0c0810', horizon: '#2a1a14', shore: '#3a2416', ring: '#a86a3c',
      light: '#ffe6c4', firefly: '#ffd27a', gold: '#f0a030', dark: '#1a120a',
      auroraG: '#c98a4a', auroraP: '#8a4a5c', dawn: '#f2a882', fog: '#f5e2c8' },
    day:   { zenith: '#6a7aa0', horizon: '#d8b090', shore: '#7a5a3a', ring: '#d8a070',
      light: '#fff4e0', firefly: '#ffd27a', gold: '#f0a030', dark: '#2a1e10',
      auroraG: '#c98a4a', auroraP: '#8a4a5c', dawn: '#f2b8a2', fog: '#f5e2c8' }
  };
  T.ink = {
    night: { zenith: '#f4f1ea', horizon: '#e6e2d8', shore: '#d8d3c6', ring: '#1a1a1a',
      light: '#5a5650', firefly: '#8a8478', gold: '#3a3a3a', dark: '#141414',
      auroraG: '#c8c4bc', auroraP: '#bdb8b0', dawn: '#e0dcd4', fog: '#f4f1ea' },
    day:   { zenith: '#faf8f2', horizon: '#eeeae0', shore: '#e0dbd0', ring: '#1a1a1a',
      light: '#5a5650', firefly: '#8a8478', gold: '#3a3a3a', dark: '#141414',
      auroraG: '#d0ccc4', auroraP: '#c8c4bc', dawn: '#e6e2d8', fog: '#faf8f2' }
  };
  T.tropical = {
    night: { zenith: '#03101c', horizon: '#064a5c', shore: '#0a8a8a', ring: '#5ff0ff',
      light: '#eafcff', firefly: '#b8ff7a', gold: '#ffc34a', dark: '#062a22',
      auroraG: '#3fe0c0', auroraP: '#5a7ad8', dawn: '#ffb08a', fog: '#d8ffff' },
    day:   { zenith: '#3a9ad0', horizon: '#9fe0f0', shore: '#20b0b8', ring: '#a0ffff',
      light: '#ffffff', firefly: '#b8ff7a', gold: '#ffc34a', dark: '#0a3a2a',
      auroraG: '#3fe0c0', auroraP: '#5a7ad8', dawn: '#ffc8a8', fog: '#e8ffff' }
  };
  LQ.themeList = ['night', 'winter', 'autumn', 'ink', 'tropical'];

  // ---------- Pools de partículas ----------
  const SNOW_MAX = 90, LEAF_MAX = 28, STROKE_MAX = 40, BIO_MAX = 120;
  const snow = [], leaves = [], strokes = [], bio = [];
  for (let i = 0; i < SNOW_MAX; i++) snow.push({ x: 0, y: 0, vx: 0, vy: 0, r: 1, ph: 0, a: 0 });
  for (let i = 0; i < LEAF_MAX; i++) leaves.push({ x: 0, y: 0, vx: 0, vy: 0, rot: 0, vr: 0, w: 6, h: 3, ph: 0, water: false, bob: 0, c: 0, alive: false });
  for (let i = 0; i < STROKE_MAX; i++) strokes.push({ active: false, x: 0, y: 0, age: 0, seed: 0 });
  for (let i = 0; i < BIO_MAX; i++) bio.push({ active: false, x: 0, y: 0, ang: 0, age: 0, life: 1, rad: 0 });
  let strokeCur = 0, bioCur = 0, leafTimer = 0;
  const LEAF_COLORS = ['#b8452a', '#d0642e', '#a83a2a', '#c8863a', '#8a2e22'];

  let theme = 'night', ready = false;
  let themeAt = -1e9; // game.t da última troca: entidades do tema entram em fade (§3, "nunca pop")
  function themeFade(game){ return game.ease.smoothstep((game.t - themeAt) / 5); }

  function cap(n, game){ return game.eco ? Math.floor(n * 0.5) : n; }

  // ---------- Neve (inverno) ----------
  function resetFlake(f, game, top){
    f.x = game.rand() * (game.W + 40) - 20;
    f.y = top ? -4 : game.rand() * game.H;
    f.vy = 14 + game.rand() * 26; f.vx = 0;
    f.r = 0.8 + game.rand() * 1.4; f.ph = game.rand() * 6.28;
    f.a = 0.35 + game.rand() * 0.45;
  }
  function updateSnow(dt, game){
    const n = cap(SNOW_MAX, game), wind = game.has('wind') ? 8 : 3;
    for (let i = 0; i < n; i++){
      const f = snow[i];
      f.ph += dt; f.y += f.vy * dt; f.x += (Math.sin(f.ph * 1.3) * 6 + wind) * dt;
      if (f.y > game.H + 4 || f.x > game.W + 30) resetFlake(f, game, true);
    }
  }
  function drawSnow(ctx, game){
    const n = cap(SNOW_MAX, game);
    ctx.fillStyle = game.palette.light;
    const tf = themeFade(game);
    for (let i = 0; i < n; i++){
      const f = snow[i];
      // flocos sobre a água ficam mais fracos (quase derretendo)
      ctx.globalAlpha = (f.y > game.horizonY ? f.a * 0.5 : f.a) * tf;
      ctx.fillRect(f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
    }
    ctx.globalAlpha = 1;
  }
  // gelo fino nas bordas: 2 polígonos claros junto à margem
  function drawIce(ctx, game){
    const W = game.W, H = game.H, tf = themeFade(game);
    ctx.fillStyle = game.palette.light;
    ctx.globalAlpha = 0.07 * tf;
    ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, H - 70); ctx.quadraticCurveTo(W * 0.12, H - 55, W * 0.22, H); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(W, H); ctx.lineTo(W, H - 55); ctx.quadraticCurveTo(W * 0.9, H - 40, W * 0.8, H); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 0.12 * tf;
    ctx.beginPath(); ctx.moveTo(0, H - 70); ctx.quadraticCurveTo(W * 0.12, H - 55, W * 0.22, H); ctx.lineWidth = 1; ctx.strokeStyle = game.palette.light; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W, H - 55); ctx.quadraticCurveTo(W * 0.9, H - 40, W * 0.8, H); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---------- Folhas (outono) ----------
  function spawnLeaf(game, onWater){
    let l = null;
    for (let i = 0; i < LEAF_MAX; i++) if (!leaves[i].alive){ l = leaves[i]; break; }
    if (!l) return;
    l.alive = true; l.x = game.rand() * game.W;
    l.y = onWater ? game.horizonY + 10 + game.rand() * (game.H - game.horizonY - 20) : -6;
    l.water = onWater; l.vx = 0; l.vy = onWater ? 0 : 18 + game.rand() * 20;
    l.rot = game.rand() * 6.28; l.vr = (game.rand() - 0.5) * 2;
    l.w = 5 + game.rand() * 4; l.h = l.w * 0.5; l.ph = game.rand() * 6.28; l.bob = 0;
    l.c = Math.floor(game.rand() * LEAF_COLORS.length);
  }
  function updateLeaves(dt, game){
    leafTimer -= dt;
    const target = cap(LEAF_MAX, game);
    if (leafTimer <= 0){ leafTimer = 2 + game.rand() * 4; let alive = 0; for (const l of leaves) if (l.alive) alive++; if (alive < target) spawnLeaf(game, false); }
    const wind = game.has('wind') ? 10 : 4;
    for (const l of leaves){
      if (!l.alive) continue;
      l.ph += dt;
      if (!l.water){
        l.y += l.vy * dt; l.x += (Math.sin(l.ph * 1.1) * 14 + wind) * dt; l.rot += l.vr * dt;
        // toca a água: passa a flutuar (anel fraquinho, sem som)
        if (l.y > game.horizonY + 8 + (l.x / game.W) * (game.H - game.horizonY) * 0.9){
          l.water = true; l.vy = 0; l.vr *= 0.2;
          game.spawnRipple(l.x, l.y, { strength: 0.3, rings: 1 });
        }
      } else {
        l.vx *= (1 - 1.5 * dt); l.vy *= (1 - 1.5 * dt);
        l.x += (l.vx + Math.sin(l.ph * 0.4) * 3 + wind * 0.15) * dt; l.y += l.vy * dt;
        l.rot += l.vr * dt; l.bob *= (1 - 2.5 * dt);
        if (l.x > game.W + 20 || l.x < -20 || l.y > game.H + 10 || l.y < game.horizonY) l.alive = false;
      }
    }
  }
  function drawLeaves(ctx, game){
    const tf = themeFade(game);
    for (const l of leaves){
      if (!l.alive) continue;
      const y = l.y + (l.water ? Math.sin(l.ph * 5) * l.bob : 0);
      ctx.fillStyle = LEAF_COLORS[l.c];
      ctx.globalAlpha = (l.water ? 0.8 : 0.9) * tf;
      ctx.save(); ctx.translate(l.x, y); ctx.rotate(l.rot);
      ctx.beginPath(); ctx.ellipse(0, 0, l.w, l.water ? l.h * 0.55 : l.h, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  function pushLeaves(x, y, game){
    for (const l of leaves){
      if (!l.alive || !l.water) continue;
      const dx = l.x - x, dy = (l.y - y) / 0.35, d = Math.sqrt(dx * dx + dy * dy);
      if (d > 160 || d < 1) continue;
      const k = (1 - d / 160) * 40;
      l.vx += dx / d * k; l.vy += dy / d * k * 0.35; l.vr += (game.rand() - 0.5) * 1.5; l.bob = 2.5 * (1 - d / 160);
    }
  }

  // ---------- Pinceladas (tinta) ----------
  function addStroke(x, y, game){
    const s = strokes[strokeCur]; strokeCur = (strokeCur + 1) % STROKE_MAX;
    s.active = true; s.x = x; s.y = y; s.age = 0; s.seed = game.rand() * 100;
  }
  function updateStrokes(dt){
    for (const s of strokes){ if (!s.active) continue; s.age += dt; if (s.age > 1.8) s.active = false; }
  }
  // anel como pincelada: segmentos com lineWidth variável e falhas (pincel seco)
  function drawStrokes(ctx, game){
    ctx.strokeStyle = game.palette.ring; ctx.lineCap = 'round';
    const SEG = 14;
    for (const s of strokes){
      if (!s.active) continue;
      const f = 1 - s.age / 1.8, rad = s.age * 60;
      if (rad < 2) continue;
      const alpha = 0.85 * f * f;
      if (alpha < 0.02) continue;
      ctx.globalAlpha = alpha;
      for (let i = 0; i < SEG; i++){
        const a0 = i / SEG * Math.PI * 2, a1 = (i + 1) / SEG * Math.PI * 2;
        const wv = Math.sin(a0 * 3 + s.seed) * 0.5 + 0.5;
        if (wv < 0.18 && s.age > 0.5) continue; // falha de tinta
        ctx.lineWidth = (0.6 + wv * 3.2) * (0.5 + 0.5 * f);
        ctx.beginPath();
        ctx.ellipse(s.x, s.y, rad, rad * 0.35, 0, a0, a1);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1; ctx.lineWidth = 1.5; ctx.lineCap = 'butt';
  }

  // ---------- Bioluminescência (tropical) ----------
  function addBio(x, y, game){
    const n = cap(14, game);
    for (let k = 0; k < n; k++){
      const b = bio[bioCur]; bioCur = (bioCur + 1) % BIO_MAX;
      b.active = true; b.x = x; b.y = y; b.ang = game.rand() * Math.PI * 2;
      b.age = 0; b.life = 0.9 + game.rand() * 1.1; b.rad = 0.4 + game.rand() * 0.6;
    }
  }
  function updateBio(dt){
    for (const b of bio){ if (!b.active) continue; b.age += dt; if (b.age > b.life) b.active = false; }
  }
  function drawBio(ctx, game){
    const sp = game.sprite.glow('#3fd8ff', 10);
    for (const b of bio){
      if (!b.active) continue;
      const k = b.age / b.life, r = b.age * 60 * b.rad;
      const x = b.x + Math.cos(b.ang) * r, y = b.y + Math.sin(b.ang) * r * 0.35;
      ctx.globalAlpha = 0.55 * Math.sin(Math.PI * k) * (k < 1 ? 1 : 0);
      const sz = 8 + 10 * k;
      ctx.drawImage(sp, x - sz, y - sz, sz * 2, sz * 2);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Achievements (§8) não cobertos pelo núcleo ----------
  // Núcleo já dá: first_stone, woke_someone, clear_view, aurora, just_watching, accidental_melody, left_light_on, thousand_ripples.
  // golden_fish/night_bloom: ent/fish.js e ent/lilies.js; full_moon/until_dawn: ent/sky.js.

  // ---------- Troca de tema ----------
  function applyTheme(name, game){
    theme = LQ.themeList.indexOf(name) >= 0 ? name : 'night';
    themeAt = ready ? game.t : -1e9; // no init entra pronto; troca em jogo faz fade de 5 s
    game.lightBlend = theme === 'ink' ? 'multiply' : 'lighter'; // glows em papel claro: escurecem em vez de lavar
    game.audio.setTheme(theme);
    game.hideCoreRipples = theme === 'ink'; // tinta: pinceladas substituem os anéis do núcleo
    document.body.classList.remove('theme-night', 'theme-winter', 'theme-autumn', 'theme-ink', 'theme-tropical');
    document.body.classList.add('theme-' + theme);
    // ícones da UI acompanham a tinta (tema claro)
    document.documentElement.style.setProperty('--ico', theme === 'ink' ? '#1a1a1a' : '#e9f2ff');
    if (theme === 'winter') for (let i = 0; i < SNOW_MAX; i++) resetFlake(snow[i], game, false);
    if (theme === 'autumn'){ for (const l of leaves) l.alive = false; for (let i = 0; i < 8; i++) spawnLeaf(game, true); }
    for (const s of strokes) s.active = false;
    for (const b of bio) b.active = false;
  }

  LQ.register('themes', {
    init(game){
      applyTheme(game.state.theme, game);
      ready = true;
    },
    onTheme(name, game){ applyTheme(name, game); },
    update(dt, game){
      if (!ready) return;
      if (game.state.theme !== theme) applyTheme(game.state.theme, game);
      if (theme === 'winter') updateSnow(dt, game);
      else if (theme === 'autumn') updateLeaves(dt, game);
      else if (theme === 'ink') updateStrokes(dt);
      else if (theme === 'tropical') updateBio(dt);
    },
    onRipple(x, y, game){
      if (theme === 'autumn') pushLeaves(x, y, game);
      else if (theme === 'ink') addStroke(x, y, game);
      else if (theme === 'tropical') addBio(x, y, game);
    },
    draw(layer, ctx, game){
      if (theme === 'winter'){
        if (layer === 'lilies') drawIce(ctx, game);
        else if (layer === 'fog') drawSnow(ctx, game);
      } else if (theme === 'autumn'){
        if (layer === 'lilies') drawLeaves(ctx, game);
      } else if (theme === 'ink'){
        if (layer === 'ripples') drawStrokes(ctx, game);
      } else if (theme === 'tropical'){
        if (layer === 'light') drawBio(ctx, game); // eco: metade das partículas (cap)
      }
    }
  });
})();

</script>
<script>LQ.start();</script>
