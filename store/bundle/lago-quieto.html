  }

  // ---------- Pedras caindo e brilhos do céu ----------
  const stones = [], glows = [];
  const STONE_T = 0.25;
  function throwStone(x, y){
    stones.push({ x, y, age: 0 });
  }
  let lastNoteAt = -1, ascRun = 0, lastDegree = -1;
  function impact(x, y){
    const s = game.state;
    spawnRipple(x, y, { strength: 1, rings: 3 });
    spawnDrops(x, y, 3 + Math.floor(rand() * 4));
    s.ripples++;
    game.calm = Math.min(20, game.calm + 1);
    game.emit('impact', { x, y, strength: 1, source: 'stone' });
    // Áudio: plop + nota (x → nota, y → oitava); nota só se >80 ms desde a anterior
    const nx = clamp(x / game.W, 0, 1), ny = clamp((y - game.horizonY) / (game.H - game.horizonY), 0, 1);
    // gain é relativo (1 = valor de projeto do §6; audio.js aplica os absolutos)
    game.audio.play('plop', { x: nx, y: ny, gain: 1 });
    const now = performance.now();
    if (now - lastNoteAt >= 80){
      game.audio.play('note', { x: nx, y: ny, gain: game.noteGain() });
      lastNoteAt = now;
      const deg = Math.min(4, Math.floor(nx * 5)); // "Melodia Acidental": 5 notas ascendentes
      ascRun = deg > lastDegree ? ascRun + 1 : 1; lastDegree = deg;
      if (ascRun >= 5) game.achievement('accidental_melody');
    }
    if (s.ripples === 1) game.achievement('first_stone');
    if (s.ripples >= 1000) game.achievement('thousand_ripples');
  }
  function updateStones(dt){
    for (let i = stones.length - 1; i >= 0; i--){
      const st = stones[i]; st.age += dt;
      if (st.age >= STONE_T){
        stones.splice(i, 1);
        if (st.dew){
          // gota de orvalho: anel menor, sem contar ripple
          spawnRipple(st.x, st.y, { strength: 0.55, rings: 2 });
          spawnDrops(st.x, st.y, 2);
          game.audio.play('dew', { x: st.x / game.W, y: 0.5, gain: 1 });
        } else impact(st.x, st.y);
      }
    }
    for (let i = glows.length - 1; i >= 0; i--){ glows[i].age += dt; if (glows[i].age >= 0.3) glows.splice(i, 1); }
  }
  function drawStones(){
    ctx.fillStyle = game.palette.light;
    for (const st of stones){
      const k = ease.easeInQuad(st.age / STONE_T);
      // pedra: arco leve; orvalho: cai reto da altura do junco
      const h = st.dew ? st.fallH : 40;
      const y = st.y - h * (1 - k), x = st.x - (st.dew ? 0 : 8) * (1 - k);
      ctx.globalAlpha = st.dew ? 0.6 : 0.9;
      ctx.beginPath(); ctx.arc(x, y, st.dew ? 1.5 : 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function drawGlows(){
    for (const g of glows){
      const k = 1 - g.age / 0.3;
      const sp = glowSprite(game.palette.light, 40);
      ctx.globalAlpha = 0.12 * Math.sin(Math.PI * (1 - k));
      ctx.drawImage(sp, g.x - 40, g.y - 40, 80, 80);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Reflexo da lua em fatias ----------
  function drawMoonReflection(){
    if (game.moonR <= 0 || game.moonY > game.horizonY) return;
    const P = game.palette, hy = game.horizonY;
    const len = Math.min(game.H - hy, game.moonR * 8);
    const baseW = game.moonR * 2.2 + 40; // ~80 px
    ctx.fillStyle = P.light;
    // Cintilações: fatias com jitter (largura/alpha por hash) e ~30% puladas; eco = passo 8 px.
    // Nunca uma coluna contínua nem um retângulo único.
    const slice = game.eco ? 8 : 4, n = Math.floor(len / slice);
    const t = game.t, tick = Math.floor(t * 6);
    for (let i = 0; i < n; i++){
      const h1 = hash(i * 7 + 1), h2 = hash(i * 13 + tick);
      if (h2 < 0.3) continue; // fatia apagada
      const y = hy + i * slice, f = 1 - i / n;
      const w = baseW * (0.35 + 0.65 * (1 - f)) * (0.6 + 0.4 * h1);
      const dx = Math.sin(y * 0.15 + t * 2) * 2 + rippleOffset(game.moonX, y);
      const tw = 0.5 + 0.5 * Math.sin(t * 2.2 + i * 1.7 + h1 * 6.28);
      ctx.globalAlpha = 0.10 * Math.pow(f, 1.6) * tw;
      ctx.fillRect(game.moonX + dx - w * 0.5, y, w, slice - 1);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Halo do cursor ----------
  function drawCursorHalo(){
    const m = game.mouse;
    if (!m.overWater || m.idleFor > 120 || m.x < 0) return;
    const boost = game.sinceClick < 0.3 ? 0.2 : 0;
    const a = 0.06 + boost;
    ctx.fillStyle = game.palette.light;
    for (let k = 3; k >= 1; k--){
      ctx.globalAlpha = a * (4 - k) / 3;
      ctx.beginPath(); ctx.ellipse(m.x, m.y, 7 * k, 7 * k * 0.35, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Desbloqueios ----------
  function checkUnlocks(){
    if (!game.unlocksEnabled) return;
    const s = game.state;
    for (const u of UNLOCKS){
      if (s.unlocked.indexOf(u.id) >= 0 || pending.indexOf(u.id) >= 0) continue;
      if (s.totalTime >= u.time || s.ripples >= u.ripples) pending.push(u.id);
    }
  }
  function applyUnlock(id){
    const s = game.state, u = UNLOCKS.find(x => x.id === id);
    s.unlocked.push(id);
    fadeStart[id] = game.t;
    if (id === 'dawn' && s.dawnAt < 0) s.dawnAt = s.totalTime;
    game.audio.play('unlock', { degree: cascadeDegree % 5, gain: 1 });
    cascadeDegree++;
    if (u && u.ach) game.achievement(u.ach);
    call('onUnlock', id, game);
    updateAmbient();
    UI.refreshCollection(u && u.icon);
  }
  function updatePending(dt){
    if (!pending.length){ cascadeTimer = 0; cascadeDegree = 0; return; }
    cascadeTimer -= dt;
    if (cascadeTimer <= 0){
      applyUnlock(pending.shift());
      cascadeTimer = 2.5; // cascata de boas-vindas
    }
  }
  function updateAmbient(){
    game.audio.ambient.set({
      moon: game.has('moon'), aurora: game.has('aurora'), fogOpen: game.has('fog_clear'),
      crickets: game.dayPhase < 0.5, wind: game.has('wind') ? 1 : 0
    });
  }

  // ---------- Modo ambiente ----------
  let dewTimer = 8, watchTimer = 0;
  function updateAmbientMode(dt){
    if (game.sinceClick < 0.001) watchTimer = 0; // houve clique neste frame
    watchTimer += dt;
    game.sinceClick += dt;
    if (game.sinceClick < 20){ dewTimer = 6 + rand() * 4; return; }
    dewTimer -= dt;
    if (dewTimer <= 0){
      dewTimer = 6 + rand() * 4;
      // gota cai de um junco (70%) ou de um ponto qualquer da água
      const per = (LQ.reeds && LQ.reeds.perches) ? LQ.reeds.perches(game) : [];
      let x, y, fallH = 40;
      if (per.length && rand() < 0.7){
        const p = per[Math.floor(rand() * per.length)];
        x = clamp(p.x + (rand() - 0.5) * 10, 10, game.W - 10);
        y = clamp(p.y + 40 + rand() * 80, game.horizonY + 20, game.H - 20);
        fallH = Math.max(20, y - p.y);
      } else {
        x = 40 + rand() * (game.W - 80);
        y = game.horizonY + 20 + rand() * (game.H - game.horizonY - 60);
      }
      stones.push({ x, y, age: 0, dew: true, fallH });
    }
    // "Só Olhando": 10 min sem clicar
    if (watchTimer >= 600) game.achievement('just_watching');
    if (game.sinceClick > game.state.stats.longestIdle) game.state.stats.longestIdle = Math.floor(game.sinceClick);
  }

  // ---------- Input ----------
  function canvasPos(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  let audioStarted = false;
  function ensureAudio(){
    if (audioStarted) return;
    audioStarted = true;
    game.audio.init();
    game.audio.setMuted(!!game.state.muted);
    game.audio.setTheme(game.state.theme);
    // névoa já dissipada em sessão anterior: lowpass já aberto (sem rampa de 60 s)
    game.audio.ambient.set({ fogOpen: game.has('fog_clear'), fogTime: 0.05 });
    game.audio.ambient.start();
    updateAmbient();
  }
  function onPointerDown(e){
    if (e.button !== undefined && e.button !== 0) return;
    ensureAudio();
    const p = canvasPos(e);
    game.mouse.x = p.x; game.mouse.y = p.y; game.mouse.idleFor = 0;
    UI.wake();
    // Primeiro os moradores
    for (let i = ents.length - 1; i >= 0; i--){
      const f = ents[i].def.onClick;
      if (f && f.call(ents[i].def, p.x, p.y, game)){ game.sinceClick = 0; return; }
    }
    if (p.y > game.horizonY){ throwStone(p.x, p.y); game.sinceClick = 0; }
    else glows.push({ x: p.x, y: p.y, age: 0 }); // brilho sutil, nunca erro
  }
  function onPointerMove(e){
    const p = canvasPos(e);
    game.mouse.x = p.x; game.mouse.y = p.y; game.mouse.idleFor = 0;
    game.mouse.overWater = p.y > game.horizonY;
    UI.wake();
  }
  function onPointerLeave(){ game.mouse.overWater = false; }

  // ---------- UI ----------
  const UI = {
    hideTimer: 0, collOpen: false, hover: false, pinned: false, // pinned: painel aberto (loja) segura a barra
    init(){
      const ui = document.getElementById('ui');
      ui.addEventListener('pointerdown', e => e.stopPropagation());
      // ponteiro parado sobre a barra: ela não some debaixo do cursor
      ui.addEventListener('pointerenter', () => { UI.hover = true; UI.wake(); });
      ui.addEventListener('pointerleave', () => { UI.hover = false; UI.hideTimer = 0; });
      document.querySelectorAll('.ico').forEach(b => {
        b.addEventListener('click', e => { e.stopPropagation(); UI.act(b.dataset.act); });
      });
      UI.applyClasses();
      UI.refreshCollection(null, true);
    },
    act(a){
      const s = game.state;
      ensureAudio();
      if (a === 'sound'){ s.muted = !s.muted; game.audio.setMuted(s.muted); }
      else if (a === 'full'){
        let p = null;
        if (document.fullscreenElement){ if (document.exitFullscreen) p = document.exitFullscreen(); }
        else if (document.documentElement.requestFullscreen) p = document.documentElement.requestFullscreen();
        if (p && p.catch) p.catch(() => {}); // sem gesto/permissão: silencioso
      }
      else if (a === 'theme'){
        const list = LQ.themeList || THEME_LIST;
        s.theme = list[(list.indexOf(s.theme) + 1) % list.length];
        game.audio.setTheme(s.theme);
        call('onTheme', s.theme, game);
      }
      else if (a === 'coll'){ UI.collOpen = !UI.collOpen; document.getElementById('collection').classList.toggle('open', UI.collOpen); }
      else if (a === 'eco'){ s.eco = !s.eco; resize(); }
      else if (a === 'mode'){
        // confirmação: 1º clique arma (ícone aceso por 2 s), 2º clique troca — evita trocar por engano ao jogar pedra perto da barra
        const b = document.getElementById('btn-mode');
        if (!UI.modeArmed){
          UI.modeArmed = true; if (b) b.classList.add('arm');
          clearTimeout(UI.modeTimer);
          UI.modeTimer = setTimeout(() => { UI.modeArmed = false; if (b) b.classList.remove('arm'); }, 2000);
          return;
        }
        clearTimeout(UI.modeTimer); UI.modeArmed = false; if (b) b.classList.remove('arm');
        LQ.switchMode(game.mode === 'idle' ? 'zen' : 'idle'); return;
      }
      else if (a === 'shop'){ game.emit('shopToggle', null); } // idle/hud.js implementa onShopToggle
      UI.applyClasses(); save();
    },
    applyClasses(){
      const b = document.body, s = game.state;
      b.classList.toggle('muted', !!s.muted);
      b.classList.toggle('eco', !!s.eco);
      b.classList.toggle('mode-zen', game.mode === 'zen');
      b.classList.toggle('mode-idle', game.mode === 'idle');
    },
    wake(){ UI.hideTimer = 0; document.body.classList.remove('uihidden'); },
    update(dt){
      game.mouse.idleFor += dt;
      if (UI.hover || UI.pinned) UI.hideTimer = 0; else UI.hideTimer += dt;
      if (UI.hideTimer > 3) document.body.classList.add('uihidden');
      document.body.classList.toggle('nocursor', game.mouse.idleFor > 120);
    },
    // Coleção: um ícone por morador acordado; `newIcon` nasce com fade
    refreshCollection(newIcon, silent){
      const el = document.getElementById('collection');
      const s = game.state, icons = [];
      for (const u of UNLOCKS) if (u.icon && s.unlocked.indexOf(u.id) >= 0) icons.push(u.icon);
      if (s.liliesBloomed > 0) icons.push('flower');
      let html = '';
      for (const ic of icons){
        html += '<svg class="' + (ic === newIcon && !silent ? 'new' : '') + '"><use href="#ic-' + ic + '"/></svg>';
      }
      el.innerHTML = html;
      // morador novo: a faixa aparece sozinha por alguns segundos (fade, sem texto)
      if (newIcon && !silent && !UI.collOpen){
        el.classList.add('open');
        clearTimeout(UI.peekTimer);
        UI.peekTimer = setTimeout(() => { if (!UI.collOpen) el.classList.remove('open'); }, 6000);
      }
    }
  };
  game.ui = UI;
  // Recomeçar do zero (dev/teste): impede o save de unload regravar o estado e recarrega
  LQ.reset = function(){
    resetting = true;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    location.reload();
  };
  // Troca de modo: salva o atual, grava a escolha e recarrega (cada modo tem seu save)
  LQ.switchMode = function(m){
    if (m !== 'zen' && m !== 'idle') return;
    if (game.state){
      save();
      // idle → zen: o tempo passado no zen NÃO é ausência do idle (não vira ganho offline na volta)
      if (game.mode === 'idle' && m === 'zen'){
        game.state.lastSeen = 0;
        try {
          const json = JSON.stringify(game.state);
          if (LQ.Platform && LQ.Platform.saveCloud) LQ.Platform.saveCloud(json, SAVE_KEY); else localStorage.setItem(SAVE_KEY, json);
        } catch (e) {}
      }
    }
    writeMode(m);
    resetting = true; // o save de unload não regrava por cima
    // fade curto antes do reload (sem corte seco)
    document.body.style.transition = 'opacity .35s ease'; document.body.style.opacity = '0';
    setTimeout(() => location.reload(), 360);
  };

  // ---------- Desenho por camadas ----------
  // 'reeds' vem depois de 'water' (juncos ficam na margem, em primeiro plano)
  const LAYERS = ['sky', 'aurora', 'moon', 'mountains', 'water', 'reeds', 'lilies', 'fish', 'ripples', 'light', 'fog', 'hud'];
  function draw(){
    if (paletteDirty) rebuildOffscreens();
    const W = game.W, H = game.H, hy = game.horizonY;
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(skyCv, 0, 0);
    for (const layer of LAYERS){
      if (layer === 'aurora'){ if (game.eco) continue; ctx.globalCompositeOperation = 'screen'; }
      else if (layer === 'light') ctx.globalCompositeOperation = game.lightBlend || 'lighter'; // tema claro (tinta): multiply
      else ctx.globalCompositeOperation = 'source-over';
      if (layer === 'water'){ ctx.drawImage(waterCv, 0, hy); }
      call('draw', layer, ctx, game);
      if (layer === 'water') drawMoonReflection();
      if (layer === 'ripples'){ drawRipples(); drawStones(); }
      if (layer === 'light'){ drawDrops(); drawGlows(); drawCursorHalo(); }
      ctx.globalAlpha = 1;
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------- Loop ----------
  let last = 0, saveTimer = 0, unlockTimer = 0, hiddenAt = 0, hiddenSince = 0, running = false;
  function frame(now){
    if (!running) return;
    requestAnimationFrame(frame);
    if (LQ.Platform && LQ.Platform.wallpaper && now - last < 66) return; // papel de parede: 15 fps
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
    game.t += dt;
    game.state.totalTime += dt;
    game.calm = Math.max(0, game.calm - 0.2 * dt);

    palTimer += dt;
    if (palTimer >= 0.5){ palTimer = 0; updateDayCycle(); stepPalette(); }
    unlockTimer += dt;
    if (unlockTimer >= 1){ unlockTimer = 0; checkUnlocks(); updateAmbient(); }
    updatePending(dt);
    updateAmbientMode(dt);
    updateStones(dt);
    updateRipples(dt);
    updateDrops(dt);
    call('update', dt, game);
    UI.update(dt);
    draw();

    saveTimer += dt;
    if (saveTimer >= 10){ saveTimer = 0; save(); }
  }
  function onVisibility(){
    if (document.hidden){
      running = false; hiddenAt = Date.now(); if (!hiddenSince) hiddenSince = hiddenAt; save();
    } else {
      // Volta: avança relógio (cap 8 h) e deixa a cascata mostrar o que acordou
      // hiddenAt é consumido pelo save (pagehide); hiddenSince guarda a ausência inteira p/ onOffline
      let away = 0;
      if (hiddenAt){ game.state.totalTime += Math.min((Date.now() - hiddenAt) / 1000, OFFLINE_CAP); hiddenAt = 0; }
      if (hiddenSince){ away = (Date.now() - hiddenSince) / 1000; hiddenSince = 0; }
      checkUnlocks();
      if (away > 0) call('onOffline', away, game);
      if (running) return; // já há um encadeamento de rAF
      running = true; last = performance.now(); requestAnimationFrame(frame);
    }
  }

  // ---------- Escolha de modo (primeira abertura) ----------
  const ICON_MOON = '<svg viewBox="0 0 24 24"><path d="M15 3.5a9 9 0 1 0 5.5 14.5A8 8 0 0 1 15 3.5z"/></svg>';
  const ICON_BOLT = '<svg viewBox="0 0 24 24"><path d="M13 2.5L5 13.5h6l-1 8 9-11.5h-6l1-7.5z"/></svg>';
  function showModePick(){
    const d = document.createElement('div');
    d.id = 'modepick';
    d.style.cssText = 'position:fixed;inset:0;z-index:20;background:#050914;display:flex;align-items:center;justify-content:center;gap:12vw;opacity:0;transition:opacity .6s ease';
    const mk = (m, svg) => {
      const b = document.createElement('button');
      b.dataset.mode = m;
      b.style.cssText = 'width:min(28vw,180px);height:min(28vw,180px);border:0;background:transparent;padding:0;cursor:pointer;opacity:.6;transition:opacity .3s ease';
      b.innerHTML = svg;
      const sv = b.firstChild;
      sv.style.cssText = 'width:100%;height:100%;fill:none;stroke:#e9f2ff;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round';
      b.addEventListener('pointerenter', () => { b.style.opacity = '1'; });
      b.addEventListener('pointerleave', () => { b.style.opacity = '.6'; });
      b.addEventListener('click', () => {
        writeMode(m);
        d.style.opacity = '0';
        setTimeout(() => { d.remove(); }, 600);
        LQ.start(m);
      });
      return b;
    };
    d.appendChild(mk('zen', ICON_MOON));
    d.appendChild(mk('idle', ICON_BOLT));
    document.body.appendChild(d);
    requestAnimationFrame(() => { d.style.opacity = '1'; });
  }
  // Ponto de entrada: com modo gravado inicia direto; sem modo mostra a escolha
  LQ.boot = function(){
    const m = readMode();
    if (m) LQ.start(m); else showModePick();
  };

  // ---------- Início ----------
  LQ.start = function(mode){
    game.mode = mode === 'idle' ? 'idle' : 'zen';
    SAVE_KEY = SAVE_KEYS[game.mode];
    game.unlocksEnabled = game.mode !== 'idle';
    game.state = load();
    game.platform = LQ.Platform || null;
    game.audio = LQ.Audio || audioStub;
    // Ganho offline (cap 8 h) + achievement de retorno após 24 h+
    // (ausência calculada AQUI, antes de lastSeen ser consumida pelo save)
    const s = game.state, now = Date.now();
    let away = 0;
    if (s.lastSeen > 0){
      away = Math.max(0, (now - s.lastSeen) / 1000);
      s.totalTime += Math.min(away, OFFLINE_CAP);
      if (away >= 86400) game.achievement('left_light_on');
    }
    canvas = document.getElementById('lake');
    ctx = canvas.getContext('2d', { alpha: false });
    resize();
    updateDayCycle();
    game.palette = targetPalette(); paletteDirty = true;

    call('init', game);
    if (away > 0) call('onOffline', away, game); // depois do init: entidades já têm estado
    started = true;
    UI.init();
    checkUnlocks(); // pendentes entram em cascata (2,5 s cada)
    cascadeTimer = pending.length > 1 ? 1.5 : 0;

    window.addEventListener('resize', resize);
    canvas.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerleave', onPointerLeave);
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('visibilitychange', onVisibility);
    window.addEventListener('beforeunload', save);
    window.addEventListener('pagehide', save);

    running = true; last = performance.now();
    requestAnimationFrame(frame);
  };
})();
</script>
<script>
// Juncos — silhuetas na margem (3 à esquerda desde o início, mais à direita com 'fireflies2').
// Path2D cacheado por junco; respiração 1.0→1.03→1.0 em 400 ms quando um anel nasce a <120 px;
// balanço ±3° (seno) com o unlock 'wind'. Expõe LQ.reeds.perches() para os vagalumes pousarem.
window.LQ = window.LQ || {};
(function(){
  'use strict';
  const LQ = window.LQ;
  const BREATH_T = 0.4, BREATH_R = 120, MAX_ANGLE = 3 * Math.PI / 180;
  const reeds = [];       // {side, nx, h, lean, path, tipX, tipY, phase, breath, angle, wx, wy}
  let lastW = 0, lastH = 0;

  // Constrói a Path2D de um junco em coordenadas locais (base na origem, y para cima é negativo)
  function buildPath(r, game){
    const H = game.H;
    const h = r.h * H, lean = r.lean * H;
    const p = new Path2D();
    // Caule: curva fina afunilando até a ponta
    const w0 = 3.2, tx = lean, ty = -h;
    p.moveTo(-w0 * 0.5, 0);
    p.quadraticCurveTo(lean * 0.35 - 1, -h * 0.55, tx - 0.6, ty);
    p.lineTo(tx + 0.6, ty);
    p.quadraticCurveTo(lean * 0.35 + 1, -h * 0.55, w0 * 0.5, 0);
    p.closePath();
    // Espiga (tipo taboa) em alguns juncos
    if (r.head){
      p.ellipse(tx, ty + h * 0.06, 2.6, h * 0.07, r.lean * 0.6, 0, Math.PI * 2);
    }
    // Uma ou duas folhas saindo do caule
    for (let i = 0; i < r.leaves; i++){
      const f = 0.25 + i * 0.28;                  // altura relativa da folha
      const sx = lean * f * 0.5, sy = -h * f;
      const dir = (i % 2 === 0 ? -1 : 1) * r.side;
      const lx = sx + dir * h * 0.16, ly = sy - h * 0.22;
      p.moveTo(sx, sy);
      p.quadraticCurveTo(sx + dir * h * 0.04, sy - h * 0.14, lx, ly);
      p.quadraticCurveTo(sx + dir * h * 0.09, sy - h * 0.08, sx + dir * 2, sy + 4);
      p.closePath();
    }
    r.path = p; r.tipX = tx; r.tipY = ty;
  }

  function makeReed(side, nx, rnd){
    return {
      side, nx,
      h: 0.16 + rnd() * 0.14,           // altura relativa a H
      lean: (rnd() * 0.06 + 0.02) * (rnd() < 0.5 ? -1 : 1),
      head: rnd() < 0.6, leaves: 1 + Math.floor(rnd() * 2),
      phase: rnd() * Math.PI * 2, speed: 0.6 + rnd() * 0.5,
      breath: 10, angle: 0, path: null, tipX: 0, tipY: 0, wx: 0, wy: 0
    };
  }

  function rebuild(game){
    for (const r of reeds) buildPath(r, game);
    lastW = game.W; lastH = game.H;
  }

  function baseY(game){ return game.H + 2; }   // base um pouco abaixo da borda inferior
  function baseX(r, game){ return r.nx * game.W; }

  const def = {
    init(game){
      const rnd = game.rand;
      reeds.length = 0;
      // 3 à esquerda (sempre)
      reeds.push(makeReed('L', 0.045, rnd), makeReed('L', 0.085, rnd), makeReed('L', 0.125, rnd));
      // 4 à direita (fade com 'fireflies2')
      reeds.push(makeReed('R', 0.905, rnd), makeReed('R', 0.935, rnd), makeReed('R', 0.965, rnd), makeReed('R', 0.985, rnd));
      for (const r of reeds){ r.side = r.side === 'L' ? -1 : 1; }
      rebuild(game);
    },

    onResize(game){ rebuild(game); },
    update(dt, game){
      if (game.W !== lastW || game.H !== lastH) rebuild(game);
      const wind = game.has('wind') ? game.unlockFade('wind') : 0;
      const by = baseY(game);
      for (const r of reeds){
        r.breath += dt;
        // Balanço: soma de dois senos lentos, amplitude ±3°
        const s = Math.sin(game.t * r.speed + r.phase) * 0.75 + Math.sin(game.t * r.speed * 2.3 + r.phase * 1.7) * 0.25;
        r.angle = MAX_ANGLE * s * wind;
        // Ponta em coordenadas de tela (para os vagalumes pousarem)
        const c = Math.cos(r.angle), sn = Math.sin(r.angle);
        r.wx = baseX(r, game) + r.tipX * c - r.tipY * sn;
        r.wy = by + r.tipX * sn + r.tipY * c;
      }
    },

    // Camada 'reeds' (depois da água): primeiro plano da margem
    draw(layer, ctx, game){
      if (layer !== 'reeds') return;
      const rightFade = game.has('fireflies2') ? game.unlockFade('fireflies2') : 0;
      const by = baseY(game);
      ctx.fillStyle = game.palette.dark;
      for (const r of reeds){
        const a = r.side < 0 ? 1 : rightFade;
        if (a <= 0.005) continue;
        let sc = 1;
        if (r.breath < BREATH_T) sc = 1 + 0.03 * Math.sin(Math.PI * r.breath / BREATH_T);
        ctx.globalAlpha = a;
        ctx.save();
        ctx.translate(baseX(r, game), by);
        ctx.rotate(r.angle);
        if (sc !== 1) ctx.scale(sc, sc);
        ctx.fill(r.path);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    },

    // Anel perto da base → respiração
    onRipple(x, y, game){
      const by = baseY(game);
      for (const r of reeds){
        if (r.side > 0 && !game.has('fireflies2')) continue;
        // distância ao segmento base→ponta (não só à base, que fica fora da tela)
        const bx = baseX(r, game), vx = r.wx - bx, vy = r.wy - by;
        const len2 = vx * vx + vy * vy || 1;
        const t = Math.max(0, Math.min(1, ((x - bx) * vx + (y - by) * vy) / len2));
        const dx = x - (bx + vx * t), dy = y - (by + vy * t);
        if (dx * dx + dy * dy < BREATH_R * BREATH_R) r.breath = 0;
      }
    }
  };

  LQ.register('reeds', def);

  // API para outras entidades (vagalumes): pontas dos juncos visíveis
  LQ.reeds = {
    perches(game){
      const out = [];
      const right = game.has('fireflies2');
      for (const r of reeds){
        if (r.side > 0 && !right) continue;
        out.push({ x: r.wx, y: r.wy, reed: r });
      }
      return out;
    }
  };
})();
</script>
<script>
// Vagalumes — 5 com 'fireflies', 15 com 'fireflies2'. Movimento = soma de 2 senos, pulso 2-4 s.
// Glow via game.sprite.glow na camada 'light'. Fogem 30 px do anel (ease 600 ms) e brilham 2 s
// com tilintar; clique = pulso + nota uma oitava acima. Alguns pousam nas pontas dos juncos e,
// com 3+ pousados próximos, linhas finas de constelação (alpha 0.15) ligam-os por alguns segundos.
window.LQ = window.LQ || {};
(function(){
  'use strict';
  const LQ = window.LQ;
  const MAX = 15, BASE = 5;
  const FLEE_R = 150, FLEE_D = 30, FLEE_T = 0.6, SHINE_T = 2.0;
  const HIT_R = 16, CONST_R = 110;
  const flies = [];
  let lastChime = -1e9, constAlpha = 0, constTimer = 0;
  const pairs = [];   // pares ligados por linhas de constelação

  function mk(rnd){
    return {
      // posição base normalizada (x 0..1, y 0..1 na faixa horizonte→fundo)
      bx: rnd(), by: 0.05 + rnd() * 0.85,
      ax: 0.02 + rnd() * 0.05, ay: 0.02 + rnd() * 0.04,      // amplitudes (fração de W/H)
      f1: 0.15 + rnd() * 0.2, f2: 0.31 + rnd() * 0.3,        // frequências dos senos
      p1: rnd() * 6.28, p2: rnd() * 6.28, p3: rnd() * 6.28, p4: rnd() * 6.28,
      period: 2 + rnd() * 2, pph: rnd() * 6.28,              // pulso 2-4 s
      drift: (rnd() - 0.5) * 0.01,                           // deriva lenta da base
      x: 0, y: 0, fx: 0, fy: 0, flee: 10, shine: 10,         // fuga e brilho (timers)
      state: 0, perch: null, st: 0, land: 0, px: 0, py: 0,    // 0 voa, 1 pousando, 2 pousado, 3 decolando
      sx: 0, sy: 0, wait: 8 + rnd() * 20,                     // origem do pouso; espera até tentar pousar
      born: -1                                                // game.t do nascimento (fade)
    };
  }

  function alive(game){
    if (!game.has('fireflies')) return 0;
    return game.has('fireflies2') ? MAX : BASE;
  }

  function freePos(f, game){
    const W = game.W, hy = game.horizonY, wh = game.H - hy, t = game.t;
    const x = (f.bx + f.ax * (Math.sin(t * f.f1 + f.p1) + 0.5 * Math.sin(t * f.f2 + f.p2))) * W;
    const y = hy + (f.by + f.ay * (Math.sin(t * f.f1 * 1.3 + f.p3) + 0.5 * Math.sin(t * f.f2 * 0.8 + f.p4))) * wh;
    return { x, y };
  }

  function chime(game, x, g){
    const now = game.t;
    if (now - lastChime < 0.15) return;   // quase subliminar, nunca em rajada
    lastChime = now;
    game.audio.play('firefly', { x: x / game.W, gain: g });
  }

  const def = {
    init(game){
      flies.length = 0;
      for (let i = 0; i < MAX; i++) flies.push(mk(game.rand));
      // já acordados em sessão anterior: nascem em t=0 (born<0 significa 'ainda não')
      if (game.has('fireflies')) for (let i = 0; i < alive(game); i++) flies[i].born = 0;
    },

    onUnlock(id, game){
      const n = alive(game);
      // cada um tilinta ao acordar (em update, quando cruza `born`) — coro esparso
      for (let i = 0; i < n; i++) if (flies[i].born < 0){ flies[i].born = game.t + (i % BASE) * 0.7; flies[i].woke = false; }
    },

    update(dt, game){
      const n = alive(game), rnd = game.rand, t = game.t;
      const perches = (LQ.reeds && LQ.reeds.perches) ? LQ.reeds.perches(game) : [];
      const W = game.W, H = game.H;
      for (let i = 0; i < MAX; i++){
        const f = flies[i];
        if (i >= n || f.born < 0 || t < f.born) continue;
        if (f.woke === false){ f.woke = true; const p0 = freePos(f, game); chime(game, p0.x, 1); }
        f.flee += dt; f.shine += dt;
        f.bx += f.drift * dt; if (f.bx < 0.02 || f.bx > 0.98) f.drift = -f.drift;
        const fp = freePos(f, game);

        if (f.state === 0){
          f.wait -= dt;
          // pousar nos juncos é comportamento da fase 6 (fireflies2, §3)
          if (f.wait <= 0 && perches.length && game.has('fireflies2') && rnd() < 0.5){
            f.perch = perches[Math.floor(rnd() * perches.length)].reed;
            f.state = 1; f.st = 0; f.sx = f.x; f.sy = f.y;
          } else if (f.wait <= 0) f.wait = 10 + rnd() * 20;
          f.x = fp.x; f.y = fp.y;
        } else if (f.state === 1){
          // Pousando: 2,5 s de aproximação suave até a ponta do junco
          f.st += dt;
          const k = game.ease.smoothstep(f.st / 2.5);
          const tx = f.perch.wx, ty = f.perch.wy - 3;
          f.x = f.sx + (tx - f.sx) * k + Math.sin(f.st * 5) * 6 * (1 - k);
          f.y = f.sy + (ty - f.sy) * k;
          if (f.st >= 2.5){ f.state = 2; f.land = 6 + rnd() * 14; }
        } else if (f.state === 2){
          f.land -= dt;
          f.x = f.perch.wx; f.y = f.perch.wy - 3;
          if (f.land <= 0 || f.flee < FLEE_T){
            // Decola: a base passa a ser onde está
            f.state = 0; f.perch = null; f.wait = 15 + rnd() * 25;
            f.bx = Math.min(0.98, Math.max(0.02, f.x / W));
            f.by = Math.min(0.9, Math.max(0.05, (f.y - game.horizonY) / (H - game.horizonY)));
            f.p1 = -t * f.f1; f.p2 = -t * f.f2; f.p3 = -t * f.f1 * 1.3; f.p4 = -t * f.f2 * 0.8;
          }
        }
        // Fuga do anel: 30 px em 600 ms, depois volta devagar
        if (f.flee < FLEE_T){
          const k = game.ease.easeOutQuad(f.flee / FLEE_T);
          f.x += f.fx * k; f.y += f.fy * k;
        } else if (f.flee < FLEE_T + 1.5){
          const k = 1 - (f.flee - FLEE_T) / 1.5;
          f.x += f.fx * k; f.y += f.fy * k;
        }
      }

      // Constelação: 3+ pousados a <110 px entre si
      pairs.length = 0;
      const perched = [];
      for (let i = 0; i < n; i++) if (flies[i].state === 2 && flies[i].born >= 0) perched.push(flies[i]);
      let cluster = false;
      if (perched.length >= 3){
        for (let a = 0; a < perched.length; a++){
          let near = 0;
          for (let b = 0; b < perched.length; b++){
            if (a === b) continue;
            const dx = perched[a].x - perched[b].x, dy = perched[a].y - perched[b].y;
            if (dx * dx + dy * dy < CONST_R * CONST_R){ near++; if (a < b) pairs.push(perched[a], perched[b]); }
          }
          if (near >= 2) cluster = true;
        }
      }
      if (cluster){
        constTimer += dt;
        // Aparece em 1,5 s, fica ~6 s, some em 2 s; depois descansa
        const c = constTimer % 14;
        constAlpha = c < 1.5 ? c / 1.5 : c < 7.5 ? 1 : c < 9.5 ? 1 - (c - 7.5) / 2 : 0;
      } else { constTimer = 0; constAlpha = Math.max(0, constAlpha - dt); }
    },

    draw(layer, ctx, game){
      if (layer !== 'light') return;
      const n = alive(game), t = game.t;
      if (!n) return;
      const P = game.palette;
      const dayFade = 1 - game.dayPhase;                // se retiram no amanhecer
      if (dayFade <= 0.01) return;
      const R = game.eco ? 10 : 14;
      const glow = game.sprite.glow(P.firefly, R);
      const eff = game.unlockFade('fireflies');

      // Linhas de constelação entre pousados
      if (constAlpha > 0.01 && pairs.length){
        ctx.strokeStyle = P.firefly; ctx.lineWidth = 1;
        ctx.globalAlpha = 0.15 * constAlpha * dayFade * game.unlockFade('fireflies2');
        ctx.beginPath();
        for (let i = 0; i < pairs.length; i += 2){ ctx.moveTo(pairs[i].x, pairs[i].y); ctx.lineTo(pairs[i + 1].x, pairs[i + 1].y); }
        ctx.stroke();
      }

      ctx.fillStyle = P.light;
      for (let i = 0; i < n; i++){
        const f = flies[i];
        if (f.born < 0 || t < f.born) continue;
        const bornK = game.ease.smoothstep((t - f.born) / 5);
        const fade = (i < BASE ? eff : game.unlockFade('fireflies2')) * bornK * dayFade;
        if (fade <= 0.01) continue;
        // Pulso lento (2-4 s) — respiração de luz
        let b = 0.5 + 0.5 * Math.sin(t * Math.PI * 2 / f.period + f.pph);
        b = 0.25 + 0.75 * b * b;
        if (f.state === 2) b *= 0.7;                    // pousado: mais quieto
        let shine = 0;
        if (f.shine < SHINE_T) shine = Math.sin(Math.PI * Math.min(1, f.shine / SHINE_T)) * 0.8;
        const a = Math.min(1, (b * 0.55 + shine)) * fade;
        const s = R * (1 + shine * 0.6);
        ctx.globalAlpha = a;
        ctx.drawImage(glow, f.x - s, f.y - s, s * 2, s * 2);
        // Núcleo claro de 1,5 px
        ctx.globalAlpha = Math.min(1, a * 1.4);
        ctx.fillRect(f.x - 0.75, f.y - 0.75, 1.5, 1.5);
      }
      ctx.globalAlpha = 1;
    },

    // Anel: quem está a <150 px foge 30 px e brilha 2 s (tilintar)
    onRipple(x, y, game){
      const n = alive(game);
      let any = false;
      for (let i = 0; i < n; i++){
        const f = flies[i];
        if (f.born < 0 || game.t < f.born) continue;
        const dx = f.x - x, dy = f.y - y, d2 = dx * dx + dy * dy;
        if (d2 > FLEE_R * FLEE_R || d2 < 1) continue;
        const d = Math.sqrt(d2);
        f.fx = dx / d * FLEE_D; f.fy = dy / d * FLEE_D;
        f.flee = 0; f.shine = 0; any = true;
      }
      if (any) chime(game, x, 0.5);
    },

    // Clique num vagalume: pulso de brilho + mesma nota uma oitava acima
    onClick(x, y, game){
      const n = alive(game);
      let best = null, bd = HIT_R * HIT_R;
      for (let i = 0; i < n; i++){
        const f = flies[i];
        if (f.born < 0 || game.t < f.born) continue;
        const dx = f.x - x, dy = f.y - y, d2 = dx * dx + dy * dy;
        if (d2 < bd){ bd = d2; best = f; }
      }
      if (!best) return false;
      best.shine = 0;
      best.fx = 0; best.fy = 0;
      const nx = Math.min(1, Math.max(0, best.x / game.W));
      const ny = Math.min(1, Math.max(0, (best.y - game.horizonY) / (game.H - game.horizonY)));
      game.audio.play('pulse', { x: nx, y: ny, gain: 1 });
      return true;
    }
  };

  LQ.register('fireflies', def);
  LQ.fireflies = { list: flies }; // leitura (depuração/outras entidades)
})();
</script>
<script>
// Lago Quieto — peixes: sombras em Bézier, curvam para anéis, saltam, mergulham ao clique.
(function(){
  'use strict';
  const TWO_PI = Math.PI * 2;
  const TRAIL = 4;           // posições do rastro
  const JUMP_T = 0.6;        // duração do arco (s)
  const DIVE_T = 1.6;        // mergulho ao clique (s)
  const CURVE_R = 250;       // raio de atração dos anéis

  const fish = [];
  let goldSeen = false;
  let lastW = 0, lastH = 0, lastTop = 0, lastBot = 0; // geometria do último resize

  function makeFish(gold){
    const f = { gold: !!gold, x: 0, y: 0, ang: 0, len: 22, alpha: 0, trail: [],
      p0: null, p1: null, p2: null, p3: null, u: 0, dur: 6,   // curva atual
      pull: null, pullT: 0,                                    // atração ao anel
      jumping: 0, jx: 0, jy: 0, jumped: false, jumpTimer: 0,
      diving: 0, dx: 0, dy: 0, tx: 0, ty: 0, born: false };
    for (let i = 0; i < TRAIL; i++) f.trail.push({ x: 0, y: 0 });
    return f;
  }
  function waterBand(game){
    const top = game.horizonY + 24, bot = game.H - 30;
    return { top, bot };
  }
  function randPoint(game){
    const b = waterBand(game);
    return { x: 20 + game.rand() * (game.W - 40), y: b.top + game.rand() * (b.bot - b.top) };
  }
  // Nova curva de Bézier partindo da posição atual (ou entrando pela borda se recém-nascido)
  function newPath(f, game){
    if (!f.born){
      const b = waterBand(game);
      f.born = true;
      f.x = game.rand() < 0.5 ? -40 : game.W + 40;
      f.y = b.top + game.rand() * (b.bot - b.top);
    }
    f.p0 = { x: f.x, y: f.y };
    f.p3 = randPoint(game);
    // controles: seguem a direção atual e depois curvam
    const d = 120 + game.rand() * 160;
    f.p1 = { x: f.x + Math.cos(f.ang) * d, y: f.y + Math.sin(f.ang) * d * 0.5 };
    f.p2 = { x: f.p3.x + (game.rand() - 0.5) * 260, y: f.p3.y + (game.rand() - 0.5) * 120 };
    f.u = 0;
    const dist = Math.hypot(f.p3.x - f.p0.x, f.p3.y - f.p0.y);
    f.dur = Math.max(4, dist / (28 + game.rand() * 14)); // ~30-40 px/s
    f.jumpTimer = 6 + game.rand() * 14;
  }
  function bez(a, b, c, d, t){
    const s = 1 - t;
    return s*s*s*a + 3*s*s*t*b + 3*s*t*t*c + t*t*t*d;
  }
  function pushTrail(f){
    for (let i = TRAIL - 1; i > 0; i--){ f.trail[i].x = f.trail[i-1].x; f.trail[i].y = f.trail[i-1].y; }
    f.trail[0].x = f.x; f.trail[0].y = f.y;
  }
  function startJump(f, game){
    f.jumping = 1e-6; f.jumped = false; f.jx = f.x; f.jy = f.y;
    game.audio.play(f.gold ? 'fishJumpGold' : 'fishJump', { x: f.x / game.W, y: 0.4, gain: 1 });
    if (f.gold && !goldSeen){ goldSeen = true; game.achievement('golden_fish'); }
  }
  function startDive(f, game){
    f.diving = 1e-6; f.dx = f.x; f.dy = f.y;
    // ressurge 200 px adiante na direção atual, dentro da água
    const b = waterBand(game);
    let tx = f.x + Math.cos(f.ang) * 200, ty = f.y + Math.sin(f.ang) * 200 * 0.4;
    if (tx < 20 || tx > game.W - 20){ tx = f.x - Math.cos(f.ang) * 200; f.ang += Math.PI; }
    f.tx = Math.min(game.W - 20, Math.max(20, tx));
    f.ty = Math.min(b.bot, Math.max(b.top, ty));
    game.spawnRipple(f.x, f.y, { strength: 0.6, rings: 2 });
    game.spawnDrops(f.x, f.y, 2);
    game.audio.play('plop', { x: f.x / game.W, y: 0.3, gain: 0.25 });
  }
  function fishCount(game){
    if (!game.has('fish')) return 0;
    return game.has('fish2') ? 3 : 1;
  }
  function fadeOf(f, game){
    return f.gold || fish.indexOf(f) > 0 ? game.unlockFade('fish2') : game.unlockFade('fish');
  }

  LQ.register('fish', {
    init(game){
      fish.length = 0;
      fish.push(makeFish(false)); fish.push(makeFish(false)); fish.push(makeFish(true));
      for (const f of fish) f.ang = game.rand() * TWO_PI;
      const b = waterBand(game); lastW = game.W; lastH = game.H; lastTop = b.top; lastBot = b.bot;
    },
    // janela mudou: reposiciona proporcionalmente à faixa d'água e recomeça a curva daí
    onResize(game){
      const b = waterBand(game);
      if (!lastW || !lastH){ lastW = game.W; lastH = game.H; lastTop = b.top; lastBot = b.bot; return; }
      const sx = game.W / lastW, sy = (b.bot - b.top) / Math.max(1, lastBot - lastTop);
      for (const f of fish){
        if (!f.born) continue;
        f.x *= sx; f.y = b.top + (f.y - lastTop) * sy;
        f.x = Math.min(game.W + 40, Math.max(-40, f.x));
        f.y = Math.min(b.bot, Math.max(b.top, f.y));
        for (const p of f.trail){ p.x = f.x; p.y = f.y; }
        f.jumping = 0; f.diving = 0; f.pull = null;
        newPath(f, game);
      }
      lastW = game.W; lastH = game.H; lastTop = b.top; lastBot = b.bot;
    },
    update(dt, game){
      const n = fishCount(game);
      const band = waterBand(game);
      for (let i = 0; i < fish.length; i++){
        const f = fish[i];
        if (i >= n){ f.alpha = 0; continue; }
        f.alpha = 0.35 * fadeOf(f, game);
        if (!f.p0) newPath(f, game);

        // Mergulho (clique): invisível, reaparece adiante
        if (f.diving > 0){
          f.diving += dt;
          const k = Math.min(1, f.diving / DIVE_T);
          f.x = f.dx + (f.tx - f.dx) * k; f.y = f.dy + (f.ty - f.dy) * k;
          if (k >= 1){
            f.diving = 0;
            game.spawnRipple(f.x, f.y, { strength: 0.4, rings: 1 });
            for (const p of f.trail){ p.x = f.x; p.y = f.y; }
            newPath(f, game);
          }
          continue;
        }
        // Salto: sombra parada, corpo em arco na camada de luz
        if (f.jumping > 0){
          f.jumping += dt;
          if (f.jumping >= JUMP_T){
            f.jumping = 0;
            game.spawnRipple(f.x, f.y, { strength: 0.7, rings: 2 });
            game.spawnDrops(f.x, f.y, 4, f.gold ? game.palette.gold : null); // dourado: gotas douradas
          }
          continue;
        }

        // Avança na curva
        f.u += dt / f.dur;
        if (f.u >= 1){ newPath(f, game); }
        let nx = bez(f.p0.x, f.p1.x, f.p2.x, f.p3.x, f.u);
        let ny = bez(f.p0.y, f.p1.y, f.p2.y, f.p3.y, f.u);
        // Atração ao anel (dura ~1.5 s, mistura suavemente)
        if (f.pull){
          f.pullT -= dt;
          const w = game.ease.smoothstep(Math.min(1, f.pullT / 1.5)) * 0.6;
          nx += (f.pull.x - nx) * w * dt * 2; ny += (f.pull.y - ny) * w * dt * 2;
          const d = Math.hypot(f.pull.x - nx, f.pull.y - ny);
          if (f.pullT <= 0 || d < 20){
            if (game.calm > 8 && d < 40 && f.pullT > 0) startJump(f, game);
            f.pull = null;
          }
        }
        const mvx = nx - f.x, mvy = ny - f.y;
        if (Math.abs(mvx) + Math.abs(mvy) > 0.05){
          const target = Math.atan2(mvy, mvx);
          let da = target - f.ang; while (da > Math.PI) da -= TWO_PI; while (da < -Math.PI) da += TWO_PI;
          f.ang += da * Math.min(1, dt * 4);
        }
        f.x = nx; f.y = Math.min(band.bot, Math.max(band.top, ny)); // nunca acima do horizonte
        // Rastro: guarda a cada ~80 ms
        f._tt = (f._tt || 0) + dt;
        if (f._tt >= 0.08){ f._tt = 0; pushTrail(f); }
        // Salto espontâneo (só com fish2 ou modo ambiente)
        f.jumpTimer -= dt;
        if (f.jumpTimer <= 0){
          f.jumpTimer = 15 + game.rand() * 30;
          const spont = game.has('fish2') || game.sinceClick > 20;
          if (spont && f.y > game.horizonY + 40) startJump(f, game);
        }
      }
    },
    onRipple(x, y, game){
      const n = fishCount(game);
      let best = null, bd = CURVE_R;
      for (let i = 0; i < n; i++){
        const f = fish[i];
        if (f.jumping || f.diving || !f.born) continue;
        const d = Math.hypot(f.x - x, (f.y - y) * 1.5);
        if (d < bd){ bd = d; best = f; }
      }
      if (best){
        best.pull = { x, y }; best.pullT = 1.5 + game.rand() * 0.5;
        // recomeça a curva a partir de onde está para a atração não brigar com o Bézier
        best.p0 = { x: best.x, y: best.y }; best.u = 0;
        best.p3 = { x: x + (game.rand() - 0.5) * 120, y: y + (game.rand() - 0.5) * 40 };
        best.p1 = { x: best.x + Math.cos(best.ang) * 60, y: best.y + Math.sin(best.ang) * 30 };
        best.p2 = { x: x, y: y };
        best.dur = Math.max(1.6, bd / 90);
        // calm alto: o mais próximo salta chegando (0.5–2 s depois do clique)
        if (game.calm > 8) best.pullT = Math.min(best.pullT, 1.2);
      }
    },
    onClick(x, y, game){
      const n = fishCount(game);
      for (let i = 0; i < n; i++){
        const f = fish[i];
        if (f.jumping || f.diving || f.alpha <= 0.05) continue;
        const dx = x - f.x, dy = y - f.y;
        if (dx * dx + dy * dy * 4 < 26 * 26){ startDive(f, game); return true; }
      }
      return false;
    },
    draw(layer, ctx, game){
      const n = fishCount(game);
      if (n === 0) return;
      if (layer === 'fish'){
        ctx.fillStyle = game.palette.dark;
        for (let i = 0; i < n; i++){
          const f = fish[i];
          if (f.alpha <= 0.01 || f.diving || f.jumping) continue;
          // rastro: 4 posições, alpha decrescente
          for (let k = TRAIL - 1; k >= 0; k--){
            const p = f.trail[k];
            ctx.globalAlpha = f.alpha * (0.5 - k * 0.11);
            ctx.beginPath(); ctx.ellipse(p.x, p.y, f.len * 0.7 * (1 - k * 0.12), f.len * 0.22, f.ang, 0, TWO_PI); ctx.fill();
          }
          ctx.globalAlpha = f.alpha;
          ctx.beginPath(); ctx.ellipse(f.x, f.y, f.len, f.len * 0.36, f.ang, 0, TWO_PI); ctx.fill();
          // cauda
          const tx = f.x - Math.cos(f.ang) * f.len * 1.1, ty = f.y - Math.sin(f.ang) * f.len * 1.1;
          ctx.beginPath(); ctx.ellipse(tx, ty, f.len * 0.35, f.len * 0.2, f.ang + 0.6, 0, TWO_PI); ctx.fill();
        }
        ctx.globalAlpha = 1;
      } else if (layer === 'light'){
        // corpo saltando: arco 600 ms, parábola até 46 px; reflexo claro na camada aditiva
        for (let i = 0; i < n; i++){
          const f = fish[i];
          if (!f.jumping) continue;
          const k = f.jumping / JUMP_T;
          const h = Math.sin(Math.PI * k) * 46;
          const x = f.jx + (k - 0.5) * 40, y = f.jy - h;
          const rot = (k - 0.5) * 2.2; // sobe inclinado, desce de cabeça
          const col = f.gold ? game.palette.gold : game.palette.light;
          const a = 0.55 * Math.sin(Math.PI * Math.min(1, k * 1.15)) * fadeOf(f, game);
          ctx.fillStyle = col;
          for (let e = 3; e >= 1; e--){ // 3 elipses concêntricas = glow
            ctx.globalAlpha = a * (e === 1 ? 1 : 0.18 / e);
            ctx.beginPath(); ctx.ellipse(x, y, f.len * 0.8 * (1 + (e - 1) * 0.45), f.len * 0.28 * (1 + (e - 1) * 0.6), rot, 0, TWO_PI); ctx.fill();
          }
          // sombra que fica na água
          ctx.globalAlpha = a * 0.3;
          ctx.beginPath(); ctx.ellipse(f.jx, f.jy, f.len * 0.8, f.len * 0.25, 0, 0, TWO_PI); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
    }
  });
})();
</script>
<script>
// Lago Quieto — lírios d'água: discos derivando, balançam com anéis, florescem ao clique.
(function(){
  'use strict';
  const TWO_PI = Math.PI * 2;
  const BLOOM_T = 3;   // flor abre em 3 s
  const lilies = [];
  // Área dos controles (coleção + barra de ícones, centro inferior): lírios não entram
  // (bot = H-100 mantém o centro acima da coleção; a zona central até H-150 cobre raio+balanço)
  const UI_H = 100, ZONE_H = 150, UI_HALF_W = 230;
  function inZone(y, game){ return y > game.H - ZONE_H; }
  function zoneL(game){ return game.W / 2 - UI_HALF_W; }
  function zoneR(game){ return game.W / 2 + UI_HALF_W; }
  function safeX(x, y, game){
    if (!inZone(y, game) || x < zoneL(game) || x > zoneR(game)) return x;
    const left = zoneL(game), right = zoneR(game);
    if (left < 30 && right > game.W - 30) return x; // tela estreita: sem espaço lateral
    if (left < 30) return right;
    if (right > game.W - 30) return left;
    return x < game.W / 2 ? left : right;
  }

  function place(game){
    lilies.length = 0;
    const n = 3 + Math.floor(game.rand() * 3); // 3-5
    const top = game.horizonY + game.H * 0.12, bot = game.H - UI_H;
    for (let i = 0; i < n; i++){
      const y = top + (i + game.rand()) / n * (bot - top);
      const depth = (y - game.horizonY) / (game.H - game.horizonY); // 0 longe, 1 perto
      const x = safeX(30 + game.rand() * (game.W - 60), y, game);
      lilies.push({
        x, y, r: 10 + depth * 16,
        rot: game.rand() * TWO_PI, notch: game.rand() * TWO_PI,
        vx: (game.rand() - 0.5) * 3, ph: game.rand() * TWO_PI,
        bob: 0, bobV: 0,            // oscilação vertical por anéis (mola amortecida)
        bloomed: false, bloom: 0
      });
    }
    game.lilyCount = n;
  }

  LQ.register('lilies', {
    init(game){ place(game); },
    onUnlock(id, game){ if (id === 'lilies') place(game); },
    onResize(game){
      const top = game.horizonY + game.H * 0.12, bot = game.H - UI_H;
      for (const L of lilies){
        L.x = Math.min(game.W - 30, Math.max(30, L.x));
        L.y = Math.min(bot, Math.max(top, L.y));
        L.x = safeX(L.x, L.y, game);
      }
    },
    update(dt, game){
      if (!game.has('lilies')) return;
      for (const L of lilies){
        // deriva lenta, ida e volta
        L.x += L.vx * dt;
        if (L.x < 30){ L.x = 30; L.vx = Math.abs(L.vx); }
        else if (L.x > game.W - 30){ L.x = game.W - 30; L.vx = -Math.abs(L.vx); }
        // não deriva para debaixo dos controles (centro inferior): as bordas da zona são paredes
        if (inZone(L.y, game)){
          const zl = zoneL(game), zr = zoneR(game);
          if (L.x > zl && L.x < zr){
            if (L.x - zl < zr - L.x && zl >= 30){ L.x = zl; L.vx = -Math.abs(L.vx); }
            else if (zr <= game.W - 30){ L.x = zr; L.vx = Math.abs(L.vx); }
          }
        }
        if (game.rand() < 0.002) L.vx = (game.rand() - 0.5) * 3;
        // mola amortecida para o balanço (com teto: spam nunca vira raio negativo)
        const acc = -L.bob * 30 - L.bobV * 3;
        L.bobV = Math.min(80, Math.max(-80, L.bobV + acc * dt));
        L.bob = Math.min(25, Math.max(-25, L.bob + L.bobV * dt));
        if (L.bloom > 0 && L.bloom < BLOOM_T) L.bloom = Math.min(BLOOM_T, L.bloom + dt);
      }
    },
    onRipple(x, y, game){
      if (!game.has('lilies')) return;
      for (const L of lilies){
        const d = Math.hypot(L.x - x, (L.y - y) / 0.35);
        if (d < 220) L.bobV += 40 * (1 - d / 220);
      }
    },
    onClick(x, y, game){
      if (!game.has('lilies') || game.unlockFade('lilies') < 0.5) return false;
      for (const L of lilies){
        const dx = x - L.x, dy = (y - L.y - L.bob) / 0.45;
        if (dx * dx + dy * dy < (L.r + 4) * (L.r + 4)){
          L.bobV += 25;
          if (!L.bloomed){
            L.bloomed = true; L.bloom = 1e-6;
            game.state.liliesBloomed++;
            game.audio.play('bloom', { x: x / game.W, y: 0.4, gain: 1 });
            game.ui.refreshCollection('flower');
            if (lilies.every(l => l.bloomed)) game.achievement('night_bloom');
          } else {
            game.audio.play('pulse', { x: x / game.W, y: 0.4, gain: 1 });
          }
          game.spawnRipple(L.x, L.y + L.r * 0.5, { strength: 0.35, rings: 1 });
          // impacto de clique (idle ganha moeda aqui; zen: nenhuma entidade escuta)
          if (game.emit) game.emit('impact', { x: L.x, y: L.y, strength: 0.5, source: 'lily' });
          return true;
        }
      }
      return false;
    },
    draw(layer, ctx, game){
      if (!game.has('lilies')) return;
      const fade = game.unlockFade('lilies');
      if (fade <= 0.01) return;
      if (layer === 'lilies'){
        ctx.fillStyle = game.palette.dark;
        for (const L of lilies){
          const y = L.y + L.bob, sway = Math.max(0.7, Math.min(1.3, 1 + L.bob * 0.01));
          ctx.globalAlpha = 0.9 * fade;
          // disco elíptico com um recorte (folha de lírio)
          ctx.beginPath();
          ctx.ellipse(L.x, y, L.r * sway, L.r * 0.45 / sway, 0, 0, TWO_PI);
          ctx.fill();
          ctx.fillStyle = game.palette.horizon;
          ctx.globalAlpha = 0.9 * fade;
          ctx.beginPath();
          ctx.moveTo(L.x, y);
          ctx.lineTo(L.x + Math.cos(L.notch) * L.r * 1.05, y + Math.sin(L.notch) * L.r * 0.5);
          ctx.lineTo(L.x + Math.cos(L.notch + 0.5) * L.r * 1.05, y + Math.sin(L.notch + 0.5) * L.r * 0.5);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = game.palette.dark;
          // brilho de borda molhada: fina elipse mais clara na parte de trás
          ctx.globalAlpha = 0.12 * fade;
          ctx.fillStyle = game.palette.light;
          ctx.beginPath(); ctx.ellipse(L.x, y - L.r * 0.1, L.r * 0.8, L.r * 0.18, 0, Math.PI, TWO_PI); ctx.fill();
          ctx.fillStyle = game.palette.dark;
        }
        ctx.globalAlpha = 1;
      } else if (layer === 'light'){
        // flores brancas abrindo (pétalas = elipses radiais), centro dourado
        for (const L of lilies){
          if (L.bloom <= 0) continue;
          const k = game.ease.smoothstep(L.bloom / BLOOM_T);
          const y = L.y + L.bob - L.r * 0.25;
          const pr = L.r * 0.55 * k;
          ctx.fillStyle = game.palette.light;
          const petals = 8;
          for (let i = 0; i < petals; i++){
            const a = L.rot + i / petals * TWO_PI;
            const px = L.x + Math.cos(a) * pr * 0.55, py = y + Math.sin(a) * pr * 0.25;
            ctx.globalAlpha = 0.28 * fade * k;
            ctx.beginPath(); ctx.ellipse(px, py, pr * 0.6, pr * 0.22, a, 0, TWO_PI); ctx.fill();
          }
          // glow suave sob a flor (sprite cacheado)
          const sp = game.sprite.glow(game.palette.light, 30);
          ctx.globalAlpha = 0.12 * k * fade;
          ctx.drawImage(sp, L.x - L.r, y - L.r * 0.5, L.r * 2, L.r);
          ctx.fillStyle = game.palette.gold;
          ctx.globalAlpha = 0.6 * k * fade;
          ctx.beginPath(); ctx.ellipse(L.x, y, pr * 0.22, pr * 0.12, 0, 0, TWO_PI); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
    }
  });
})();
</script>
<script>
// Lago Quieto — sapo: silhueta na margem com 3 poses (parado, inflado, pulando), coaxa e pula.
(function(){
  'use strict';
  const TWO_PI = Math.PI * 2;
  const JUMP_T = 0.7;
  const frog = { x: 0, y: 0, dir: 1, pose: 0, puff: 0, croakTimer: 50, jumping: 0, jx: 0, jy: 0, tx: 0, ty: 0, blink: 0 };

  function home(game){
    // senta na margem inferior direita (juncos ficam à esquerda)
    frog.x = game.W * (0.72 + game.rand() * 0.18);
    frog.y = game.H - 22 - game.rand() * 10;
    frog.dir = -1;
    frog.croakTimer = 40 + game.rand() * 50;
  }
  function croak(game){
    frog.puff = 1e-6;
    game.audio.play('frog', { x: frog.x / game.W, y: 0.9, gain: 1 });
  }
  function jump(game){
    if (frog.jumping) return;
    frog.jumping = 1e-6; frog.jx = frog.x; frog.jy = frog.y;
    // pula para um ponto próximo na margem, virando-se
    let tx = frog.x + frog.dir * (60 + game.rand() * 50);
    if (tx < game.W * 0.55 || tx > game.W - 30){ frog.dir = -frog.dir; tx = frog.x + frog.dir * 80; }
    frog.tx = Math.min(game.W - 30, Math.max(game.W * 0.55, tx));
    frog.ty = game.H - 22 - game.rand() * 12;
    croak(game);
  }

  LQ.register('frog', {
    init(game){ home(game); },
    onUnlock(id, game){ if (id === 'frog') home(game); },
    onResize(game){
      // volta a sentar na margem inferior (y era relativo ao H antigo); x limitado à faixa da direita
      frog.jumping = 0;
      frog.x = Math.min(game.W - 30, Math.max(game.W * 0.55, frog.x));
      frog.y = game.H - 22 - game.rand() * 10;
    },
    update(dt, game){
      if (!game.has('frog')) return;
      if (frog.x > game.W - 20) home(game); // após resize
      if (frog.puff > 0){ frog.puff += dt; if (frog.puff > 0.45) frog.puff = 0; }
      if (frog.jumping > 0){
        frog.jumping += dt;
        const k = Math.min(1, frog.jumping / JUMP_T);
        frog.x = frog.jx + (frog.tx - frog.jx) * k;
        frog.y = frog.jy + (frog.ty - frog.jy) * k;
        if (k >= 1){
          frog.jumping = 0;
          // pouso na margem: anel na água logo acima
          game.spawnRipple(frog.x - frog.dir * 10, frog.y - 14, { strength: 0.6, rings: 2 });
          game.spawnDrops(frog.x, frog.y - 12, 3);
          game.audio.play('plop', { x: frog.x / game.W, y: 0.9, gain: 0.2 });
        }
        return;
      }
      frog.croakTimer -= dt;
      if (frog.croakTimer <= 0){ frog.croakTimer = 40 + game.rand() * 50; croak(game); }
      frog.blink -= dt;
      if (frog.blink <= -0.15) frog.blink = 3 + game.rand() * 5;
    },
    onClick(x, y, game){
      if (!game.has('frog') || game.unlockFade('frog') < 0.5) return false;
      if (Math.hypot(x - frog.x, y - frog.y) < 60){
        const was = frog.jumping;
        jump(game);
        // pulo por clique = impacto (idle ganha moeda; zen ignora). Se já pulava, não conta.
        if (!was && game.emit) game.emit('impact', { x: frog.x, y: frog.y, strength: 0.5, source: 'frog' });
        return true;
      }
      return false;
    },
    draw(layer, ctx, game){
      if (layer !== 'lilies' || !game.has('frog')) return;
      const fade = game.unlockFade('frog');
      if (fade <= 0.01) return;
      let x = frog.x, y = frog.y, pose = 0, h = 0;
      if (frog.jumping > 0){
        const k = frog.jumping / JUMP_T;
        h = Math.sin(Math.PI * k) * 34; pose = 2;
      } else if (frog.puff > 0) pose = 1;
      const puff = pose === 1 ? Math.sin(Math.PI * frog.puff / 0.45) : 0;
      const d = frog.dir;
      ctx.save();
      ctx.translate(x, y - h);
      ctx.scale(d, 1);
      ctx.fillStyle = game.palette.dark;
      ctx.globalAlpha = 0.95 * fade;
      // corpo
      const bw = 14 + (pose === 2 ? 3 : 0), bh = 9 - (pose === 2 ? 2 : 0);
      ctx.beginPath(); ctx.ellipse(0, -bh, bw, bh, pose === 2 ? -0.35 : 0, 0, TWO_PI); ctx.fill();
      // cabeça
      ctx.beginPath(); ctx.ellipse(10, -bh - 4, 8, 6, 0, 0, TWO_PI); ctx.fill();
      // olhos (protuberâncias)
      ctx.beginPath(); ctx.arc(12, -bh - 9, 2.6, 0, TWO_PI); ctx.arc(7, -bh - 10, 2.4, 0, TWO_PI); ctx.fill();
      // papo inflado
      if (puff > 0){
        ctx.globalAlpha = 0.85 * fade;
        ctx.beginPath(); ctx.ellipse(10, -bh + 2, 6 + 6 * puff, 4 + 5 * puff, 0, 0, TWO_PI); ctx.fill();
        ctx.globalAlpha = 0.95 * fade;
      }
      // pernas
      ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.strokeStyle = game.palette.dark;
      ctx.beginPath();
      if (pose === 2){
        ctx.moveTo(-10, -bh); ctx.lineTo(-20, -bh + 4); ctx.lineTo(-30, -bh + 10); // traseira esticada
        ctx.moveTo(8, -bh + 4); ctx.lineTo(14, -bh + 12);                          // dianteira
      } else {
        ctx.moveTo(-10, -bh + 2); ctx.lineTo(-18, -bh - 4); ctx.lineTo(-14, 0);    // traseira dobrada
        ctx.moveTo(8, -bh + 5); ctx.lineTo(10, 0);                                 // dianteira
      }
      ctx.stroke();
      // reflexo dos olhos (pisca)
      if (frog.blink > 0 && pose !== 2){
        ctx.fillStyle = game.palette.light;
        ctx.globalAlpha = 0.5 * fade;
        ctx.fillRect(12, -bh - 10, 1.5, 1.5); ctx.fillRect(7, -bh - 11, 1.5, 1.5);
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  });
})();
</script>
<script>
// Céu: estrelas, lua, nuvem, estrela cadente, aurora, montanhas, pássaros do amanhecer.
(function(){
  'use strict';
  const LQ = window.LQ;
  const TAU = Math.PI * 2;

  // PRNG local com semente fixa (formas estáveis entre resizes)
  function mkRand(seed){ let s = seed | 1; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
  function hexToRgb(h){ const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function lerpHex(a, b, t){
    const A = hexToRgb(a), B = hexToRgb(b);
    return '#' + [0, 1, 2].map(i => Math.max(0, Math.min(255, Math.round(A[i] + (B[i] - A[i]) * t))).toString(16).padStart(2, '0')).join('');
  }

  // ---------- estrelas ----------
  const STAR_TOTAL = 60, DYN = 12;
  const stars = [];        // {nx, ny, size, phase, speed}
  let starCv = null, starCvN = -1, starCvW = 0, starCvH = 0, starCvVer = -1;
  let visibleN = 15;
  let lastW = 0, lastH = 0;

  // ---------- lua ----------
  let moonCv = null, moonKey = '';
  let moonRise = null;     // game.t em que começou a nascer (null = ainda não)
  const MOON_RISE_T = 90;
  let cloudX = -1, cloudSpeed = 8;

  // ---------- estrela cadente ----------
  let shootTimer = 0;
  const shoot = { active: false, x: 0, y: 0, vx: 0, vy: 0, age: 0 };

  // ---------- aurora ----------
  let auroraCv = null, auroraCtx = null, auroraAt = -1, auroraK = -1;
  const AURORA_HZ = 15;    // repinta o offscreen a 15 Hz (o blur do upscale esconde o passo)
  let noiseCv = null;      // sprite 256x256 de ruído azul-frio (quebra o banding das faixas escaladas)
  const NOISE_T = 256;
  const OVERLAY_OK = (function(){ // 'overlay' suportado? senão cai em 'lighter'
    try { const c = document.createElement('canvas').getContext('2d'); c.globalCompositeOperation = 'overlay'; return c.globalCompositeOperation === 'overlay'; } catch (e){ return false; }
  })();

  // ---------- montanhas ----------
  let mBack = null, mFront = null;
  let mColVer = -1, mColBack = '#000', mColFront = '#000';

  // ---------- pássaros ----------
  const birds = [];        // {x, y, vx, phase}
  let prevPhase = -1, dawnDone = false;


  function buildStars(game){
    stars.length = 0;
    const r = mkRand(7331);
    for (let i = 0; i < STAR_TOTAL; i++){
      stars.push({ nx: r(), ny: Math.pow(r(), 0.8), size: r() < 0.25 ? 2 : 1, phase: r() * TAU, speed: 0.6 + r() * 1.6, a: 0.35 + r() * 0.5 });
    }
  }
  function starCount(game){
    return Math.round(15 + 20 * game.unlockFade('stars2') + 25 * game.unlockFade('sky_alive'));
  }
  // Bakea as estrelas assentadas (todas menos as DYN dinâmicas) num offscreen
  function bakeStars(game, n){
    const W = game.W, hy = game.horizonY;
    if (!starCv) starCv = document.createElement('canvas');
    starCv.width = W; starCv.height = hy;
    const g = starCv.getContext('2d');
    g.fillStyle = game.palette.light;
    const settled = Math.max(0, n - DYN);
    for (let i = 0; i < settled; i++){
      const s = stars[i];
      g.globalAlpha = s.a * 0.8;
      g.fillRect(Math.round(s.nx * W), Math.round(s.ny * hy), s.size, s.size);
    }
    starCvN = n; starCvW = W; starCvH = hy; starCvVer = game.paletteVersion;
  }

  function buildMoon(game){
    const R = Math.max(8, Math.round(Math.min(game.W, game.H) * 0.035));
    const key = R + '|' + game.palette.light;
    if (key === moonKey && moonCv) return R;
    moonKey = key;
    const G = R * 3;
    if (!moonCv) moonCv = document.createElement('canvas'); // reutiliza o offscreen
    moonCv.width = moonCv.height = G * 2;
    const g = moonCv.getContext('2d');
    const grad = g.createRadialGradient(G, G, R * 0.9, G, G, G);
    grad.addColorStop(0, game.palette.light + '55');
    grad.addColorStop(0.4, game.palette.light + '18');
    grad.addColorStop(1, game.palette.light + '00');
    g.fillStyle = grad; g.fillRect(0, 0, G * 2, G * 2);
    g.fillStyle = game.palette.light;
    g.beginPath(); g.arc(G, G, R, 0, TAU); g.fill();
    // leve sombra de crateras
    g.fillStyle = game.palette.horizon; g.globalAlpha = 0.12;
    g.beginPath(); g.arc(G - R * 0.3, G - R * 0.2, R * 0.28, 0, TAU); g.fill();
    g.beginPath(); g.arc(G + R * 0.35, G + R * 0.3, R * 0.18, 0, TAU); g.fill();
    return R;
  }

  function buildMountains(game){
    const W = game.W, hy = game.horizonY;
    const r = mkRand(4242);
    function ridge(hMax, seg, yBase){
      const p = new Path2D();
      p.moveTo(-10, hy + 4);
      p.lineTo(-10, hy - yBase);
      let x = -10;
      const step = W / seg;
      for (let i = 0; i <= seg + 1; i++){
        const h = hMax * (0.35 + 0.65 * Math.abs(Math.sin(i * 1.7 + r() * 0.8)) * (0.6 + 0.4 * r()));
        x = -10 + i * step;
        p.lineTo(x, hy - yBase - h);
      }
      p.lineTo(W + 10, hy - yBase);
      p.lineTo(W + 10, hy + 4);
      p.closePath();
      return p;
    }
    mBack = ridge(hy * 0.22, 9, hy * 0.02);
    mFront = ridge(hy * 0.13, 14, 0);
  }

  function ensureAurora(game){
    const w = Math.max(48, Math.round(game.W / 8)), h = Math.max(32, Math.round(game.horizonY / 2)); // 1/8: mais blur de graça
    if (!auroraCv){ auroraCv = document.createElement('canvas'); auroraCtx = auroraCv.getContext('2d'); }
    if (auroraCv.width !== w || auroraCv.height !== h){ auroraCv.width = w; auroraCv.height = h; auroraAt = -1; }
  }
  // Sprite de ruído pré-gerado (64x64, azul frio, pixels aleatórios) — desenhado em tile sobre a aurora
  function ensureNoise(){
    if (noiseCv) return noiseCv;
    noiseCv = document.createElement('canvas'); noiseCv.width = noiseCv.height = NOISE_T;
    const g = noiseCv.getContext('2d'), img = g.createImageData(NOISE_T, NOISE_T), d = img.data, r = mkRand(9091);
    for (let i = 0; i < d.length; i += 4){
      const v = 120 + Math.floor(r() * 135);
      d[i] = v * 0.7; d[i + 1] = v * 0.85; d[i + 2] = v; d[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    return noiseCv;
  }
  // Ruído azul sutil por cima (alpha 0.02) — só onde há aurora, via clip retangular do destino
  function drawNoise(ctx, x, y, w, h, a){
    const n = ensureNoise();
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.globalCompositeOperation = OVERLAY_OK ? 'overlay' : 'lighter';
    ctx.globalAlpha = a;
    for (let yy = y; yy < y + h; yy += NOISE_T) for (let xx = x; xx < x + w; xx += NOISE_T) ctx.drawImage(n, xx, yy);
    ctx.restore();
  }
  // Redesenha o offscreen da aurora: 6 faixas com alpha senoidal; cada coluna é afunilada em
  // 5 rects (alpha 0.25/0.6/1/0.6/0.25) para não haver borda dura; ondas com fase/frequência
  // distintas por faixa, janela horizontal suave e faixas de baixo esmaecendo (sem 'degrau').
  const TAPER = [0.25, 0.6, 1, 0.6, 0.25];
  // qualidade do upscale da aurora: 'high' até ~1600 px de largura; acima disso 'low' (custo por área)
  const auroraQuality = game => game.W > 1600 ? 'low' : 'high';
  function paintAurora(game, k){
    ensureAurora(game);
    // throttle: só repinta quando passou 1/AURORA_HZ s (ou k mudou bastante, p.ex. no fade de entrada)
    if (auroraAt >= 0 && game.t - auroraAt < 1 / AURORA_HZ && Math.abs(k - auroraK) < 0.02) return;
    auroraAt = game.t; auroraK = k;
    const g = auroraCtx, w = auroraCv.width, h = auroraCv.height, t = game.t;
    g.clearRect(0, 0, w, h);
    const cols = [game.palette.auroraG, game.palette.auroraP];
    const sx = (game.W / 4) / w; // frequências em 'px de offscreen 1/4' (spec), independentes da escala real
    for (let b = 0; b < 6; b++){
      g.fillStyle = cols[b % 2];
      const yb = h * (0.08 + b * 0.13), bh = h * 0.14, step = bh * 0.45;
      const fadeB = b >= 4 ? (b === 4 ? 0.7 : 0.4) : 1;
      for (let x = 0; x < w; x += 2){
        const X = x * sx;
        const a = 0.5 + 0.5 * Math.sin(X * 0.025 + t * 0.3 + b * 0.7);
        const y = yb + Math.sin(X * 0.05 * (0.6 + b * 0.15) + t * 0.2 + b * 1.9) * h * 0.12
                     + Math.sin(X * 0.013 + t * 0.07 + b) * h * 0.05;
        const win = Math.pow(Math.sin(Math.PI * (x + 1) / (w + 2)), 0.6); // janela horizontal
        const base = (0.045 + 0.045 * a) * k * 0.55 * win * fadeB / 1.6; // /1.6: 5 rects somam mais que 3
        for (let i = 0; i < 5; i++){
          g.globalAlpha = base * TAPER[i];
          g.fillRect(x, y + (i - 2) * step, 2, bh);
        }
      }
    }
    g.globalAlpha = 1;
  }

  LQ.register('sky', {
    init(game){
      buildStars(game);
      buildMountains(game);
      lastW = game.W; lastH = game.H;
      shootTimer = 120 + game.rand() * 120;
      cloudX = -game.W * 0.2;
      // lua já desbloqueada em sessão anterior: nasce imediatamente cheia
      if (game.has('moon')) moonRise = -MOON_RISE_T; // já cheia
      dawnDone = game.state.achievements.indexOf('until_dawn') >= 0;
    },

    onUnlock(id, game){
      if (id === 'moon' && moonRise === null) moonRise = game.t;
      if (id === 'sky_alive') shootTimer = 30 + game.rand() * 60;
    },

    onResize(game){ lastW = game.W; lastH = game.H; buildMountains(game); starCvN = -1; },
    update(dt, game){
      if (game.W !== lastW || game.H !== lastH){ lastW = game.W; lastH = game.H; buildMountains(game); starCvN = -1; }
      visibleN = starCount(game);

      // nuvem fina cruzando a lua
      if (game.has('sky_alive')){
        cloudX += cloudSpeed * dt;
        if (cloudX > game.W * 1.3) cloudX = -game.W * 0.3;
      }

      // estrela cadente
      if (game.has('sky_alive') && game.dayPhase < 0.3){
        if (!shoot.active){
          shootTimer -= dt;
          if (shootTimer <= 0){
            shootTimer = 120 + game.rand() * 120;
            shoot.active = true; shoot.age = 0;
            shoot.x = game.W * (0.1 + game.rand() * 0.8); shoot.y = game.horizonY * (0.05 + game.rand() * 0.4);
            const dir = game.rand() < 0.5 ? -1 : 1, sp = 500 + game.rand() * 300;
            shoot.vx = dir * sp; shoot.vy = sp * (0.25 + game.rand() * 0.25);
            game.audio.play('shooting', { x: shoot.x / game.W, gain: 1 });
          }
        } else {
          shoot.age += dt; shoot.x += shoot.vx * dt; shoot.y += shoot.vy * dt;
          if (shoot.age > 0.4) shoot.active = false;
        }
      }

      // lua
      if (moonRise !== null){
        const R = buildMoon(game);
        const k = game.ease.smoothstep((game.t - moonRise) / MOON_RISE_T);
        game.moonR = R;
        game.moonX = game.W * 0.78;
        game.moonY = game.horizonY + R * 1.5 - k * (game.horizonY + R * 1.5 - game.horizonY * 0.32);
        if (k >= 1 && moonRise >= 0) game.achievement('full_moon'); // só se nasceu nesta sessão
      } else game.moonR = 0;

      // amanhecer: pássaros ao começar a clarear; achievement no dia pleno
      if (game.has('dawn')){
        const ph = game.dayPhase;
        if (prevPhase >= 0 && prevPhase < 0.15 && ph >= 0.15 && ph > prevPhase){
          birds.length = 0;
          const dir = game.rand() < 0.5 ? 1 : -1;
          for (let i = 0; i < 3; i++){
            birds.push({ x: dir > 0 ? -40 - i * 30 : game.W + 40 + i * 30, y: game.horizonY * (0.3 + i * 0.07 + game.rand() * 0.05), vx: dir * (35 + game.rand() * 10), phase: game.rand() * TAU });
          }
          game.audio.play('birds', { x: dir > 0 ? 0.1 : 0.9, gain: 1 });
        }
        if (ph >= 0.99 && !dawnDone){ dawnDone = true; game.achievement('until_dawn'); }
        prevPhase = ph;
      }
      for (let i = birds.length - 1; i >= 0; i--){
        const b = birds[i]; b.x += b.vx * dt; b.phase += dt * 6;
        if (b.x < -80 || b.x > game.W + 80) birds.splice(i, 1);
      }
    },

    draw(layer, ctx, game){
      const W = game.W, hy = game.horizonY, P = game.palette;
      const night = 1 - game.dayPhase; // estrelas somem de dia

      if (layer === 'sky'){
        if (starCvN !== visibleN || starCvW !== W || starCvH !== hy || starCvVer !== game.paletteVersion) bakeStars(game, visibleN);
        if (night > 0.02){
          ctx.globalAlpha = night;
          ctx.drawImage(starCv, 0, 0);
          // estrelas dinâmicas (piscam mais com o vento)
          const wind = 0.5 + 0.5 * game.unlockFade('wind');
          ctx.fillStyle = P.light;
          const from = Math.max(0, visibleN - DYN);
          for (let i = from; i < visibleN; i++){
            const s = stars[i];
            const tw = 0.5 + 0.5 * Math.sin(game.t * s.speed + s.phase);
            ctx.globalAlpha = night * s.a * (1 - wind * 0.7 + wind * 0.7 * tw);
            ctx.fillRect(Math.round(s.nx * W), Math.round(s.ny * hy), s.size, s.size);
          }
          ctx.globalAlpha = 1;
        }
        // pássaros do amanhecer (3 chevrons)
        if (birds.length){
          ctx.strokeStyle = P.dark; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.6;
          for (const b of birds){
            const f = 3 + 2 * Math.sin(b.phase);
            ctx.beginPath(); ctx.moveTo(b.x - 6, b.y - f); ctx.lineTo(b.x, b.y); ctx.lineTo(b.x + 6, b.y - f); ctx.stroke();
          }
          ctx.globalAlpha = 1;
        }
      }

      else if (layer === 'aurora'){
        const k = game.unlockFade('aurora') * night;
        if (k <= 0.01) return;
        paintAurora(game, k);
        // upscale 8× de uma imagem já borrada: bilinear ('low') basta e custa ~40% menos em telas grandes
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = auroraQuality(game);
        ctx.drawImage(auroraCv, 0, 0, W, hy * 0.7);
        drawNoise(ctx, 0, 0, W, Math.ceil(hy * 0.7), 0.02 * k);
      }

      else if (layer === 'moon'){
        if (moonRise !== null && game.moonR > 0){
          const R = game.moonR, G = R * 3;
          ctx.globalAlpha = 0.55 + 0.45 * night;
          ctx.drawImage(moonCv, game.moonX - G, game.moonY - G, G * 2, G * 2);
          ctx.globalAlpha = 1;
          // nuvem fina
          if (game.has('sky_alive')){
            ctx.fillStyle = P.light; ctx.globalAlpha = 0.08 * game.unlockFade('sky_alive');
            ctx.beginPath(); ctx.ellipse(cloudX, game.moonY + R * 0.3, R * 3.2, R * 0.45, 0, 0, TAU); ctx.fill();
            ctx.beginPath(); ctx.ellipse(cloudX + R * 1.5, game.moonY + R * 0.55, R * 2, R * 0.3, 0, 0, TAU); ctx.fill();
            ctx.globalAlpha = 1;
          }
        }
      }

      else if (layer === 'mountains'){
        const k = game.unlockFade('fog_clear');
        if (k <= 0.01 || !mBack) return;
        const px = game.mouse.x < 0 ? 0 : (game.mouse.x / W - 0.5) * 2; // parallax 2 px
        ctx.globalAlpha = k;
        if (mColVer !== game.paletteVersion){ // cores só mudam com a paleta
          mColVer = game.paletteVersion;
          mColBack = lerpHex(P.horizon, P.zenith, 0.45);
          mColFront = lerpHex(lerpHex(P.horizon, P.zenith, 0.85), P.dark, 0.25);
        }
        ctx.fillStyle = mColBack;
        ctx.translate(px * 0.5, 0); ctx.fill(mBack); ctx.translate(-px * 0.5, 0);
        ctx.fillStyle = mColFront;
        ctx.translate(px, 0); ctx.fill(mFront); ctx.translate(-px, 0);
        ctx.globalAlpha = 1;
      }

      else if (layer === 'water'){
        // reflexo espelhado das estrelas perto do horizonte (alpha 0.35)
        if (night > 0.02 && starCv){
          const sh = Math.round(hy * 0.4);
          ctx.globalAlpha = 0.35 * night;
          ctx.save(); ctx.translate(0, hy); ctx.scale(1, -1);
          ctx.drawImage(starCv, 0, hy - sh, W, sh, 0, -sh, W, sh);
          ctx.restore();
          // aurora refletida
          const ka = game.eco ? 0 : game.unlockFade('aurora') * night;
          if (ka > 0.01 && auroraCv){
            ctx.globalAlpha = 0.15 * night;
            ctx.save(); ctx.translate(0, hy); ctx.scale(1, -1);
            ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = auroraQuality(game);
            ctx.drawImage(auroraCv, 0, -hy * 0.7, W, hy * 0.7);
            ctx.restore();
            drawNoise(ctx, 0, hy, W, Math.ceil(hy * 0.7), 0.01 * ka); // metade do alpha do céu
          }
          ctx.globalAlpha = 1;
        }
      }

      else if (layer === 'light'){
        if (shoot.active){
          const f = 1 - shoot.age / 0.4;
          ctx.strokeStyle = P.light; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.7 * f;
          ctx.beginPath(); ctx.moveTo(shoot.x, shoot.y); ctx.lineTo(shoot.x - shoot.vx * 0.12, shoot.y - shoot.vy * 0.12); ctx.stroke();
          const sp = game.sprite.glow(P.light, 10);
          ctx.globalAlpha = 0.6 * f;
          ctx.drawImage(sp, shoot.x - 10, shoot.y - 10, 20, 20);
          ctx.globalAlpha = 1;
        }
      }
    }
  });
})();

<script>
// Névoa baixa: sprite próprio (18% de H) com gradiente + dithering (ruído 1-2%), alpha 0.15,
// 2 passadas com offsets senoidais distintos; dissipa em 60 s após 'fog_clear'.
(function(){
  'use strict';
  const LQ = window.LQ;
  const BASE_A = 0.15, CLEAR_T = 60, H_FRAC = 0.18;
  let clearAt = -1;   // game.t em que começou a dissipar
  let alpha = BASE_A;
  let sp = null, spKey = '';

  function mkRand(seed){ let s = seed | 1; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
  function hexToRgb(h){ const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

  // Sprite: perfil vertical em sino (sem borda: 0 nas pontas), janela horizontal suave e
  // ruído de ±1.5% no alpha de cada pixel (quebra o banding do gradiente 8-bit).
  function build(game){
    const W = game.W + 80, H = Math.max(8, Math.round(game.H * H_FRAC));
    const key = W + 'x' + H + '|' + game.palette.fog;
    if (key === spKey && sp) return;
    spKey = key;
    if (!sp) sp = document.createElement('canvas');
    sp.width = W; sp.height = H;
    const g = sp.getContext('2d');
    const [cr, cg, cb] = hexToRgb(game.palette.fog);
    const img = g.createImageData(W, H), d = img.data, r = mkRand(5150);
    const prof = new Float32Array(H), win = new Float32Array(W);
    for (let y = 0; y < H; y++){ const v = Math.sin(Math.PI * (y + 0.5) / H); prof[y] = Math.pow(v, 1.6); }
    for (let x = 0; x < W; x++){ const u = (x + 0.5) / W; win[x] = 0.7 + 0.3 * Math.sin(Math.PI * u); }
    for (let y = 0; y < H; y++){
      for (let x = 0; x < W; x++){
        const i = (y * W + x) * 4;
        let a = prof[y] * win[x] * 0.45;               // pico ~0.45 → névoa fina, não faixa
        a += (r() - 0.5) * 0.03 * a + (r() - 0.5) * 0.008; // dithering 1-2%
        d[i] = cr; d[i + 1] = cg; d[i + 2] = cb;
        d[i + 3] = Math.max(0, Math.min(255, Math.round(a * 255)));
      }
    }
    g.putImageData(img, 0, 0);
  }

  LQ.register('fog', {
    init(game){
      if (game.has('fog_clear')){ clearAt = -CLEAR_T; alpha = 0; }
      build(game);
    },
    onResize(game){ build(game); },
    onUnlock(id, game){
      if (id === 'fog_clear' && clearAt < 0){
        clearAt = game.t;
        game.audio.ambient.set({ fogOpen: true });
      }
    },
    update(dt, game){
      let k = 1;
      if (clearAt >= 0) k = 1 - game.ease.smoothstep((game.t - clearAt) / CLEAR_T);
      alpha = BASE_A * k * (1 - 0.6 * game.dayPhase);
    },
    draw(layer, ctx, game){
      if (layer !== 'fog' || alpha < 0.003) return;
      build(game); // barato quando a chave não muda (resize/paleta)
      const t = game.t;
      const y = game.horizonY - sp.height * 0.45;
      // passada 1: deriva lenta
      ctx.globalAlpha = alpha;
      ctx.drawImage(sp, -40 + Math.sin(t * 0.3) * 10, y);
      // passada 2: mais tênue, direção e ritmo diferentes, um pouco mais baixa (profundidade)
      ctx.globalAlpha = alpha * 0.45;
      ctx.drawImage(sp, -40 - Math.sin(t * 0.19 + 1.3) * 14, y + sp.height * 0.3 + Math.sin(t * 0.11) * 3);
      ctx.globalAlpha = 1;
    }
  });
})();
</script>
