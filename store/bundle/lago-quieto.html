  const snow = [], leaves = [], strokes = [], bio = [];
  for (let i = 0; i < SNOW_MAX; i++) snow.push({ x: 0, y: 0, vx: 0, vy: 0, r: 1, ph: 0, a: 0 });
  for (let i = 0; i < LEAF_MAX; i++) leaves.push({ x: 0, y: 0, vx: 0, vy: 0, rot: 0, vr: 0, w: 6, h: 3, ph: 0, water: false, bob: 0, c: 0, alive: false });
  for (let i = 0; i < STROKE_MAX; i++) strokes.push({ active: false, x: 0, y: 0, age: 0, seed: 0 });
  for (let i = 0; i < BIO_MAX; i++) bio.push({ active: false, x: 0, y: 0, ang: 0, age: 0, life: 1, rad: 0 });
  let strokeCur = 0, bioCur = 0, leafTimer = 0;
  const LEAF_COLORS = ['#b8452a', '#d0642e', '#a83a2a', '#c8863a', '#8a2e22'];

  let theme = 'night', ready = false;
  let themeAt = -1e9; // game.t da última troca: entidades do tema entram em fade (§3, "nunca pop")
  function themeFade(game){ return game.ease.smoothstep((game.t - themeAt) / 5); }

  function cap(n, game){ return game.eco ? Math.floor(n * 0.5) : n; }

  // ---------- Neve (inverno) ----------
  function resetFlake(f, game, top){
    f.x = game.rand() * (game.W + 40) - 20;
    f.y = top ? -4 : game.rand() * game.H;
    f.vy = 14 + game.rand() * 26; f.vx = 0;
    f.r = 0.8 + game.rand() * 1.4; f.ph = game.rand() * 6.28;
    f.a = 0.35 + game.rand() * 0.45;
  }
  function updateSnow(dt, game){
    const n = cap(SNOW_MAX, game), wind = game.has('wind') ? 8 : 3;
    for (let i = 0; i < n; i++){
      const f = snow[i];
      f.ph += dt; f.y += f.vy * dt; f.x += (Math.sin(f.ph * 1.3) * 6 + wind) * dt;
      if (f.y > game.H + 4 || f.x > game.W + 30) resetFlake(f, game, true);
    }
  }
  function drawSnow(ctx, game){
    const n = cap(SNOW_MAX, game);
    ctx.fillStyle = game.palette.light;
    const tf = themeFade(game);
    for (let i = 0; i < n; i++){
      const f = snow[i];
      // flocos sobre a água ficam mais fracos (quase derretendo)
      ctx.globalAlpha = (f.y > game.horizonY ? f.a * 0.5 : f.a) * tf;
      ctx.fillRect(f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
    }
    ctx.globalAlpha = 1;
  }
  // gelo fino nas bordas: 2 polígonos claros junto à margem
  function drawIce(ctx, game){
    const W = game.W, H = game.H, tf = themeFade(game);
    ctx.fillStyle = game.palette.light;
    ctx.globalAlpha = 0.07 * tf;
    ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, H - 70); ctx.quadraticCurveTo(W * 0.12, H - 55, W * 0.22, H); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(W, H); ctx.lineTo(W, H - 55); ctx.quadraticCurveTo(W * 0.9, H - 40, W * 0.8, H); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 0.12 * tf;
    ctx.beginPath(); ctx.moveTo(0, H - 70); ctx.quadraticCurveTo(W * 0.12, H - 55, W * 0.22, H); ctx.lineWidth = 1; ctx.strokeStyle = game.palette.light; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W, H - 55); ctx.quadraticCurveTo(W * 0.9, H - 40, W * 0.8, H); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---------- Folhas (outono) ----------
  function spawnLeaf(game, onWater){
    let l = null;
    for (let i = 0; i < LEAF_MAX; i++) if (!leaves[i].alive){ l = leaves[i]; break; }
    if (!l) return;
    l.alive = true; l.x = game.rand() * game.W;
    l.y = onWater ? game.horizonY + 10 + game.rand() * (game.H - game.horizonY - 20) : -6;
    l.water = onWater; l.vx = 0; l.vy = onWater ? 0 : 18 + game.rand() * 20;
    l.rot = game.rand() * 6.28; l.vr = (game.rand() - 0.5) * 2;
    l.w = 5 + game.rand() * 4; l.h = l.w * 0.5; l.ph = game.rand() * 6.28; l.bob = 0;
    l.c = Math.floor(game.rand() * LEAF_COLORS.length);
  }
  function updateLeaves(dt, game){
    leafTimer -= dt;
    const target = cap(LEAF_MAX, game);
    if (leafTimer <= 0){ leafTimer = 2 + game.rand() * 4; let alive = 0; for (const l of leaves) if (l.alive) alive++; if (alive < target) spawnLeaf(game, false); }
    const wind = game.has('wind') ? 10 : 4;
    for (const l of leaves){
      if (!l.alive) continue;
      l.ph += dt;
      if (!l.water){
        l.y += l.vy * dt; l.x += (Math.sin(l.ph * 1.1) * 14 + wind) * dt; l.rot += l.vr * dt;
        // toca a água: passa a flutuar (anel fraquinho, sem som)
        if (l.y > game.horizonY + 8 + (l.x / game.W) * (game.H - game.horizonY) * 0.9){
          l.water = true; l.vy = 0; l.vr *= 0.2;
          game.spawnRipple(l.x, l.y, { strength: 0.3, rings: 1 });
        }
      } else {
        l.vx *= (1 - 1.5 * dt); l.vy *= (1 - 1.5 * dt);
        l.x += (l.vx + Math.sin(l.ph * 0.4) * 3 + wind * 0.15) * dt; l.y += l.vy * dt;
        l.rot += l.vr * dt; l.bob *= (1 - 2.5 * dt);
        if (l.x > game.W + 20 || l.x < -20 || l.y > game.H + 10 || l.y < game.horizonY) l.alive = false;
      }
    }
  }
  function drawLeaves(ctx, game){
    const tf = themeFade(game);
    for (const l of leaves){
      if (!l.alive) continue;
      const y = l.y + (l.water ? Math.sin(l.ph * 5) * l.bob : 0);
      ctx.fillStyle = LEAF_COLORS[l.c];
      ctx.globalAlpha = (l.water ? 0.8 : 0.9) * tf;
      ctx.save(); ctx.translate(l.x, y); ctx.rotate(l.rot);
      ctx.beginPath(); ctx.ellipse(0, 0, l.w, l.water ? l.h * 0.55 : l.h, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  function pushLeaves(x, y, game){
    for (const l of leaves){
      if (!l.alive || !l.water) continue;
      const dx = l.x - x, dy = (l.y - y) / 0.35, d = Math.sqrt(dx * dx + dy * dy);
      if (d > 160 || d < 1) continue;
      const k = (1 - d / 160) * 40;
      l.vx += dx / d * k; l.vy += dy / d * k * 0.35; l.vr += (game.rand() - 0.5) * 1.5; l.bob = 2.5 * (1 - d / 160);
    }
  }

  // ---------- Pinceladas (tinta) ----------
  function addStroke(x, y, game){
    const s = strokes[strokeCur]; strokeCur = (strokeCur + 1) % STROKE_MAX;
    s.active = true; s.x = x; s.y = y; s.age = 0; s.seed = game.rand() * 100;
  }
  function updateStrokes(dt){
    for (const s of strokes){ if (!s.active) continue; s.age += dt; if (s.age > 1.8) s.active = false; }
  }
  // anel como pincelada: segmentos com lineWidth variável e falhas (pincel seco)
  function drawStrokes(ctx, game){
    ctx.strokeStyle = game.palette.ring; ctx.lineCap = 'round';
    const SEG = 14;
    for (const s of strokes){
      if (!s.active) continue;
      const f = 1 - s.age / 1.8, rad = s.age * 60;
      if (rad < 2) continue;
      const alpha = 0.85 * f * f;
      if (alpha < 0.02) continue;
      ctx.globalAlpha = alpha;
      for (let i = 0; i < SEG; i++){
        const a0 = i / SEG * Math.PI * 2, a1 = (i + 1) / SEG * Math.PI * 2;
        const wv = Math.sin(a0 * 3 + s.seed) * 0.5 + 0.5;
        if (wv < 0.18 && s.age > 0.5) continue; // falha de tinta
        ctx.lineWidth = (0.6 + wv * 3.2) * (0.5 + 0.5 * f);
        ctx.beginPath();
        ctx.ellipse(s.x, s.y, rad, rad * 0.35, 0, a0, a1);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1; ctx.lineWidth = 1.5; ctx.lineCap = 'butt';
  }

  // ---------- Bioluminescência (tropical) ----------
  function addBio(x, y, game){
    const n = cap(14, game);
    for (let k = 0; k < n; k++){
      const b = bio[bioCur]; bioCur = (bioCur + 1) % BIO_MAX;
      b.active = true; b.x = x; b.y = y; b.ang = game.rand() * Math.PI * 2;
      b.age = 0; b.life = 0.9 + game.rand() * 1.1; b.rad = 0.4 + game.rand() * 0.6;
    }
  }
  function updateBio(dt){
    for (const b of bio){ if (!b.active) continue; b.age += dt; if (b.age > b.life) b.active = false; }
  }
  function drawBio(ctx, game){
    const sp = game.sprite.glow('#3fd8ff', 10);
    for (const b of bio){
      if (!b.active) continue;
      const k = b.age / b.life, r = b.age * 60 * b.rad;
      const x = b.x + Math.cos(b.ang) * r, y = b.y + Math.sin(b.ang) * r * 0.35;
      ctx.globalAlpha = 0.55 * Math.sin(Math.PI * k) * (k < 1 ? 1 : 0);
      const sz = 8 + 10 * k;
      ctx.drawImage(sp, x - sz, y - sz, sz * 2, sz * 2);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Achievements (§8) não cobertos pelo núcleo ----------
  // Núcleo já dá: first_stone, woke_someone, clear_view, aurora, just_watching, accidental_melody, left_light_on, thousand_ripples.
  // golden_fish/night_bloom: ent/fish.js e ent/lilies.js; full_moon/until_dawn: ent/sky.js.

  // ---------- Tinta (prestígio do idle) ----------
  // O núcleo já tem game.setPaletteOverride({chave:'#hex'}|null): valores ABSOLUTOS aplicados
  // por cima da paleta-alvo (depois de tema + fase do dia). LQ.themes.tint() fica por cima disso:
  // recebe {color:'#hex', amount:0..1, keys?:[...]} (ou null) e calcula o override MISTURANDO a cor
  // com a paleta noturna do tema atual — assim a tinta respeita o tema (papel do 'ink' fica claro,
  // tropical fica verde-água etc.) e é recalculada a cada troca de tema (applyTheme).
  // Limite: como o override é absoluto, durante a fase de dia (dawn) as chaves tingidas ficam na
  // versão noturna; no idle 'dawn' só entra por forceUnlock, então é aceitável.
  const BASE_NIGHT = { zenith: '#050914', horizon: '#0b1a33', shore: '#123a5c', ring: '#1f5f7a',
    light: '#e9f2ff', firefly: '#d8f27a', gold: '#e8b04a', dark: '#0d2a1f',
    auroraG: '#7ad3c9', auroraP: '#8a6bc9', dawn: '#f2b8a2', fog: '#ffffff' };
  const TINT_KEYS = ['zenith', 'horizon', 'shore', 'ring'];
  let tint = null; // {color, amount, keys}
  function hexToRgb(h){ const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function mixHex(a, b, t){
    const A = hexToRgb(a), B = hexToRgb(b);
    return '#' + A.map((v, i) => Math.max(0, Math.min(255, Math.round(v + (B[i] - v) * t))).toString(16).padStart(2, '0')).join('');
  }
  function applyTint(game){
    game = game || LQ.game;
    if (!game || !game.setPaletteOverride) return;
    if (!tint){ game.setPaletteOverride(null); return; }
    const th = T[theme] || {};
    const base = Object.assign({}, BASE_NIGHT, th.night || th);
    const out = {};
    for (const k of tint.keys) if (base[k]) out[k] = mixHex(base[k], tint.color, tint.amount);
    game.setPaletteOverride(out);
  }
  // LQ.themes.tint(obj|null): obj = {color:'#hex', amount?:0.12, keys?:[...]}; null limpa.
  T.tint = function(obj){
    if (!obj || !obj.color){ tint = null; applyTint(); return; }
    tint = { color: obj.color, amount: Math.max(0, Math.min(1, obj.amount == null ? 0.12 : obj.amount)),
      keys: Array.isArray(obj.keys) && obj.keys.length ? obj.keys : TINT_KEYS };
    applyTint();
  };
  T.currentTint = function(){ return tint; };

  // ---------- Troca de tema ----------
  function applyTheme(name, game){
    theme = LQ.themeList.indexOf(name) >= 0 ? name : 'night';
    themeAt = ready ? game.t : -1e9; // no init entra pronto; troca em jogo faz fade de 5 s
    game.lightBlend = theme === 'ink' ? 'multiply' : 'lighter'; // glows em papel claro: escurecem em vez de lavar
    game.audio.setTheme(theme);
    game.hideCoreRipples = theme === 'ink'; // tinta: pinceladas substituem os anéis do núcleo
    document.body.classList.remove('theme-night', 'theme-winter', 'theme-autumn', 'theme-ink', 'theme-tropical');
    document.body.classList.add('theme-' + theme);
    // ícones da UI acompanham a tinta (tema claro)
    document.documentElement.style.setProperty('--ico', theme === 'ink' ? '#1a1a1a' : '#e9f2ff');
    if (theme === 'winter') for (let i = 0; i < SNOW_MAX; i++) resetFlake(snow[i], game, false);
    if (theme === 'autumn'){ for (const l of leaves) l.alive = false; for (let i = 0; i < 8; i++) spawnLeaf(game, true); }
    for (const s of strokes) s.active = false;
    for (const b of bio) b.active = false;
    if (tint) applyTint(game); // tinta recalculada sobre o novo tema
  }

  LQ.register('themes', {
    init(game){
      applyTheme(game.state.theme, game);
      ready = true;
    },
    onTheme(name, game){ applyTheme(name, game); },
    update(dt, game){
      if (!ready) return;
      if (game.state.theme !== theme) applyTheme(game.state.theme, game);
      if (theme === 'winter') updateSnow(dt, game);
      else if (theme === 'autumn') updateLeaves(dt, game);
      else if (theme === 'ink') updateStrokes(dt);
      else if (theme === 'tropical') updateBio(dt);
    },
    onRipple(x, y, game){
      if (theme === 'autumn') pushLeaves(x, y, game);
      else if (theme === 'ink') addStroke(x, y, game);
      else if (theme === 'tropical') addBio(x, y, game);
    },
    draw(layer, ctx, game){
      if (theme === 'winter'){
        if (layer === 'lilies') drawIce(ctx, game);
        else if (layer === 'fog') drawSnow(ctx, game);
      } else if (theme === 'autumn'){
        if (layer === 'lilies') drawLeaves(ctx, game);
      } else if (theme === 'ink'){
        if (layer === 'ripples') drawStrokes(ctx, game);
      } else if (theme === 'tropical'){
        if (layer === 'light') drawBio(ctx, game); // eco: metade das partículas (cap)
      }
    }
  });
})();
</script>
<script>
// Lago Quieto — modo Idle: utilidades numéricas (formatação, custos geométricos).
window.LQ = window.LQ || {};
LQ.IdleUtil = (function(){
  'use strict';
  const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi'];
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;

  // 0-999 inteiro; 1.2K / 12.3K / 123K … Qi; ≥ 1e21 → 1.2e21
  function fmt(n){
    n = Number(n);
    if (!Number.isFinite(n)) return '0';
    const neg = n < 0; if (neg) n = -n;
    if (n < 1000) return (neg ? '-' : '') + Math.floor(n);
    let e = Math.floor(Math.log10(n) / 3);
    if (e >= SUF.length) return (neg ? '-' : '') + n.toExponential(1).replace('+', '');
    let v = n / Math.pow(1000, e);
    // 1 decimal abaixo de 100 (99.96 arredonda para "100.0" → vira "100")
    let s = v < 100 ? v.toFixed(1) : Math.floor(v).toString();
    if (s === '100.0') s = '100';
    return (neg ? '-' : '') + s + SUF[e];
  }

  // Custo total de comprar n unidades tendo `owned` (soma geométrica), arredondado para cima:
  // inteiro para que o que o HUD mostra (fmt = floor) seja exatamente o que é cobrado.
  // Aceita também cost(gen, owned, n) com gen = {base, growth}.
  function cost(base, growth, owned, n){
    if (base && typeof base === 'object'){ n = owned; owned = growth; growth = base.growth; base = base.base; }
    n = Math.max(0, Math.floor(n || 0));
    if (n === 0) return 0;
    const first = base * Math.pow(growth, owned);
    const t = growth === 1 ? first * n : first * (Math.pow(growth, n) - 1) / (growth - 1);
    return Math.ceil(t - 1e-9);
  }

  // Máximo de unidades pagáveis com `cur` (log + verificação). Aceita maxAffordable(gen, owned, cur).
  function maxAffordable(base, growth, owned, cur){
    if (base && typeof base === 'object'){ cur = owned; owned = growth; growth = base.growth; base = base.base; }
    if (!Number.isFinite(cur) || !(cur > 0) || !(base > 0) || !(growth >= 1)) return 0; // dados inválidos/Infinity → nada comprável
    const first = base * Math.pow(growth, owned);
    if (cur < first) return 0;
    let n;
    if (growth === 1) n = Math.floor(cur / first);
    else n = Math.floor(Math.log(cur * (growth - 1) / first + 1) / Math.log(growth));
    // corrige erro de ponto flutuante
    while (n > 0 && cost(base, growth, owned, n) > cur) n--;
    while (n < 1e6 && cost(base, growth, owned, n + 1) <= cur) n++; // teto defensivo
    return n;
  }

  return { fmt, cost, maxAffordable, clamp, lerp };
})();
</script>
<script>
// Lago Quieto — modo Idle: sub-estado game.state.idle (fresh/migrate coercitivos).
window.LQ = window.LQ || {};
LQ.IdleState = (function(){
  'use strict';
  const num = (v, d) => { v = Number(v); return Number.isFinite(v) ? v : d; };
  const MAXV = 1e300; // teto numérico (nunca chega a Infinity/NaN)
  const pos = v => Math.min(MAXV, Math.max(0, num(v, 0)));
  const int = v => Math.max(0, Math.floor(num(v, 0)));
  const idOk = x => typeof x === 'string' && /^[a-z0-9_]{1,40}$/.test(x);

  function fresh(){
    return {
      v: 1, cur: 0, life: 0, gens: {}, ups: [],
      prest: { pts: 0, runs: 0, mult: 1 },
      goals: [], lastTick: 0,
      stats: { clicks: 0, offlineEarned: 0, bestRate: 0, purchases: 0 }
    };
  }

  function migrate(s){
    const f = fresh();
    if (!s || typeof s !== 'object' || Array.isArray(s)) return f;
    const D = LQ.IdleData || { gens: [], upgrades: [], goals: [] };
    const out = fresh();
    out.cur = pos(s.cur); out.life = pos(s.life);
    // só geradores conhecidos, contagem inteira
    if (s.gens && typeof s.gens === 'object') for (const g of D.gens){ if (s.gens[g.id] !== undefined) out.gens[g.id] = int(s.gens[g.id]); }
    const upIds = D.upgrades.map(u => u.id);
    out.ups = Array.isArray(s.ups) ? Array.from(new Set(s.ups.filter(x => idOk(x) && upIds.indexOf(x) >= 0))) : [];
    const p = s.prest && typeof s.prest === 'object' ? s.prest : {};
    out.prest.pts = int(p.pts); out.prest.runs = int(p.runs);
    out.prest.mult = 1 + 0.1 * out.prest.pts; // derivado: nunca confia no save
    const goalIds = D.goals.map(g => g.id);
    out.goals = Array.isArray(s.goals) ? Array.from(new Set(s.goals.filter(x => idOk(x) && goalIds.indexOf(x) >= 0))) : [];
    out.lastTick = pos(s.lastTick);
    const st = s.stats && typeof s.stats === 'object' ? s.stats : {};
    out.stats.clicks = int(st.clicks); out.stats.offlineEarned = pos(st.offlineEarned);
    out.stats.bestRate = pos(st.bestRate); out.stats.purchases = int(st.purchases);
    out.v = 1;
    return out;
  }

  // Entidade: garante o sub-estado e restaura a cena (peixe/lua/... conforme geradores comprados).
  // O núcleo já restaura `unlocked` do save; forceUnlock ignora ids já desbloqueados → sem duplicar.
  LQ.register('idle-state', {
    init(game){
      if (game.mode !== 'idle') return;
      game.state.idle = migrate(game.state.idle);
      const D = LQ.IdleData; if (!D) return;
      for (const g of D.gens) if (game.state.idle.gens[g.id] > 0 && g.unlock) game.forceUnlock(g.unlock);
    }
  });

  return { fresh, migrate };
})();
</script>

<script>
// Lago Quieto — modo Idle: motor da economia (taxa, compras, upgrades, metas, offline, anéis automáticos).
// API pública em LQ.Idle; a entidade 'idle-engine' só age quando game.mode === 'idle'.
window.LQ = window.LQ || {};
LQ.Idle = (function(){
  'use strict';
  const U = LQ.IdleUtil;
  const D = () => LQ.IdleData;
  let game = null;
  const S = () => (game && game.state && game.state.idle) || null;
  const MAXV = 1e300; // teto de cur/life (evita Infinity → HUD '0' e save zerado no migrate)
  function clampState(s){
    if (!Number.isFinite(s.cur) || s.cur > MAXV) s.cur = Number.isNaN(s.cur) ? 0 : Math.min(MAXV, Math.max(0, s.cur));
    if (!Number.isFinite(s.life) || s.life > MAXV) s.life = Number.isNaN(s.life) ? 0 : Math.min(MAXV, Math.max(0, s.life));
  }

  // ---------- Emissor simples ----------
  const listeners = {};
  function on(ev, fn){ (listeners[ev] = listeners[ev] || []).push(fn); return () => off(ev, fn); }
  function off(ev, fn){ const l = listeners[ev]; if (!l) return; const i = l.indexOf(fn); if (i >= 0) l.splice(i, 1); }
  function emit(ev, payload){
    const l = listeners[ev]; if (!l) return;
    for (let i = 0; i < l.length; i++){ try { l[i](payload, game); } catch (e) { /* ouvinte nunca derruba o motor */ } }
  }

  // ---------- Consultas ----------
  const gen = id => D().gens.find(g => g.id === id) || null;
  const upgrade = id => D().upgrades.find(u => u.id === id) || null;
  const has = id => { const s = S(); return !!s && s.ups.indexOf(id) >= 0; };
  function genCount(id){ const s = S(); return s ? (s.gens[id] || 0) : 0; }
  // multiplicador do gerador (upgrades kind 'mult' possuídos)
  function genMult(id){
    let m = 1;
    for (const u of D().upgrades) if (u.kind === 'mult' && u.gen === id && has(u.id)) m *= u.value;
    return m;
  }
  function clickMult(){ let m = 1; for (const u of D().upgrades) if (u.kind === 'click' && has(u.id)) m *= u.value; return m; }
  function autoClicks(){ let a = 0; for (const u of D().upgrades) if (u.kind === 'auto' && has(u.id)) a += u.value; return a; }
  function globalMult(){ const s = S(); return s ? s.prest.mult : 1; }
  // ondas/s vindas dos geradores
  function rate(){
    const s = S(); if (!s) return 0;
    let r = 0;
    for (const g of D().gens){ const n = s.gens[g.id] || 0; if (n) r += n * g.rate * genMult(g.id); }
    return r * globalMult();
  }
  // taxa por unidade de um gerador (com os mults do gerador; sem prestígio)
  function genRate(id){ const g = gen(id); return g ? g.rate * genMult(id) : 0; }
  function clickPower(){ return (D().clickBase || 1) * clickMult() * globalMult(); }
  // taxa total exibível (geradores + auto-clique)
  function totalRate(){ return rate() + autoClicks() * clickPower(); }
  // teto offline em segundos (8 h base; upgrades kind 'offline' em horas)
  function offlineCap(){
    let h = 8;
    for (const u of D().upgrades) if (u.kind === 'offline' && has(u.id)) h = Math.max(h, u.value);
    return h * 3600;
  }
  function genCost(id, n){
    const g = gen(id); if (!g) return Infinity;
    return U.cost(g.base, g.growth, genCount(id), n === undefined ? 1 : n);
  }
  function maxBuy(id){ const g = gen(id), s = S(); return g && s ? U.maxAffordable(g.base, g.growth, genCount(id), s.cur) : 0; }
  function canBuy(id, n){
    const s = S(); if (!s || !gen(id)) return false;
    if (n === 'max') return maxBuy(id) >= 1;
    n = Math.floor(n || 1); return n >= 1 && genCost(id, n) <= s.cur;
  }
  // upgrade comprável: tem custo, não possuído, e (se tiver 'at') gerador já no marco
  function upgradeAvailable(id){
    const u = upgrade(id); if (!u || u.cost == null || has(id)) return false;
    if (u.gen && u.at != null && genCount(u.gen) < u.at) return false;
    return true;
  }
  function canBuyUpgrade(id){ const s = S(), u = upgrade(id); return !!s && upgradeAvailable(id) && u.cost <= s.cur; }

  // ---------- Ações ----------
  function buy(id, n){
    const s = S(), g = gen(id); if (!s || !g) return false;
    if (n === 'max') n = maxBuy(id); else n = Math.floor(n || 1);
    if (n < 1) return false;
    const c = genCost(id, n); if (c > s.cur) return false;
    const before = s.gens[id] || 0;
    s.cur -= c; s.gens[id] = before + n; s.stats.purchases += n;
    const idx = D().gens.indexOf(g), degree = idx % 5;
    if (before === 0){
      // 1º do gerador: acorda a cena (o núcleo toca 'unlock' na cascata; se já estava acordado, tocamos aqui)
      const queued = g.unlock ? game.forceUnlock(g.unlock) : false;
      if (!queued) game.audio.play('unlock', { degree, gain: 1 });
    } else game.audio.play('pulse', { degree, x: 0.5, y: 0.3, gain: 0.8 });
    applyMilestones();
    emit('buy', { id, n, count: s.gens[id], cost: c });
    checkGoals();
    return true;
  }
  function buyUpgrade(id){
    const s = S(), u = upgrade(id); if (!s || !u || !canBuyUpgrade(id)) return false;
    s.cur -= u.cost; s.ups.push(id); s.stats.purchases++;
    game.audio.play('pulse', { degree: (s.ups.length) % 5, x: 0.5, y: 0.3, gain: 0.8 });
    emit('upgrade', { id, kind: u.kind, auto: false });
    return true;
  }
  // marcos automáticos: kind 'mult' com 'at' e sem custo → aplicado ao atingir a contagem
  function applyMilestones(){
    const s = S(); if (!s) return;
    for (const u of D().upgrades){
      if (u.kind !== 'mult' || u.cost != null || u.at == null || has(u.id)) continue;
      if (genCount(u.gen) >= u.at){
        s.ups.push(u.id);
        // marco automático: sino curto para o salto de taxa não passar em silêncio
        const gi = D().gens.findIndex(g => g.id === u.gen);
        if (game && game.audio) game.audio.play('unlock', { degree: (gi < 0 ? 0 : gi) % 5, gain: 0.8 });
        emit('upgrade', { id: u.id, kind: 'mult', auto: true, gen: u.gen, value: u.value });
      }
    }
  }

  // ---------- Prestígio ----------
  // pts disponíveis = floor(sqrt(life/K)) - pts já resgatados (life é acumulado, persiste entre runs)
  function prestigePoints(){
    const s = S(); if (!s) return 0;
    const K = (D().prestige && D().prestige.K) || 1.5e9;
    return Math.max(0, Math.min(Number.MAX_SAFE_INTEGER, Math.floor(Math.sqrt(s.life / K)) - s.prest.pts));
  }
  // Parte de estado do prestígio (a cena/tinta ficam em idle/prestige.js). Mantém: prest, life, stats, goals.
  function claimPrestige(){
    const s = S(); if (!s) return false;
    const pts = prestigePoints(); if (pts < 1) return false;
    s.prest.pts += pts; s.prest.runs++; s.prest.mult = 1 + 0.1 * s.prest.pts;
    s.cur = 0; s.gens = {};
    s.ups = s.ups.filter(id => { const u = upgrade(id); return u && u.kind === 'offline'; }); // teto offline é permanente
    emit('prestige', { pts, total: s.prest.pts, runs: s.prest.runs, mult: s.prest.mult });
    checkGoals();
    return true;
  }

  // Grava o save do idle agora (o núcleo salva a cada 10 s; útil após prestígio)
  function save(){
    if (!game || game.mode !== 'idle' || !game.state) return false;
    const s = game.state; s.lastSeen = Date.now();
    try {
      const json = JSON.stringify(s);
      if (LQ.Platform && LQ.Platform.saveCloud) LQ.Platform.saveCloud(json, 'lagoquieto.idle'); else localStorage.setItem('lagoquieto.idle', json);
      return true;
    } catch (e) { return false; }
  }

  // ---------- Metas ----------
  function goalMet(gl){
    const s = S(), c = gl.cond || {};
    switch (c.type){
      case 'clicks': return s.stats.clicks >= c.value;
      case 'gens': return genCount(c.id) >= c.value;
      case 'life': return s.life >= c.value;
      case 'rate': return rate() >= c.value;
      case 'prestige': return s.prest.runs >= c.value;
      default: return false;
    }
  }
  function checkGoals(){
    const s = S(); if (!s) return;
    for (const gl of D().goals){
      if (s.goals.indexOf(gl.id) >= 0 || !goalMet(gl)) continue;
      s.goals.push(gl.id);
      game.achievement('idle_' + gl.id); // ids mapeados em platform.js STEAM_IDS
      emit('goal', { id: gl.id, icon: gl.icon });
    }
  }

  // ---------- Entidade ----------
  let goalTimer = 0, ringAcc = 0, shopOpen = false;
  const prestigeBusy = () => !!(LQ.IdlePrestige && LQ.IdlePrestige.busy);
  LQ.register('idle-engine', {
    init(g){ game = g; if (g.mode !== 'idle') return; const s = S(); if (s) s.lastTick = Date.now(); applyMilestones(); },
    update(dt, g){
      if (g.mode !== 'idle') return; const s = S(); if (!s) return;
      const r = rate(), auto = autoClicks();
      const tr = r + auto * clickPower();
      // Relógio de parede: o núcleo limita dt a 0.05 s; com rAF estrangulado (janela coberta, wallpaper
      // a 15 fps) o tempo real passa mais rápido que a soma dos dt → creditamos a diferença.
      // Gaps longos (> 2 s) valem 50% como offline; teto = offlineCap.
      const now = Date.now();
      const real = s.lastTick > 0 ? (now - s.lastTick) / 1000 : dt;
      s.lastTick = now;
      let extra = real - dt;
      if (extra > 0.1 && tr > 0){
        extra = Math.min(extra, offlineCap());
        const bonus = extra * tr * (extra > 2 ? 0.5 : 1);
        s.cur += bonus; s.life += bonus;
      }
      const gain = tr * dt;
      s.cur += gain; s.life += gain;
      clampState(s);
      if (tr > s.stats.bestRate) s.stats.bestRate = tr;
      goalTimer += dt;
      if (goalTimer >= 1){ goalTimer = 0; checkGoals(); }
      // anéis visuais da automação: spawnRipple não passa por impact() → não gera moeda nem conta ripple
      if (tr > 0 && !document.hidden){
        const f = U.clamp(0.5 + Math.log10(tr + 1) / 2, 0.3, 3); // spawns/s
        ringAcc += f * dt;
        let n = 0;
        while (ringAcc >= 1 && n < 3){
          ringAcc -= 1; n++;
          // com a loja aberta os anéis nascem só na área visível do lago
          // largura real do painel (a ≤600 px ele ocupa 100%) → anéis nunca nascem debaixo dele
          let sw = 0; if (shopOpen){ const el = document.getElementById('shop'); sw = el ? el.offsetWidth : 260; }
          const x = 20 + g.rand() * Math.max(40, g.W - 40 - sw);
          const y = g.horizonY + 20 + g.rand() * Math.max(10, g.H - g.horizonY - 60);
          g.spawnRipple(x, y, { strength: U.clamp(0.3 + Math.log10(Math.max(1, tr)) / 8, 0.3, 0.9) });
        }
        if (ringAcc > 3) ringAcc = 0;
      } else ringAcc = 0;
    },
    // moeda SÓ aqui (pedra/lírio/sapo → impact); anéis automáticos nunca chegam neste hook
    onImpact(p, g){
      if (g.mode !== 'idle' || prestigeBusy()) return; const s = S(); if (!s) return; // durante os sinos do prestígio nada soma
      const amt = clickPower() * (p && p.strength ? p.strength : 1);
      s.cur += amt; s.life += amt; s.stats.clicks++; clampState(s);
      emit('currency', { x: p ? p.x : g.W / 2, y: p ? p.y : g.horizonY + 40, amount: amt, source: p && p.source });
    },
    onOffline(sec, g){
      if (g.mode !== 'idle') return; const s = S(); if (!s) return;
      sec = Math.max(0, Number(sec) || 0);
      const eff = Math.min(sec, offlineCap());
      const earned = totalRate() * eff * 0.5;
      if (earned > 0){ s.cur += earned; s.life += earned; s.stats.offlineEarned += earned; clampState(s); }
      s.lastTick = Date.now(); // evita creditar a mesma ausência de novo no próximo update
      if (sec >= 30) emit('offline', { sec, earned, capped: sec > eff });
    },
    // loja aberta/fechada (hud emite via game.emit('shopToggle')); usado só para posicionar anéis
    onShopToggle(_, g){ if (g.mode !== 'idle') return; shopOpen = !shopOpen; }
  });

  return {
    rate, totalRate, autoClicks, clickPower, offlineCap, globalMult,
    gen, upgrade, genCount, genMult, genRate, genCost, maxBuy, canBuy, buy, save,
    upgradeAvailable, canBuyUpgrade, buyUpgrade, has,
    prestigePoints, claimPrestige, checkGoals,
    on, off, emit,
    get state(){ return S(); }
  };
})();
</script>
<script>
// Lago Quieto — modo Idle: HUD (moeda + taxa), loja lateral, toast offline e floaters "+N".
// Só age em game.mode==='idle'. Usa LQ.Idle/LQ.IdleUtil quando existem; senão calcula a partir de LQ.IdleData.
window.LQ = window.LQ || {};
(function(){
  'use strict';
  const LQ = window.LQ;
  const D = () => LQ.IdleData || { gens: [], upgrades: [], clickBase: 1 };
  const U = () => LQ.IdleUtil || {};
  const I = () => LQ.Idle || {};

  // ---------- utilidades locais (fallbacks) ----------
  function fmt(n){
    if (U().fmt) return U().fmt(n);
    n = +n || 0; if (n < 1000) return String(Math.floor(n));
    const s = ['', 'K', 'M', 'B', 'T']; let i = 0;
    while (n >= 1000 && i < s.length - 1){ n /= 1000; i++; }
    return n >= 1e3 ? n.toExponential(1) : (n < 10 ? n.toFixed(1) : Math.floor(n)) + s[i];
  }
  function fmtRate(n){ n = +n || 0; return n < 10 && n > 0 ? n.toFixed(1) : fmt(n); }
  // Custo de comprar `qty` unidades tendo `count`
  function cost(g, count, qty){
    if (U().cost) return U().cost(g, count, qty);
    qty = qty || 1; const r = g.growth;
    return Math.ceil(g.base * Math.pow(r, count) * (Math.pow(r, qty) - 1) / (r - 1));
  }
  function maxAffordable(g, count, cur){
    if (U().maxAffordable) return U().maxAffordable(g, count, cur);
    const r = g.growth, c0 = g.base * Math.pow(r, count);
    if (cur < c0) return 0;
    return Math.max(0, Math.floor(Math.log(cur * (r - 1) / c0 + 1) / Math.log(r)));
  }
  function st(game){ return game && game.state && game.state.idle; }
  function rate(game){
    if (I().rate) return I().rate();
    const s = st(game); if (!s) return 0;
    let r = 0; for (const g of D().gens) r += (s.gens[g.id] || 0) * genRate(g, game);
    return r * ((s.prest && s.prest.mult) || 1);
  }
  // Taxa por unidade (com upgrades mult daquele gerador)
  function genRate(g, game){
    if (I().genRate) return I().genRate(g.id);
    const s = st(game); let m = 1;
    if (s) for (const u of D().upgrades) if (u.gen === g.id && u.kind === 'mult' && s.ups.indexOf(u.id) >= 0) m *= u.value;
    return g.rate * m;
  }
  function prestigePoints(game){
    if (I().prestigePoints) return I().prestigePoints();
    const s = st(game); if (!s) return 0;
    const K = (D().prestige && D().prestige.K) || 1.5e9;
    return Math.max(0, Math.floor(Math.sqrt((s.life || 0) / K)) - ((s.prest && s.prest.pts) || 0));
  }
  function buyGen(g, qty, game){
    if (I().buy) return I().buy(g.id, qty);
    const s = st(game); if (!s) return 0;
    const n = s.gens[g.id] || 0, c = cost(g, n, qty);
    if (s.cur < c) return 0;
    s.cur -= c; s.gens[g.id] = n + qty;
    if (g.unlock && game.forceUnlock) game.forceUnlock(g.unlock);
    return qty;
  }
  function buyUp(u, game){
    if (I().buyUpgrade) return I().buyUpgrade(u.id);
    const s = st(game); if (!s || s.cur < u.cost || s.ups.indexOf(u.id) >= 0) return false;
    s.cur -= u.cost; s.ups.push(u.id); return true;
  }
  const idleEmit = (n, p) => { if (I().emit) I().emit(n, p); };
  // texto do floater: frações (lírio/sapo valem 0.5) mostram 1 decimal em vez de "+0"
  const fmtGain = a => a < 1 ? a.toFixed(1) : fmt(a);
  const setText = (e, t) => { if (e.textContent !== t) e.textContent = t; }; // evita invalidar estilo sem mudança
  const HINT_KEY = 'lagoquieto.idle.shopSeen';
  const HINT_HOLD = 10;     // s que a dica segura a barra visível (por sessão)
  const FLOAT_LIFE = 1.4;   // s de vida do floater "+N"
  let shopSeen = false; try { shopSeen = localStorage.getItem(HINT_KEY) === '1'; } catch (e) {}

  // ---------- SVG helpers ----------
  const SVG_NS = 'http://www.w3.org/2000/svg';
  function icon(id){
    const s = document.createElementNS(SVG_NS, 'svg'); s.setAttribute('viewBox', '0 0 24 24');
    const u = document.createElementNS(SVG_NS, 'use'); u.setAttribute('href', '#' + id); s.appendChild(u); return s;
  }
  function pathIcon(d){
    const s = document.createElementNS(SVG_NS, 'svg'); s.setAttribute('viewBox', '0 0 24 24');
    d.split('|').forEach(p => { const e = document.createElementNS(SVG_NS, 'path'); e.setAttribute('d', p); s.appendChild(e); });
    return s;
  }
  const RING = 'M4 13a8 3.2 0 1 0 16 0a8 3.2 0 1 0 -16 0|M8 13a4 1.6 0 1 0 8 0a4 1.6 0 1 0 -8 0';
  const NEWMOON = 'M12 3.5a8.5 8.5 0 1 0 0 17a8.5 8.5 0 1 0 0-17|M12 3.5a8.5 8.5 0 0 0 0 17c-2.5-2.5-3.5-5.5-3.5-8.5s1-6 3.5-8.5';
  const UPICON = { click: 'M13 2.5L5 13.5h6l-1 8 9-11.5h-6l1-7.5z', auto: 'M12 4a8 8 0 1 1-6 2.7|M6 3v4h4', offline: 'M12 6v6l4 2|M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18' };
  function el(tag, cls, txt){ const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

  // ---------- entidade ----------
  const H = {
    hud: null, shop: null, list: null, ups: null, prest: null, toast: null,
    qty: 1, open: false, throttle: 0, toastT: 0, dirty: true, hintT: 0, hintOn: false,
    rows: {}, upRows: {},
    floats: [], // pool de floaters
    game: null,

    init(game){
      this.game = game;
      if (game.mode !== 'idle') return;
      this.floats = []; for (let i = 0; i < 24; i++) this.floats.push({ age: 1, x: 0, y: 0, txt: '' });
      this.buildHud(); this.buildShop();
      // assinatura opcional no barramento do motor
      if (I().on){
        I().on('currency', p => this.onCurrency(p, game));
        I().on('offline', p => this.onIdleOffline(p, game));
        I().on('buy', p => this.flash(p && this.rows[p.id]));
        I().on('upgrade', p => {
          if (!p) return;
          if (p.auto){ // marco automático (×2): acende a linha do gerador e solta um floater "×2" sobre ela
            const row = this.rows[p.gen]; this.flash(row);
            if (row && this.open && !row.r.hidden){
              const b = row.r.getBoundingClientRect();
              this.spawnFloat('×' + (p.value || 2), b.left + b.width / 2, b.top + b.height / 2 + 18);
            }
          } else this.flash(this.upRows[p.id]);
        });
      }
      this.render(game, true);
    },

    buildHud(){
      let h = document.getElementById('hud');
      if (!h){ h = el('div'); h.id = 'hud'; document.body.appendChild(h); }
      h.textContent = '';
      h.appendChild(pathIcon(RING));
      this.curEl = el('span', 'cur', '0'); this.rateEl = el('span', 'rate', '0/s');
      h.appendChild(this.curEl); h.appendChild(this.rateEl);
      this.toast = el('div', 'toast'); this.toast.appendChild(pathIcon(RING)); this.toastTxt = el('span'); this.toast.appendChild(this.toastTxt);
      h.appendChild(this.toast);
      h.addEventListener('pointerdown', e => e.stopPropagation());
      this.hud = h;
    },

    buildShop(){
      let s = document.getElementById('shop');
      if (!s){ s = document.createElement('aside'); s.id = 'shop'; document.body.appendChild(s); }
      s.textContent = '';
      s.addEventListener('pointerdown', e => e.stopPropagation());
      s.addEventListener('pointerenter', () => { if (this.game.ui) this.game.ui.wake(); });
      // seletor x1 / x10 / max (3 pontos)
      const q = el('div', 'qty');
      [[1, '1'], [10, '10'], ['max', 'max']].forEach(([v, t]) => {
        const b = el('button', 'dot', t); b.dataset.q = v; b.title = 'x' + t;
        b.addEventListener('click', () => { this.qty = v; this.dirty = true; this.render(this.game, true); });
        q.appendChild(b);
      });
      s.appendChild(q); this.qtyEl = q;
      this.list = el('div', 'gens'); s.appendChild(this.list);
      this.ups = el('div', 'ups'); s.appendChild(this.ups);
      this.prest = el('button', 'prest'); this.prest.appendChild(pathIcon(NEWMOON)); this.prestTxt = el('span', null, '+0');
      this.prest.appendChild(this.prestTxt); this.prest.hidden = true;
      this.prest.addEventListener('click', () => { idleEmit('prestigeRequest', { pts: prestigePoints(this.game) }); });
      s.appendChild(this.prest);
      // linhas por gerador (todas criadas, ocultas até serem "compráveis alguma vez")
      for (const g of D().gens){
        const r = el('div', 'gen'); r.hidden = true;
        r.appendChild(icon(g.icon));
        const mid = el('div', 'mid');
        const top = el('div', 'top'); const cnt = el('span', 'n', '0');
        const cw = el('span', 'c'); const q = el('span', 'q', ''); cw.appendChild(q); cw.appendChild(pathIcon(RING)); const c = el('span', null, '0'); cw.appendChild(c); // anel = custo; q = "×10"/"×N" quando qty≠1
        top.appendChild(cnt); top.appendChild(cw);
        const bar = el('div', 'bar'); const fill = el('i'); bar.appendChild(fill);
        const per = el('span', 'per', '');
        mid.appendChild(top); mid.appendChild(bar); mid.appendChild(per); r.appendChild(mid);
        r.addEventListener('click', () => this.clickGen(g));
        this.list.appendChild(r);
        this.rows[g.id] = { r, cnt, c, fill, per, q };
      }
      for (const u of D().upgrades){
        if (u.kind === 'mult' || u.cost == null) continue; // mult automáticos: sem custo, o motor aplica
        const b = el('button', 'up'); b.hidden = true;
        b.appendChild(pathIcon(UPICON[u.kind] || UPICON.click));
        // efeito sem texto: ×2 (clique), +1/s (auto), 12h (offline)
        const fx = u.kind === 'click' ? '×' + u.value : u.kind === 'auto' ? '+' + u.value + '/s' : u.value + 'h';
        b.appendChild(el('span', 'fx', fx));
        const c = el('span', 'c', fmt(u.cost)); b.appendChild(c);
        b.addEventListener('click', () => { if (buyUp(u, this.game)) { this.dirty = true; this.render(this.game, true); } });
        this.ups.appendChild(b); this.upRows[u.id] = { b };
      }
      this.shop = s;
    },

    clickGen(g){
      const s = st(this.game); if (!s) return;
      const n = s.gens[g.id] || 0;
      let q = this.qty === 'max' ? maxAffordable(g, n, s.cur) : this.qty;
      if (q < 1) return;
      if (buyGen(g, q, this.game)) { this.dirty = true; this.render(this.game, true); }
    },

    // realce breve de uma linha/botão após compra ou marco
    flash(row){
      const e = row && (row.r || row.b); if (!e) return;
      e.classList.add('hit');
      clearTimeout(e._hitT); e._hitT = setTimeout(() => e.classList.remove('hit'), 400);
    },
    spawnFloat(txt, x, y){
      let best = null;
      for (const o of this.floats){ if (o.age >= 1){ best = o; break; } if (!best || o.age > best.age) best = o; } // livre, senão o mais velho
      if (!best) return;
      best.age = 0; best.txt = txt; best.x = x; best.y = y; this.dirty = true;
    },
    // dica de descoberta: enquanto a loja nunca foi aberta e há algo comprável, segura a barra e pulsa o ícone
    // (segura a barra só por HINT_HOLD s por sessão — depois o lago volta a ficar limpo; o ícone segue pulsando ao acordar)
    hint(on){
      const b = document.getElementById('btn-shop'); if (!b) return;
      this.hintOn = on;
      if (on && this.hintT < HINT_HOLD){ if (this.game.ui) this.game.ui.wake(); }
      if (b.classList.contains('hint') !== on) b.classList.toggle('hint', on);
    },

    // Hooks do núcleo
    onShopToggle(_, game){
      if (game.mode !== 'idle' || !this.shop) return;
      this.open = !this.open;
      if (!shopSeen){ shopSeen = true; this.hint(false); try { localStorage.setItem(HINT_KEY, '1'); } catch (e) {} }
      this.shop.classList.toggle('open', this.open);
      if (game.ui){ game.ui.pinned = this.open; game.ui.wake(); }
      if (this.open) this.render(game, true);
    },
    // Moeda ganha: floater "+N" (payload {x,y,amount}); também aceito via game.emit('currency')
    onCurrency(p, game){
      if (!game || game.mode !== 'idle' || !p) return;
      const a = p.amount != null ? p.amount : p.value; if (!(a > 0)) return;
      this.spawnFloat('+' + fmtGain(a), p.x != null ? p.x : 60, p.y != null ? p.y : 40);
    },
    // Ganho offline calculado pelo motor: {earned, seconds}
    onIdleOffline(p, game){
      if (!game || game.mode !== 'idle' || !p || !(p.earned > 0) || !this.toast) return;
      this.toastTxt.textContent = '+' + fmt(p.earned);
      this.toast.classList.add('show'); this.toastT = 5;
      if (game.ui) game.ui.wake();
    },

    update(dt, game){
      if (game.mode !== 'idle' || !this.hud) return;
      for (const f of this.floats) if (f.age < 1) f.age += dt / FLOAT_LIFE;
      if (this.hintOn) this.hintT += dt;
      if (this.toastT > 0){ this.toastT -= dt; if (this.toastT <= 0) this.toast.classList.remove('show'); }
      this.throttle += dt;
      if (this.throttle >= 0.1){ this.throttle = 0; this.render(game, false); }
    },

    // Atualiza DOM (≤10×/s). `full` força reavaliação de visibilidade/qty.
    render(game, full){
      const s = st(game); if (!s || !this.hud) return;
      const cur = s.cur || 0;
      const r = I().totalRate ? I().totalRate() : rate(game); // inclui auto-cliques (o motor ganha com totalRate)
      setText(this.curEl, fmt(cur));
      setText(this.rateEl, fmtRate(r) + '/s');
      // dica da loja: só até a 1ª abertura, quando algo já é comprável
      if (!shopSeen && !this.open){
        let can = false;
        for (const g of D().gens){ if (cur >= cost(g, s.gens[g.id] || 0, 1)){ can = true; break; } }
        this.hint(can);
      }
      if (!this.open && !full) return;
      for (const b of this.qtyEl.children) b.classList.toggle('on', String(this.qty) === b.dataset.q);
      for (const g of D().gens){
        const row = this.rows[g.id]; const n = s.gens[g.id] || 0;
        const vis = n > 0 || cur >= 0.5 * cost(g, n, 1);
        if (row.r.hidden !== !vis) row.r.hidden = !vis;
        if (!vis) continue;
        let q = this.qty === 'max' ? Math.max(1, maxAffordable(g, n, cur)) : this.qty;
        const c = cost(g, n, q);
        setText(row.cnt, String(n)); setText(row.c, fmt(c)); setText(row.q, q > 1 ? '×' + q : '');
        const w = Math.min(100, cur / c * 100);
        if (Math.abs(w - (row.w || 0)) >= 0.5 || w === 100 && row.w !== 100){ row.w = w; row.fill.style.width = w.toFixed(1) + '%'; }
        row.r.classList.toggle('can', cur >= c);
        setText(row.per, fmtRate(genRate(g, game)) + '/s');
      }
      for (const u of D().upgrades){
        const ur = this.upRows[u.id]; if (!ur) continue;
        const owned = s.ups.indexOf(u.id) >= 0;
        const vis = !owned && cur >= 0.5 * u.cost;
        if (ur.b.hidden !== !vis) ur.b.hidden = !vis;
        if (vis) ur.b.classList.toggle('can', cur >= u.cost);
      }
      const pts = prestigePoints(game);
      if (this.prest.hidden !== (pts < 1)) this.prest.hidden = pts < 1;
      if (pts >= 1) setText(this.prestTxt, '+' + fmt(pts));
    },

    // Floaters na camada 'hud' — único fillText do jogo
    draw(layer, ctx, game){
      if (layer !== 'hud' || game.mode !== 'idle') return;
      let any = false; for (const f of this.floats) if (f.age < 1){ any = true; break; }
      if (!any) return;
      ctx.save();
      // tema claro (ink: lightBlend 'multiply'): texto escuro com halo claro; senão claro com halo escuro
      const lightTheme = game.lightBlend === 'multiply';
      ctx.font = '13px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillStyle = lightTheme ? (game.palette.dark || '#1a1a1a') : game.palette.light;
      ctx.shadowColor = lightTheme ? 'rgba(255,255,255,.9)' : 'rgba(5,9,20,.85)'; ctx.shadowBlur = 3; // contorno suave: legível sobre anéis
      for (const f of this.floats){
        if (f.age >= 1) continue;
        ctx.globalAlpha = 0.9 * (1 - f.age);
        ctx.fillText(f.txt, f.x, f.y - 18 - f.age * 22);
      }
      ctx.restore();
    },
  };
  LQ.register('idle-hud', H);
})();
</script>
<script>
// Lago Quieto — modo Idle: prestígio ("nova noite"). Só age em game.mode === 'idle'.
// Fluxo: LQ.Idle 'prestigeRequest' → pts = prestigePoints() ≥ 1 → cascata de 5 sinos (2,5 s)
// → reset do estado (plano §4) → save → LQ.resetScene() (recarrega a página em modo idle).
// Reskin por run: PRESTIGE_TINTS[runs % 5] via LQ.themes.tint (ou setPaletteOverride direto);
// a partir de runs ≥ 5 o tema também rotaciona por LQ.themeList.
window.LQ = window.LQ || {};
(function(){
  'use strict';
  const LQ = window.LQ;

  // Tintas sutis (mistura ~12% sobre zenith/horizon/shore/ring do tema atual). Índice = runs % 5.
  const PRESTIGE_TINTS = [
    null,                                // 0: nenhuma
    { color: '#8a6bc9', amount: 0.14 },  // 1: violeta
    { color: '#e8b04a', amount: 0.10 },  // 2: âmbar
    { color: '#7ad3c9', amount: 0.14 },  // 3: verde-água
    { color: '#f2a0b8', amount: 0.10 }   // 4: rosa
  ];
  // Upgrades permanentes: os de 'offline' (teto de horas) sobrevivem ao prestígio; os demais não.
  const PERMANENT_KINDS = ['offline'];
  const BELLS = 5, BELL_GAP = 0.5; // 5 sinos em 2,5 s

  let game = null, bellTimer = 0, bellsLeft = 0, degree = 0, resetAt = 0, busy = false, bound = false;

  function idleState(){ return game && game.state ? game.state.idle : null; }
  function data(){ return LQ.IdleData || {}; }

  // pts = floor(sqrt(life / K)) — usa LQ.Idle.prestigePoints se o engine expuser
  function points(){
    if (LQ.Idle && typeof LQ.Idle.prestigePoints === 'function') return Math.max(0, Math.floor(LQ.Idle.prestigePoints() || 0));
    const s = idleState(); if (!s) return 0;
    const K = (data().prestige && data().prestige.K) || 1.5e9;
    const got = (s.prest && Number(s.prest.pts)) || 0; // pts já resgatados não contam de novo
    return Math.max(0, Math.floor(Math.sqrt(Math.max(0, Number(s.life) || 0) / K)) - got);
  }

  // Aplica tinta/tema conforme o número de runs (chamado no init e após o reset)
  function applySkin(runs){
    const tint = PRESTIGE_TINTS[runs % PRESTIGE_TINTS.length];
    if (LQ.themes && typeof LQ.themes.tint === 'function') LQ.themes.tint(tint);
    else if (game && game.setPaletteOverride) game.setPaletteOverride(tint ? { zenith: tint.color } : null);
  }
  function rotateTheme(runs){
    const list = LQ.themeList || ['night'];
    if (runs < 5 || !game || !game.state) return;
    const th = list[(runs - 5 + 1) % list.length]; // +1: a run 5 já muda de tema (índice 0 seria 'night' = run 0)
    if (game.state.theme !== th){
      game.state.theme = th;
      if (game.audio && game.audio.setTheme) game.audio.setTheme(th);
    }
  }

  // Reset da cena: o núcleo não expõe call/pending; limpar unlocked e recarregar em modo idle é
  // a forma limpa (LQ.switchMode salva antes de recarregar). Entidades re-fazem init do zero.
  if (typeof LQ.resetScene !== 'function'){
    LQ.resetScene = function(){
      const g = LQ.game;
      if (g && g.state){ g.state.unlocked = []; if (g.state.dawnAt !== undefined) g.state.dawnAt = -1; }
      if (typeof LQ.switchMode === 'function') LQ.switchMode(g && g.mode === 'idle' ? 'idle' : 'zen');
      else location.reload();
    };
  }

  // Reset do estado idle (plano §4). Fonte de verdade: LQ.Idle.claimPrestige (pts/runs/mult, cur=0,
  // gens={}, só upgrades 'offline' ficam; goals/stats/life persistem; meta 'nova_noite' → idle_nova_noite).
  function doReset(pts){
    const s = idleState(); if (!s) return;
    if (LQ.Idle && typeof LQ.Idle.claimPrestige === 'function') LQ.Idle.claimPrestige();
    else {
      const ups = data().upgrades || [];
      s.cur = 0; s.gens = {};
      s.ups = (Array.isArray(s.ups) ? s.ups : []).filter(id => { const u = ups.find(x => x.id === id); return u && PERMANENT_KINDS.indexOf(u.kind) >= 0; });
      s.prest = s.prest && typeof s.prest === 'object' ? s.prest : { pts: 0, runs: 0, mult: 1 };
      s.prest.pts = (Number(s.prest.pts) || 0) + pts;
      s.prest.runs = (Number(s.prest.runs) || 0) + 1;
      s.prest.mult = 1 + 0.1 * s.prest.pts;
    }
    s.lastTick = Date.now();
    if (s.stats && typeof s.stats === 'object') s.stats.bestRate = 0;
    // A cena só é limpa após os sinos (LQ.resetScene), mas o save precisa já refletir gens={} sem moradores
    // acordados — senão fechar a aba durante os sinos deixaria unlocked cheio sem geradores.
    if (game.state){ game.state.unlocked = []; if (game.state.dawnAt !== undefined) game.state.dawnAt = -1; }
    rotateTheme(s.prest.runs);
    applySkin(s.prest.runs);
    if (LQ.Idle && typeof LQ.Idle.save === 'function') LQ.Idle.save();
  }

  function request(){
    if (!game || game.mode !== 'idle' || busy) return false;
    const pts = points();
    if (pts < 1) return false;
    busy = true;
    doReset(pts);            // estado já novo; a cena só troca após os sinos
    bellsLeft = BELLS; bellTimer = 0; degree = 0;
    resetAt = BELLS * BELL_GAP + 0.3;
    if (game.ui && game.ui.wake) game.ui.wake();
    return true;
  }

  function bind(){
    if (bound || !LQ.Idle || typeof LQ.Idle.on !== 'function') return;
    LQ.Idle.on('prestigeRequest', request);
    bound = true;
  }

  LQ.register('idle-prestige', {
    init(g){
      game = g;
      if (game.mode !== 'idle') return;
      const s = idleState();
      applySkin(s && s.prest ? (Number(s.prest.runs) || 0) : 0);
      bind();
    },
    // também aceita game.emit('prestigeRequest') (hud pode usar qualquer um dos dois caminhos)
    onPrestigeRequest(){ if (game && game.mode === 'idle') request(); },
    update(dt, g){
      if (!g || g.mode !== 'idle') return;
      if (!bound) bind(); // LQ.Idle pode ter sido registrado depois deste arquivo
      if (!busy) return;
      bellTimer -= dt;
      if (bellsLeft > 0 && bellTimer <= 0){
        g.audio.play('unlock', { degree: degree % 5, gain: 1 });
        degree++; bellsLeft--; bellTimer = BELL_GAP;
      }
      resetAt -= dt;
      if (resetAt <= 0){ busy = false; LQ.resetScene(); }
    }
  });

  LQ.IdlePrestige = { PRESTIGE_TINTS, PERMANENT_KINDS, points, request, applySkin, get busy(){ return busy; } };
})();
</script>
<script>LQ.boot();</script>
