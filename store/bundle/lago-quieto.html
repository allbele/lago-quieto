<title>Lago Quieto</title>


<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
/* Lago Quieto — reset e UI */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#050914;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body.nocursor,body.nocursor *{cursor:none!important}

#lake{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* Barra inferior */
#ui{position:fixed;left:0;right:0;bottom:18px;display:flex;justify-content:center;gap:14px;
  pointer-events:none;opacity:1;transition:opacity 1s ease}
body.uihidden #ui{opacity:0}
.ico{pointer-events:auto;width:40px;height:40px;border:0;background:transparent;padding:8px;cursor:pointer;
  opacity:.6;transition:opacity .3s ease}
.ico:hover,.ico:focus-visible{opacity:1;outline:none}
:root{--ico:#e9f2ff}
.ico svg{width:100%;height:100%;fill:none;stroke:var(--ico,#e9f2ff);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
body.uihidden .ico{pointer-events:none}

/* Estado do ícone de som */
#btn-sound .off{display:none}
body.muted #btn-sound .on{display:none}
body.muted #btn-sound .off{display:inline}
body.eco #btn-eco{opacity:1}

/* Coleção: faixa dos moradores acordados */
#collection{position:fixed;left:0;right:0;bottom:70px;display:flex;justify-content:center;gap:16px;
  pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .8s ease,transform .8s ease}
#collection.open{opacity:1;transform:none}
body.uihidden #collection{opacity:0}
#collection svg{width:26px;height:26px;fill:none;stroke:var(--ico,#e9f2ff);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
#collection svg.new{animation:born 4s ease forwards}
@keyframes born{from{opacity:0;transform:translateY(4px)}to{opacity:.7;transform:none}}

</style>


<canvas id="lake"></canvas>

<!-- Coleção: faixa com ícones dos moradores acordados (sem texto) -->
<div id="collection" aria-hidden="true"></div>

<!-- Barra inferior de ícones -->
<div id="ui">
  <button class="ico" id="btn-sound" data-act="sound">
    <svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5l4.5 3.5V6L7.5 9.5H4z"/><path class="on" d="M15.5 9a4 4 0 0 1 0 6"/><path class="on" d="M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  </button>
  <button class="ico" id="btn-full" data-act="full">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
  </button>
  <button class="ico" id="btn-theme" data-act="theme">
    <svg viewBox="0 0 24 24"><path d="M12 3.5s-5.5 6-5.5 10a5.5 5.5 0 0 0 11 0c0-4-5.5-10-5.5-10z"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5"/></svg>
  </button>
  <button class="ico" id="btn-coll" data-act="coll">
    <svg viewBox="0 0 24 24"><path d="M15 3.5a9 9 0 1 0 5.5 14.5A8 8 0 0 1 15 3.5z"/></svg>
  </button>
  <button class="ico" id="btn-eco" data-act="eco">
    <svg viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 14-14 0 9-4.5 14-12 14"/><path d="M5 19c3-4 6-7 10-9"/></svg>
  </button>
</div>

<!-- Ícones dos moradores (templates para a coleção) -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="ic-firefly" viewBox="0 0 24 24"><circle cx="12" cy="13" r="3.5"/><path d="M9.5 10.5L6 6M14.5 10.5L18 6"/></symbol>
  <symbol id="ic-fish" viewBox="0 0 24 24"><path d="M4 12c3-4 7-5.5 11-4.5 2 .5 3.5 2.5 5 4.5-1.5 2-3 4-5 4.5-4 1-8-.5-11-4.5z"/><path d="M4 12l-1.5-3.5M4 12l-1.5 3.5"/></symbol>
  <symbol id="ic-goldfish" viewBox="0 0 24 24"><path d="M4 12c3-4 7-5.5 11-4.5 2 .5 3.5 2.5 5 4.5-1.5 2-3 4-5 4.5-4 1-8-.5-11-4.5z"/><circle cx="16" cy="11" r=".8"/><path d="M11 8v8"/></symbol>
  <symbol id="ic-moon" viewBox="0 0 24 24"><path d="M15 3.5a9 9 0 1 0 5.5 14.5A8 8 0 0 1 15 3.5z"/></symbol>
  <symbol id="ic-mountain" viewBox="0 0 24 24"><path d="M2 19L9 7l4 6 2-3 7 9H2z"/></symbol>
  <symbol id="ic-lily" viewBox="0 0 24 24"><path d="M12 6a8 4 0 1 0 0 .01"/><path d="M12 6v4"/></symbol>
  <symbol id="ic-flower" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M12 4v4M12 16v4M4 12h4M16 12h4M6.5 6.5l3 3M14.5 14.5l3 3M17.5 6.5l-3 3M9.5 14.5l-3 3"/></symbol>
  <symbol id="ic-shooting" viewBox="0 0 24 24"><path d="M3 17L15 8"/><path d="M17 4l1 2.5 2.5 1-2.5 1L17 11l-1-2.5-2.5-1 2.5-1z"/></symbol>
  <symbol id="ic-frog" viewBox="0 0 24 24"><path d="M5 15c0-4 3-6 7-6s7 2 7 6-3 4-7 4-7 0-7-4z"/><circle cx="8.5" cy="9" r="2"/><circle cx="15.5" cy="9" r="2"/></symbol>
  <symbol id="ic-aurora" viewBox="0 0 24 24"><path d="M3 9c3-3 6 3 9 0s6-3 9 0M3 15c3-3 6 3 9 0s6-3 9 0"/></symbol>
  <symbol id="ic-bird" viewBox="0 0 24 24"><path d="M3 13c3-3 6-3 9 0 3-3 6-3 9 0"/><path d="M7 17c1.5-1.5 3.5-1.5 5 0 1.5-1.5 3.5-1.5 5 0"/></symbol>
</svg>

<script>
/* Lago Quieto — áudio (WebAudio, tudo sintetizado). Não conhece o jogo. */
(function () {
  'use strict';
  var LQ = window.LQ = window.LQ || {};

  var MAX_VOICES = 8;      // teto de vozes simultâneas
  var MIN_NOTE_GAP = 0.08; // 80 ms entre notas
  var PENTA = [0, 2, 4, 7, 9]; // C D E G A (semitons)
  var C4 = 261.6256;

  var ctx = null;
  var master, comp, dry, wet, conv, lowpass, themeShelf, themeHP, percBus;
  var muted = false, theme = 'night', fogOpen = false;
  var voices = [];
  var lastNote = -1;
  var amb = null; // nós do ambiente
  var ambState = { moon: false, aurora: false, fogOpen: false, crickets: true, wind: 0, rain: false };

  // ---------- utilitários ----------
  function now() { return ctx ? ctx.currentTime : 0; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function cents(f, c) { return f * Math.pow(2, c / 1200); }

  // nota pentatônica: degree 0..4 (+ oitavas por transbordo), oct 3|4
  function freqOf(degree, oct) {
    var d = Math.floor(degree);
    var o = Math.floor(d / 5), k = ((d % 5) + 5) % 5;
    return C4 * Math.pow(2, (oct - 4) + o + PENTA[k] / 12);
  }
  // x → grau, y → oitava (mais fundo = mais grave)
  function noteFor(x, y) {
    x = clamp(x == null ? 0.5 : x, 0, 0.999);
    y = clamp(y == null ? 0.5 : y, 0, 1);
    return freqOf(Math.floor(x * 5), y > 0.5 ? 3 : 4);
  }

  function panner(x) {
    var p;
    if (ctx.createStereoPanner) {
      p = ctx.createStereoPanner();
      p.pan.value = clamp(((x == null ? 0.5 : x) - 0.5) * 1.4, -1, 1);
    } else {
      p = ctx.createGain();
    }
    return p;
  }

  // ---------- pool de vozes ----------
  function reap() {
    var t = now();
    for (var i = voices.length - 1; i >= 0; i--) if (voices[i].end <= t) voices.splice(i, 1);
  }
  function steal() {
    var v = voices.shift(), t = now(); // mais antiga
    try {
      v.g.gain.cancelScheduledValues(t);
      v.g.gain.setValueAtTime(v.g.gain.value, t);
      v.g.gain.linearRampToValueAtTime(0, t + 0.03);
      for (var i = 0; i < v.srcs.length; i++) try { v.srcs[i].stop(t + 0.04); } catch (e) {}
    } catch (e) {}
  }
  // cria voz: gain → (pan) → destino. dur em segundos.
  function mkVoice(dur, dest, x) {
    reap();
    while (voices.length >= MAX_VOICES) steal();
    var g = ctx.createGain();
    g.gain.value = 0;
    var out = g;
    if (x != null) { var p = panner(x); g.connect(p); out = p; }
    out.connect(dest || master);
    var v = { g: g, t0: now(), end: now() + dur, srcs: [] };
    v.add = function (src, at) {
      src.start(at == null ? v.t0 : at);
      src.stop(v.end + 0.05);
      v.srcs.push(src);
      return src;
    };
    voices.push(v);
    return v;
  }
  function osc(type, f, t) {
    var o = ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f, t == null ? now() : t);
    return o;
  }

  // ---------- buffers ----------
  var noiseBuf = null, pinkBuf = null;
  function whiteNoise() {
    if (noiseBuf) return noiseBuf;
    var n = ctx.sampleRate, b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return (noiseBuf = b);
  }
  // branco por 3 lowpass em cascata (1-polo) → rosa aproximado
  function pinkNoise() {
    if (pinkBuf) return pinkBuf;
    var n = ctx.sampleRate * 4, b = ctx.createBuffer(2, n, ctx.sampleRate);
    for (var c = 0; c < 2; c++) {
      var d = b.getChannelData(c), y1 = 0, y2 = 0, y3 = 0, a = 0.12, peak = 0;
      for (var i = 0; i < n; i++) {
        var w = Math.random() * 2 - 1;
        y1 += a * (w - y1); y2 += a * (y1 - y2); y3 += a * (y2 - y3);
        d[i] = y3; if (Math.abs(y3) > peak) peak = Math.abs(y3);
      }
      var k = peak > 0 ? 0.9 / peak : 1;
      for (i = 0; i < n; i++) d[i] *= k;
      // suaviza a costura do loop
      var f = Math.min(2048, n >> 2);
      for (i = 0; i < f; i++) { var m = i / f; d[i] *= m; d[n - 1 - i] *= m; }
    }
    return (pinkBuf = b);
  }
  // IR sintética: ruído branco × exp(−t/0.6), 2.5 s
  function makeIR() {
    var sr = ctx.sampleRate, n = Math.floor(sr * 2.5), b = ctx.createBuffer(2, n, sr);
    for (var c = 0; c < 2; c++) {
      var d = b.getChannelData(c);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-(i / sr) / 0.6);
    }
    return b;
  }
  function weakCPU() {
    var hc = navigator.hardwareConcurrency || 4, dm = navigator.deviceMemory || 4;
    return hc <= 2 || dm <= 2;
  }

  // ---------- init ----------
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return true; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();

    master = ctx.createGain();
    master.gain.value = muted ? 0 : 1;
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 3;
    comp.attack.value = 0.01; comp.release.value = 0.25; comp.knee.value = 6;
    dry = ctx.createGain(); dry.gain.value = 0.6;
    wet = ctx.createGain(); wet.gain.value = 0.4;
    lowpass = ctx.createBiquadFilter();
    lowpass.type = 'lowpass'; lowpass.frequency.value = fogOpen ? 6000 : 4000; lowpass.Q.value = 0.5;
    themeShelf = ctx.createBiquadFilter(); themeShelf.type = 'highshelf'; themeShelf.frequency.value = 2500; themeShelf.gain.value = 0;
    themeHP = ctx.createBiquadFilter(); themeHP.type = 'highpass'; themeHP.frequency.value = 20; themeHP.Q.value = 0.5;

    master.connect(comp);
    comp.connect(dry);
    if (weakCPU()) {
      // fallback: eco curto em vez de convolução
      var dl = ctx.createDelay(1), fb = ctx.createGain(), dlp = ctx.createBiquadFilter();
      dl.delayTime.value = 0.18; fb.gain.value = 0.35; dlp.type = 'lowpass'; dlp.frequency.value = 3000;
      comp.connect(dl); dl.connect(dlp); dlp.connect(fb); fb.connect(dl); dlp.connect(wet);
    } else {
      conv = ctx.createConvolver(); conv.buffer = makeIR();
      comp.connect(conv); conv.connect(wet);
    }
    dry.connect(lowpass); wet.connect(lowpass);
    lowpass.connect(themeShelf); themeShelf.connect(themeHP); themeHP.connect(ctx.destination);

    // barramento percussivo (plops) — permite abafar por tema
    percBus = ctx.createBiquadFilter(); percBus.type = 'lowpass'; percBus.frequency.value = 20000; percBus.Q.value = 0.3;
    percBus.connect(master);

    setTheme(theme);
    if (ambWanted) ambient.start();
    return true;
  }
  function ready() { return !!ctx && ctx.state !== 'closed'; }

  // ---------- sons ----------
  // plop genérico: seno f0→f1 + burst de ruído
  function plop(f0, f1, gain, x, at, noiseGain, noiseDur, noiseFreq) {
    at = at == null ? now() : at;
    var v = mkVoice((at - now()) + 0.3, percBus, x);
    var o = osc('sine', f0, at);
    o.frequency.exponentialRampToValueAtTime(f1, at + 0.12);
    o.connect(v.g);
    v.g.gain.setValueAtTime(0, at);
    v.g.gain.linearRampToValueAtTime(gain, at + 0.005);
    v.g.gain.exponentialRampToValueAtTime(0.0005, at + 0.185);
    v.g.gain.linearRampToValueAtTime(0, at + 0.19);
    v.add(o, at);
    if (noiseGain > 0) {
      var s = ctx.createBufferSource(); s.buffer = whiteNoise(); s.loop = true;
      var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = noiseFreq || 1200; bp.Q.value = 2;
      var ng = ctx.createGain(); ng.gain.setValueAtTime(0, at);
      ng.gain.linearRampToValueAtTime(noiseGain, at + 0.004);
      ng.gain.linearRampToValueAtTime(0, at + (noiseDur || 0.04));
      s.connect(bp); bp.connect(ng); ng.connect(v.g);
      // ng já envelopa; v.g segue seu próprio envelope (multiplicativo, ok)
      v.add(s, at);
    }
    return v;
  }

  // sino: fundamental + parcial 2.76× (decay 3× mais rápido) + triângulo oitava acima
  function bell(f, gain, attack, release, x, at, dest) {
    at = at == null ? now() : at;
    var v = mkVoice((at - now()) + attack + release + 0.05, dest || master, x);
    var det = rnd(-4, 4);
    var g1 = ctx.createGain(), g2 = ctx.createGain(), g3 = ctx.createGain();
    var o1 = osc('sine', cents(f, det), at);
    var o2 = osc('sine', cents(f * 2.76, det), at);
    var o3 = osc('triangle', cents(f * 2, det), at);
    o1.connect(g1); o2.connect(g2); o3.connect(g3);
    g1.connect(v.g); g2.connect(v.g); g3.connect(v.g);
    g1.gain.value = 0.18; g3.gain.value = 0.05;
    // parcial inarmônico decai 3× mais rápido
    g2.gain.setValueAtTime(0.25 * 0.18, at);
    g2.gain.setTargetAtTime(0, at + attack, release / 3 / 4);
    v.g.gain.setValueAtTime(0, at);
    v.g.gain.linearRampToValueAtTime(gain, at + attack);
    v.g.gain.setTargetAtTime(0, at + attack, release / 4);
    v.g.gain.linearRampToValueAtTime(0, at + attack + release);
    v.add(o1, at); v.add(o2, at); v.add(o3, at);
    return v;
  }

  // seno curto (tilintar / glissando)
  function blip(f0, f1, dur, gain, x, at, type) {
    at = at == null ? now() : at;
    var v = mkVoice((at - now()) + dur + 0.05, master, x);
    var o = osc(type || 'sine', f0, at);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, at + dur);
    o.connect(v.g);
    v.g.gain.setValueAtTime(0, at);
    v.g.gain.linearRampToValueAtTime(gain, at + Math.min(0.01, dur * 0.2));
    v.g.gain.linearRampToValueAtTime(0, at + dur);
    v.add(o, at);
    return v;
  }

  var sounds = {
    // Plop da pedra: 220→90 Hz, ganho 0.5 + ruído 1.2 kHz
    plop: function (o) { plop(220, 90, 0.5 * o.gain, o.x, null, 0.15, 0.04, 1200); return true; },

    // Nota do anel (sino). Respeita 80 ms mínimo entre notas.
    note: function (o) {
      var t = now();
      if (lastNote >= 0 && t - lastNote < MIN_NOTE_GAP) return false;
      lastNote = t;
      var f = o.degree != null ? freqOf(o.degree, o.y != null && o.y > 0.5 ? 3 : 4) : noteFor(o.x, o.y);
      bell(f, 1.0 * o.gain, 0.03, 1.6, o.x);
      return true;
    },

    // Pulso de morador: mesma nota, oitava acima, ganho 0.1
    pulse: function (o) {
      var f = (o.degree != null ? freqOf(o.degree, o.y != null && o.y > 0.5 ? 3 : 4) : noteFor(o.x, o.y)) * 2;
      bell(f, 0.1 / 0.18 * o.gain, 0.03, 1.2, o.x);
      return true;
    },

    // Vagalume acordado: 1.8–2.6 kHz, 60 ms, 0.04
    firefly: function (o) { blip(rnd(1800, 2600), 0, 0.06, 0.04 * o.gain, o.x); return true; },

    // Peixe: 2 plops 440→180 a 90 ms + ruído 80 ms
    fishJump: function (o) {
      var t = now();
      plop(440, 180, 0.22 * o.gain, o.x, t, 0.08, 0.08, 1600);
      plop(440, 180, 0.18 * o.gain, o.x, t + 0.09, 0, 0, 0);
      return true;
    },
    // Dourado: + sino em A4
    fishJumpGold: function (o) {
      sounds.fishJump(o);
      bell(440, 0.6 * o.gain, 0.02, 1.8, o.x, now() + 0.1);
      return true;
    },

    // Gota de orvalho: 330→140 Hz, 0.2
    dew: function (o) { plop(330, 140, 0.2 * o.gain, o.x, null, 0.05, 0.03, 2000); return true; },

    // Sapo: quadrada 90 Hz, LFO 14 Hz, 300 ms, lowpass 400, 0.08
    frog: function (o) {
      var t = now(), v = mkVoice(0.35, master, o.x);
      var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400; lp.Q.value = 1;
      var am = ctx.createGain(); am.gain.value = 0.5;
      var sq = osc('square', 90, t);
      var lfo = osc('sine', 14, t), lg = ctx.createGain(); lg.gain.value = 0.5;
      lfo.connect(lg); lg.connect(am.gain);
      sq.connect(am); am.connect(lp); lp.connect(v.g);
      v.g.gain.setValueAtTime(0, t);
      v.g.gain.linearRampToValueAtTime(0.08 * o.gain, t + 0.03);
      v.g.gain.setValueAtTime(0.08 * o.gain, t + 0.24);
      v.g.gain.linearRampToValueAtTime(0, t + 0.3);
      v.add(sq, t); v.add(lfo, t);
      return true;
    },

    // Desbloqueio: acorde de 3 notas (grau, +2, +4), ataque 400 ms, release 3 s, 0.12
    unlock: function (o) {
      var d = o.degree == null ? 0 : Math.floor(o.degree);
      var t = now();
      var v = mkVoice(3.6, master, o.x);
      var det = rnd(-4, 4);
      for (var i = 0; i < 3; i++) {
        var f = freqOf(d + i * 2, 4);
        var g1 = ctx.createGain(), g2 = ctx.createGain(), g3 = ctx.createGain();
        g1.gain.value = 0.18; g3.gain.value = 0.05;
        g2.gain.setValueAtTime(0.045, t); g2.gain.setTargetAtTime(0, t + 0.4, 0.25);
        var o1 = osc('sine', cents(f, det), t), o2 = osc('sine', cents(f * 2.76, det), t), o3 = osc('triangle', cents(f * 2, det), t);
        o1.connect(g1); o2.connect(g2); o3.connect(g3);
        g1.connect(v.g); g2.connect(v.g); g3.connect(v.g);
        v.add(o1, t); v.add(o2, t); v.add(o3, t);
      }
      v.g.gain.setValueAtTime(0, t);
      v.g.gain.linearRampToValueAtTime(0.22 * o.gain, t + 0.4); // ~0.12 efetivo (3 notas × 0.18)
      v.g.gain.setTargetAtTime(0, t + 0.4, 0.75);
      v.g.gain.linearRampToValueAtTime(0, t + 3.4);
      return true;
    },

    // Estrela cadente: 2 kHz→600 Hz, 400 ms, 0.03
    shooting: function (o) { blip(2000, 600, 0.4, 0.03 * o.gain, o.x); return true; },

    // Flor: nota longa 2.4 s com detune
    bloom: function (o) {
      var f = (o.degree != null ? freqOf(o.degree, 4) : noteFor(o.x, 0)) ;
      var t = now(), v = mkVoice(2.6, master, o.x);
      var a = osc('sine', cents(f, -7), t), b = osc('sine', cents(f, 7), t), c = osc('triangle', cents(f * 2, 0), t);
      var gc = ctx.createGain(); gc.gain.value = 0.15;
      a.connect(v.g); b.connect(v.g); c.connect(gc); gc.connect(v.g);
      v.g.gain.setValueAtTime(0, t);
      v.g.gain.linearRampToValueAtTime(0.09 * o.gain, t + 0.5);
      v.g.gain.setValueAtTime(0.09 * o.gain, t + 1.2);
      v.g.gain.linearRampToValueAtTime(0, t + 2.4);
      v.add(a, t); v.add(b, t); v.add(c, t);
      return true;
    },

    // Pássaros: 3 sinos curtos agudos
    birds: function (o) {
      var t = now(), base = [9, 11, 14][Math.floor(Math.random() * 3)]; // graus altos
      for (var i = 0; i < 3; i++) {
        bell(freqOf(base + [0, 2, 1][i], 5), 0.25 * o.gain, 0.008, 0.35, clamp((o.x == null ? 0.5 : o.x) + rnd(-0.15, 0.15), 0, 1), t + i * 0.16);
      }
      return true;
    }
  };

  function play(name, opts) {
    if (!ready()) return false;
    if (ctx.state === 'suspended') ctx.resume();
    var fn = sounds[name];
    if (!fn) return false;
    var o = opts || {};
    o = { x: o.x, y: o.y, gain: o.gain == null ? 1 : o.gain, degree: o.degree };
    try { return fn(o); } catch (e) { return false; }
  }

  // ---------- ambiente ----------
  var ambWanted = false;
  var cricketTimer = null;

  function scheduleCricket() {
    if (!amb || !ambState.crickets) return;
    cricketTimer = setTimeout(function () {
      if (!amb || !ambState.crickets) return;
      try {
        var t = now(), p = panner(Math.random());
        var g = ctx.createGain(), o = osc('sine', 4200, t);
        o.connect(g); g.connect(p); p.connect(amb.bus);
        g.gain.setValueAtTime(0, t);
        for (var i = 0; i < 8; i++) { // 8 pulsos a 30 Hz
          var tp = t + i / 30;
          g.gain.setValueAtTime(0, tp);
          g.gain.linearRampToValueAtTime(0.02, tp + 0.004);
          g.gain.linearRampToValueAtTime(0, tp + 0.02);
        }
        o.start(t); o.stop(t + 0.3);
      } catch (e) {}
      scheduleCricket();
    }, rnd(3000, 7000));
  }

  function applyAmb(time) {
    if (!amb) return;
    var t = now(), tc = time == null ? 2 : time;
    amb.moon.gain.cancelScheduledValues(t);
    amb.moon.gain.setTargetAtTime(ambState.moon ? 0.015 : 0, t, tc);
    amb.aurora.gain.cancelScheduledValues(t);
    amb.aurora.gain.setTargetAtTime(ambState.aurora ? 0.012 : 0, t, Math.max(tc, 8)); // muito lento
    var w = clamp(ambState.wind || 0, 0, 1);
    amb.noiseGain.gain.setTargetAtTime(0.03 + w * 0.012, t, 1);
    amb.lfoDepth.gain.setTargetAtTime(0.006 + w * 0.02, t, 1);
    amb.rain.gain.cancelScheduledValues(t);
    amb.rain.gain.setTargetAtTime(ambState.rain ? 0.02 : 0, t, 1.5);
    if (ambState.crickets && !cricketTimer) scheduleCricket();
    if (!ambState.crickets && cricketTimer) { clearTimeout(cricketTimer); cricketTimer = null; }
  }

  var ambient = {
    start: function () {
      ambWanted = true;
      if (!ready() || amb) return;
      var t = now();
      var bus = ctx.createGain(); bus.gain.value = 0;
      bus.connect(master);
      bus.gain.linearRampToValueAtTime(1, t + 2);

      // ruído rosa → lowpass 500 → ganho 0.03 × LFO 0.1 Hz
      var src = ctx.createBufferSource(); src.buffer = pinkNoise(); src.loop = true;
      var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500;
      var ng = ctx.createGain(); ng.gain.value = 0.03;
      var lfo = osc('sine', 0.1, t), ld = ctx.createGain(); ld.gain.value = 0.006;
      lfo.connect(ld); ld.connect(ng.gain);
      src.connect(lp); lp.connect(ng); ng.connect(bus);
      src.start(t); lfo.start(t);

      // drone 55 + 82.4 (+110 lua, +164.8 aurora)
      function drone(f, g0) {
        var o = osc('sine', f, t), g = ctx.createGain(); g.gain.value = g0;
        o.connect(g); g.connect(bus); o.start(t); return g;
      }
      var d1 = drone(55, 0.02), d2 = drone(82.4, 0.02), moon = drone(110, 0), aurora = drone(164.8, 0);

      // garoa: ruído bandpass 3 kHz, ganho 0.02 (opcional)
      var rs = ctx.createBufferSource(); rs.buffer = whiteNoise(); rs.loop = true;
      var rbp = ctx.createBiquadFilter(); rbp.type = 'bandpass'; rbp.frequency.value = 3000; rbp.Q.value = 0.8;
      var rg = ctx.createGain(); rg.gain.value = 0;
      rs.connect(rbp); rbp.connect(rg); rg.connect(bus); rs.start(t);

      amb = { bus: bus, src: src, lfo: lfo, noiseGain: ng, lfoDepth: ld, d1: d1, d2: d2, moon: moon, aurora: aurora, rain: rg, rs: rs };
      applyAmb(0.5);
    },
    stop: function () {
      ambWanted = false;
      if (!amb) return;
      var a = amb, t = now(); amb = null;
      if (cricketTimer) { clearTimeout(cricketTimer); cricketTimer = null; }
      a.bus.gain.cancelScheduledValues(t);
      a.bus.gain.setValueAtTime(a.bus.gain.value, t);
      a.bus.gain.linearRampToValueAtTime(0, t + 1.5);
      setTimeout(function () {
        try { a.src.stop(); a.lfo.stop(); a.rs.stop(); a.bus.disconnect(); } catch (e) {}
      }, 1700);
    },
    // set({moon, aurora, fogOpen, crickets, wind, rain, fogTime})
    set: function (o) {
      o = o || {};
      if (o.moon != null) ambState.moon = !!o.moon;
      if (o.aurora != null) ambState.aurora = !!o.aurora;
      if (o.crickets != null) ambState.crickets = !!o.crickets;
      if (o.wind != null) ambState.wind = clamp(+o.wind || 0, 0, 1);
      if (o.rain != null) ambState.rain = !!o.rain;
      if (o.fogOpen != null) setFog(!!o.fogOpen, o.fogTime);
      applyAmb();
    },
    running: function () { return !!amb; }
  };

  // lowpass master: 4 kHz com névoa → 6 kHz sem (60 s por padrão)
  function setFog(open, secs) {
    // só reage a mudança de estado (chamadas periódicas não reiniciam a rampa)
    if (open === fogOpen && ready()) return;
    fogOpen = open; ambState.fogOpen = open;
    if (!ready()) return;
    var t = now(), d = secs == null ? 60 : Math.max(0.05, secs);
    lowpass.frequency.cancelScheduledValues(t);
    lowpass.frequency.setValueAtTime(lowpass.frequency.value, t);
    lowpass.frequency.linearRampToValueAtTime(open ? 6000 : 4000, t + d);
  }

  // ---------- controles ----------
  function setMuted(m) {
    muted = !!m;
    if (!ready()) return;
    var t = now();
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(master.gain.value, t);
    master.gain.linearRampToValueAtTime(muted ? 0 : 1, t + 0.3); // fade 300 ms, nunca corte
  }

  // temas: só ajustam filtros
  function setTheme(name) {
    theme = name || 'night';
    if (!ready()) return;
    var t = now(), perc = 20000, shelf = 0, hp = 20;
    if (theme === 'winter') { perc = 2000; shelf = -2; }        // plop abafado
    else if (theme === 'autumn') { shelf = -4; hp = 40; }       // mais quente
    else if (theme === 'ink') { shelf = -6; hp = 120; }         // seco, mínimo
    else if (theme === 'tropical') { shelf = 2.5; hp = 30; }    // mais claro
    percBus.frequency.setTargetAtTime(perc, t, 0.2);
    themeShelf.gain.setTargetAtTime(shelf, t, 0.3);
    themeHP.frequency.setTargetAtTime(hp, t, 0.3);
  }

  function voicesActive() { if (!ctx) return 0; reap(); return voices.length; }

  LQ.Audio = {
    init: init,
    play: play,
    ambient: ambient,
    setMuted: setMuted,
    setTheme: setTheme,
    voicesActive: voicesActive,
    noteFor: noteFor,
    freqOf: freqOf,
    isMuted: function () { return muted; },
    ready: ready,
    context: function () { return ctx; }
  };
})();

// Camada fina de plataforma. Browser: no-op + localStorage. Steam: troca a implementação abaixo.
// O jogo nunca sabe onde roda — só fala com LQ.Platform.
window.LQ = window.LQ || {};
LQ.Platform = (function(){
  const KEY = 'lagoquieto';
  const ACH_KEY = 'lagoquieto.ach'; // espelho local dos achievements (útil para depurar e para merge)

  // TODO(steam): na build Electron/Steamworks, expor `window.steamworks` (steamworks.js) antes deste script:
  //   const sw = require('steamworks.js'); const client = sw.init(APP_ID); window.steamworks = client;
  // Então: achievement(id) → client.achievement.activate(STEAM_IDS[id]);
  //        saveCloud(json) → client.cloud.writeFile('save.json', json);
  //        loadCloud()     → client.cloud.fileExists('save.json') ? client.cloud.readFile('save.json') : null;
  //        overlay do troféu → client.overlay.activateToWebPage / activate('Achievements').
  const steam = (typeof window !== 'undefined' && window.steamworks) ? window.steamworks : null;

  // Ids internos (§8) → API names configurados no Steamworks (ajustar ao painel do parceiro).
  const STEAM_IDS = {
    first_stone: 'ACH_FIRST_STONE', woke_someone: 'ACH_WOKE_SOMEONE', full_moon: 'ACH_FULL_MOON',
    clear_view: 'ACH_CLEAR_VIEW', golden_fish: 'ACH_GOLDEN_FISH', night_bloom: 'ACH_NIGHT_BLOOM',
    aurora: 'ACH_AURORA', until_dawn: 'ACH_UNTIL_DAWN', just_watching: 'ACH_JUST_WATCHING',
    accidental_melody: 'ACH_ACCIDENTAL_MELODY', left_light_on: 'ACH_LEFT_LIGHT_ON', thousand_ripples: 'ACH_THOUSAND_RIPPLES'
  };

  function localAch(){ try { return JSON.parse(localStorage.getItem(ACH_KEY) || '[]'); } catch (e) { return []; } }

  // Merge de saves (§8): max(totalTime, ripples) e união de unlocked/achievements.
  function merge(a, b){
    if (!a) return b; if (!b) return a;
    const out = Object.assign({}, a.totalTime >= b.totalTime ? a : b);
    out.totalTime = Math.max(a.totalTime || 0, b.totalTime || 0);
    out.ripples = Math.max(a.ripples || 0, b.ripples || 0);
    out.liliesBloomed = Math.max(a.liliesBloomed || 0, b.liliesBloomed || 0);
    const uni = (x, y) => Array.from(new Set([].concat(x || [], y || [])));
    out.unlocked = uni(a.unlocked, b.unlocked);
    out.achievements = uni(a.achievements, b.achievements);
    out.lastSeen = Math.max(a.lastSeen || 0, b.lastSeen || 0);
    return out;
  }

  return {
    name: steam ? 'steam' : 'web',
    wallpaper: false, // modo papel de parede (Steam): 15 fps — a build Steam liga isto
    isSteam(){ return !!steam; },
    achievement(id){
      // browser: só espelha em localStorage (sem UI, sem texto)
      try {
        const l = localAch();
        if (l.indexOf(id) < 0){ l.push(id); localStorage.setItem(ACH_KEY, JSON.stringify(l)); }
      } catch (e) {}
      if (steam){
        // TODO(steam): steam.achievement.activate(STEAM_IDS[id] || id)
        try { steam.achievement && steam.achievement.activate(STEAM_IDS[id] || id); } catch (e) {}
      }
    },
    saveCloud(json){
      try { localStorage.setItem(KEY, json); } catch (e) {}
      if (steam){
        // TODO(steam): steam.cloud.writeFile('save.json', json)
        try { steam.cloud && steam.cloud.writeFile('save.json', json); } catch (e) {}
      }
    },
    loadCloud(){
      let local = null, cloud = null;
      try { local = localStorage.getItem(KEY); } catch (e) {}
      if (steam){
        // TODO(steam): cloud = steam.cloud.fileExists('save.json') ? steam.cloud.readFile('save.json') : null
        try { cloud = steam.cloud && steam.cloud.fileExists('save.json') ? steam.cloud.readFile('save.json') : null; } catch (e) {}
      }
      if (!cloud) return local;
      try {
        const m = merge(local ? JSON.parse(local) : null, JSON.parse(cloud));
        return JSON.stringify(m);
      } catch (e) { return local; }
    },
    merge,
    STEAM_IDS
  };
})();

<script>
// Lago Quieto — núcleo (estado, unlocks, cena, anéis, gotas, input, UI, loop).
window.LQ = window.LQ || {};
(function(){
  'use strict';
  const LQ = window.LQ;

  // ---------- Registro de entidades ----------
  const ents = [];
  LQ.register = function(name, def){
    const i = ents.findIndex(e => e.name === name);
    const e = { name, def };
    if (i >= 0) ents[i] = e; else ents.push(e);
  };
  function call(hook, a, b, c){
    for (let i = 0; i < ents.length; i++){
      const f = ents[i].def[hook];
      if (f) f.call(ents[i].def, a, b, c);
    }
  }

  // ---------- Utilidades ----------
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = {
    smoothstep: t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); },
    easeInQuad: t => t * t,
    easeOutQuad: t => 1 - (1 - t) * (1 - t)
  };
  function hexToRgb(h){
    const n = parseInt(h.slice(1), 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255];
  }
  function rgbToHex(r){
    return '#' + r.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
  }
  function lerpHex(a, b, t){
    const A = hexToRgb(a), B = hexToRgb(b);
    return rgbToHex([lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)]);
  }
  // PRNG simples e determinístico (semente por sessão)
  let seed = (Date.now() & 0xffff) | 1;
  function rand(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

  // ---------- Paletas ----------
  const NIGHT = {
    zenith: '#050914', horizon: '#0b1a33', shore: '#123a5c', ring: '#1f5f7a',
    light: '#e9f2ff', firefly: '#d8f27a', gold: '#e8b04a', dark: '#0d2a1f',
    auroraG: '#7ad3c9', auroraP: '#8a6bc9', dawn: '#f2b8a2', fog: '#ffffff'
  };
  const DAY = {
    zenith: '#4a6f9a', horizon: '#9fb9d6', shore: '#3f7a96', ring: '#5f9fb8',
    light: '#f8fbff', firefly: '#d8f27a', gold: '#e8b04a', dark: '#1a3a2c',
    auroraG: '#7ad3c9', auroraP: '#8a6bc9', dawn: '#f2b8a2', fog: '#ffffff'
  };
  LQ.themes = LQ.themes || {}; // ent/themes.js pode preencher: nome → sobrescritas de paleta
  const THEME_LIST = ['night', 'winter', 'autumn', 'ink', 'tropical'];

  // ---------- Tabela de desbloqueios (§3) ----------
  const UNLOCKS = [
    { id: 'fireflies',  time: 45,    ripples: 8,    fade: 5, icon: 'firefly',  ach: 'woke_someone' },
    { id: 'wind',       time: 90,    ripples: 20,   fade: 6 },
    { id: 'fish',       time: 150,   ripples: 30,   fade: 5, icon: 'fish' },
    { id: 'stars2',     time: 180,   ripples: 40,   fade: 8 },
    { id: 'moon',       time: 360,   ripples: 70,   fade: 8, icon: 'moon' },
    { id: 'fireflies2', time: 600,   ripples: 120,  fade: 6 },
    { id: 'fish2',      time: 900,   ripples: 180,  fade: 6, icon: 'goldfish' },
    { id: 'fog_clear',  time: 1200,  ripples: 250,  fade: 8, icon: 'mountain', ach: 'clear_view' },
    { id: 'lilies',     time: 1800,  ripples: 350,  fade: 6, icon: 'lily' },
    { id: 'sky_alive',  time: 2700,  ripples: 500,  fade: 8, icon: 'shooting' },
    { id: 'frog',       time: 3600,  ripples: 700,  fade: 6, icon: 'frog' },
    { id: 'aurora',     time: 7200,  ripples: 1200, fade: 8, icon: 'aurora',   ach: 'aurora' },
    { id: 'dawn',       time: 14400, ripples: Infinity, fade: 8, icon: 'bird' }
  ];
  const fadeStart = {};   // id → game.t em que o fade começou
  let pending = [];       // fila de desbloqueios (cascata)
  let cascadeTimer = 0, cascadeDegree = 0;

  // ---------- Estado salvo (§7) ----------
  const SAVE_KEY = 'lagoquieto';
  const OFFLINE_CAP = 8 * 3600;
  function fresh(){
    return { v: 1, ripples: 0, totalTime: 0, lastSeen: 0, unlocked: [],
      liliesBloomed: 0, theme: 'night', muted: false, eco: false,
      achievements: [], stats: { longestIdle: 0, asc: 0 }, dawnAt: -1 };
  }
  function migrate(s){
    if (!s || typeof s !== 'object' || Array.isArray(s)) return fresh();
    const f = fresh();
    for (const k in f) if (s[k] === undefined) s[k] = f[k];
    // coage tipos (save corrompido nunca vira string/NaN)
    s.ripples = Math.max(0, Math.floor(Number(s.ripples) || 0));
    s.totalTime = Math.max(0, Number(s.totalTime) || 0);
    s.lastSeen = Math.max(0, Number(s.lastSeen) || 0);
    s.liliesBloomed = Math.max(0, Math.floor(Number(s.liliesBloomed) || 0));
    s.dawnAt = Number.isFinite(+s.dawnAt) ? +s.dawnAt : -1;
    s.muted = s.muted === true; s.eco = s.eco === true;
    if (!s.stats || typeof s.stats !== 'object') s.stats = f.stats;
    s.stats.longestIdle = Number(s.stats.longestIdle) || 0;
    s.stats.asc = Number(s.stats.asc) || 0;
    const ids = UNLOCKS.map(u => u.id);
    s.unlocked = Array.isArray(s.unlocked) ? s.unlocked.filter(x => ids.indexOf(x) >= 0) : [];
    s.achievements = Array.isArray(s.achievements) ? s.achievements.filter(x => typeof x === 'string' && /^[a-z_]{1,32}$/.test(x)) : [];
    if (THEME_LIST.indexOf(s.theme) < 0) s.theme = 'night';
    s.v = 1;
    return s;
  }
  function load(){
    let raw = null;
    try { raw = LQ.Platform && LQ.Platform.loadCloud ? LQ.Platform.loadCloud() : localStorage.getItem(SAVE_KEY); } catch (e) {}
    try { return migrate(raw ? JSON.parse(raw) : null); } catch (e) { return fresh(); }
  }
  let resetting = false;
  function save(){
    if (resetting) return;
    const s = game.state;
    // aba oculta: credita a ausência até agora (sem contar duas vezes)
    if (hiddenAt){ s.totalTime += Math.min((Date.now() - hiddenAt) / 1000, OFFLINE_CAP); hiddenAt = Date.now(); }
    s.lastSeen = Date.now();
    const json = JSON.stringify(s);
    if (LQ.Platform && LQ.Platform.saveCloud) LQ.Platform.saveCloud(json);
    else try { localStorage.setItem(SAVE_KEY, json); } catch (e) {}
  }

  // ---------- Objeto game (API para entidades) ----------
  const audioStub = {
    init(){}, play(){}, setMuted(){}, setTheme(){}, voicesActive(){ return 0; },
    ambient: { start(){}, stop(){}, set(){} }
  };
  const game = {
    W: 1, H: 1, horizonY: 1, t: 0, dpr: 1,
    state: null, calm: 0, palette: Object.assign({}, NIGHT), eco: false,
    mouse: { x: -1, y: -1, idleFor: 0, overWater: false },
    moonX: 0, moonY: 0, moonR: 0, // ent/sky.js preenche
    dayPhase: 0, dawnPink: 0,
    paletteVersion: 0,          // incrementa a cada mudança de game.palette
    lilyCount: 0,               // ent/lilies.js preenche
    lightBlend: 'lighter',      // ent/themes.js troca para 'multiply' em tema claro
    rand, ease,
    setPaletteOverride(obj){ paletteOverride = obj || null; },
    has(id){ return this.state.unlocked.indexOf(id) >= 0; },
    unlockFade(id){
      if (!this.has(id)) return 0;
      const u = UNLOCKS.find(x => x.id === id);
      const s = fadeStart[id];
      if (s === undefined) return 1;
      return ease.smoothstep((this.t - s) / (u ? u.fade : 6));
    },
    spawnRipple, spawnDrops,
    sprite: { glow: glowSprite },
    audio: audioStub, platform: null,
    achievement(id){
      const s = this.state;
      if (s.achievements.indexOf(id) >= 0) return;
      s.achievements.push(id);
      if (this.platform && this.platform.achievement) this.platform.achievement(id);
    },
    sinceClick: 20, // começa em modo ambiente (§3, fase 0)
    noteGain(){ return this.calm > 14 ? 0.5 : 1; }
  };
  LQ.game = game;

  // ---------- Sprites de glow cacheados ----------
  const glowCache = {};
  function glowSprite(color, radius){
    const key = color + '|' + radius;
    let c = glowCache[key];
    if (c) return c;
    const r = Math.max(2, Math.ceil(radius));
    c = document.createElement('canvas');
    c.width = c.height = r * 2;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(r, r, 0, r, r, r);
    grad.addColorStop(0, color);
    grad.addColorStop(0.35, color + 'aa');
    grad.addColorStop(1, color + '00');
    g.fillStyle = grad;
    g.fillRect(0, 0, r * 2, r * 2);
    glowCache[key] = c;
    return c;
  }

  // ---------- Cena: canvas e offscreens ----------
  let canvas, ctx, skyCv, waterCv, fogCv, started = false;
  let paletteDirty = true, palTimer = 0;

  function resize(){
    game.eco = !!game.state.eco;
    const dpr = clamp(window.devicePixelRatio || 1, 1, game.eco ? 1 : 1.5);
    game.dpr = dpr;
    game.W = window.innerWidth; game.H = window.innerHeight;
    game.horizonY = Math.round(game.H * 0.40);
    canvas.width = Math.round(game.W * dpr); canvas.height = Math.round(game.H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    paletteDirty = true;
    for (const k in glowCache) delete glowCache[k];
    if (started) call('onResize', game);
  }

  function rebuildOffscreens(){
    const P = game.palette, W = game.W, H = game.H, hy = game.horizonY;
    if (!skyCv){ skyCv = document.createElement('canvas'); waterCv = document.createElement('canvas'); fogCv = document.createElement('canvas'); }
    // Céu: gradiente vertical zênite → horizonte (+ rosa do amanhecer)
    skyCv.width = W; skyCv.height = hy;
    let g = skyCv.getContext('2d');
    let grad = g.createLinearGradient(0, 0, 0, hy);
    grad.addColorStop(0, P.zenith);
    grad.addColorStop(0.7, lerpHex(P.zenith, P.horizon, 0.7));
    grad.addColorStop(1, lerpHex(P.horizon, P.dawn, game.dawnPink * 0.5));
    g.fillStyle = grad; g.fillRect(0, 0, W, hy);
    // Água: horizonte (profundo) → margem
    waterCv.width = W; waterCv.height = H - hy;
    g = waterCv.getContext('2d');
    grad = g.createLinearGradient(0, 0, 0, H - hy);
    grad.addColorStop(0, lerpHex(P.horizon, P.dawn, game.dawnPink * 0.25));
    grad.addColorStop(0.35, P.horizon);
    grad.addColorStop(1, P.shore);
    g.fillStyle = grad; g.fillRect(0, 0, W, H - hy);
    // Névoa baixa: faixa com gradiente cacheado (ent/fog.js anima alpha/offset)
    fogCv.width = W + 40; fogCv.height = Math.round(H * 0.22);
    g = fogCv.getContext('2d');
    grad = g.createLinearGradient(0, 0, 0, fogCv.height);
    grad.addColorStop(0, P.fog + '00');
    grad.addColorStop(0.5, P.fog + '70'); // pico suave: névoa fina, não faixa
    grad.addColorStop(1, P.fog + '00');
    g.fillStyle = grad; g.fillRect(0, 0, fogCv.width, fogCv.height);
    game.fogSprite = fogCv;
    paletteDirty = false;
  }

  // Paleta-alvo: tema + fase do dia; lerp a cada 500 ms
  function targetPalette(){
    const th = LQ.themes[game.state.theme] || {};
    const base = Object.assign({}, NIGHT, th.night || th);
    const day = Object.assign({}, DAY, th.day || {});
    const out = {};
    for (const k in base) out[k] = lerpHex(base[k], day[k], game.dayPhase);
    // lua nascida: 10% mais azul/clara (§3 #5)
    const mk = game.unlockFade('moon') * 0.10;
    if (mk > 0){
      out.zenith = lerpHex(out.zenith, '#0b1a33', mk);
      out.horizon = lerpHex(out.horizon, out.light, mk * 0.5);
      out.shore = lerpHex(out.shore, out.light, mk * 0.5);
    }
    if (game.dawnPink > 0) out.horizon = lerpHex(out.horizon, out.dawn, game.dawnPink * 0.4);
    if (paletteOverride) for (const k in paletteOverride) if (out[k] !== undefined) out[k] = paletteOverride[k];
    return out;
  }
  function updateDayCycle(){
    const s = game.state;
    if (!game.has('dawn')){ game.dayPhase = 0; game.dawnPink = 0; return; }
    let ph;
    const since = s.totalTime - s.dawnAt; // primeiro ciclo: 30 min sobe, 30 min dia, 30 min desce
    if (s.dawnAt >= 0 && since < 5400){
      ph = since < 1800 ? since / 1800 : since < 3600 ? 1 : 1 - (since - 3600) / 1800;
    } else {
      const h = new Date().getHours() + new Date().getMinutes() / 60; // relógio real
      ph = h < 5 ? 0 : h < 7 ? (h - 5) / 2 : h < 17 ? 1 : h < 20 ? 1 - (h - 17) / 3 : 0;
    }
    ph = ease.smoothstep(ph);
    game.dayPhase = ph;
    game.dawnPink = Math.sin(Math.PI * ph); // rosa só nas transições
  }
  let paletteOverride = null; // game.setPaletteOverride({chave:'#hex'}|null): aplicado ao alvo
  function stepPalette(){
    const T = targetPalette();
    let changed = false;
    for (const k in T){
      const cur = game.palette[k] || T[k];
      const A = hexToRgb(cur), B = hexToRgb(T[k]);
      // snap final: perto do alvo salta direto (o lerp arredondado nunca converge)
      const near = Math.abs(A[0] - B[0]) <= 2 && Math.abs(A[1] - B[1]) <= 2 && Math.abs(A[2] - B[2]) <= 2;
      const nv = near ? T[k] : lerpHex(cur, T[k], 0.25);
      if (nv !== game.palette[k]){ game.palette[k] = nv; changed = true; }
    }
    if (changed){
      paletteDirty = true; game.paletteVersion++;
      for (const k in glowCache) delete glowCache[k]; // sprites dependem da cor; evita cache crescer
    }
  }

  // ---------- Anéis (pool 40) ----------
  const RIPPLE_MAX = 40, RING_LIFE = 1.8, RING_SPEED = 60;
  const ripples = [];
  for (let i = 0; i < RIPPLE_MAX; i++) ripples.push({ active: false, x: 0, y: 0, age: 0, strength: 1, rings: 3 });
  let rippleCursor = 0;
  function spawnRipple(x, y, opts){
    opts = opts || {};
    // recicla o mais antigo se o pool estiver cheio
    let r = null;
    for (let i = 0; i < RIPPLE_MAX; i++){ const c = ripples[(rippleCursor + i) % RIPPLE_MAX]; if (!c.active){ r = c; break; } }
    if (!r){ r = ripples[rippleCursor]; }
    rippleCursor = (rippleCursor + 1) % RIPPLE_MAX;
    r.active = true; r.x = x; r.y = y; r.age = 0;
    r.strength = opts.strength !== undefined ? opts.strength : 1;
    r.rings = clamp(Math.round(opts.rings !== undefined ? opts.rings : (r.strength < 0.5 ? 1 : r.strength < 0.8 ? 2 : 3)) || 1, 1, 3);
    activeRipples++;
    call('onRipple', x, y, game);
    return r;
  }
  const RING_DELAY = [0, 0.12, 0.24], RING_A0 = [1, 0.6, 0.35];
  let activeRipples = 0;
  function updateRipples(dt){
    activeRipples = 0;
    for (let i = 0; i < RIPPLE_MAX; i++){
      const r = ripples[i]; if (!r.active) continue;
      r.age += dt;
      if (r.age > RING_LIFE + RING_DELAY[r.rings - 1]) r.active = false; else activeRipples++;
    }
  }
  function drawRipples(){
    if (game.hideCoreRipples) return; // tema substitui os anéis (ex.: pinceladas da tinta)
    ctx.strokeStyle = game.palette.ring; ctx.lineWidth = 1.5;
    for (let i = 0; i < RIPPLE_MAX; i++){
      const r = ripples[i]; if (!r.active) continue;
      for (let k = 0; k < r.rings; k++){
        const a = r.age - RING_DELAY[k]; if (a <= 0 || a >= RING_LIFE) continue;
        const f = 1 - a / RING_LIFE;
        const alpha = RING_A0[k] * f * f * (0.5 + 0.5 * r.strength);
        if (alpha < 0.01) continue;
        const rad = a * RING_SPEED * (0.6 + 0.4 * r.strength);
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.ellipse(r.x, r.y, rad, rad * 0.35, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }
  // Deslocamento x da água num ponto por causa dos anéis (usado no reflexo da lua)
  function rippleOffset(px, py){
    let off = 0;
    if (!activeRipples) return 0;
    for (let i = 0; i < RIPPLE_MAX; i++){
      const r = ripples[i]; if (!r.active) continue;
      const dx = px - r.x, dy = (py - r.y) / 0.35;
      const front = r.age * RING_SPEED, lim = front + 30;
      const d2 = dx * dx + dy * dy;
      if (d2 > lim * lim) continue; // sai antes do sqrt
      const d = Math.sqrt(d2);
      const life = 1 - r.age / (RING_LIFE + 0.24);
      off += Math.sin(d * 0.3 - r.age * 6) * 3 * r.strength * life;
    }
    return off;
  }
  game.rippleOffset = rippleOffset;

  // ---------- Gotas (pool 60) ----------
  const DROP_MAX = 60, drops = [];
  for (let i = 0; i < DROP_MAX; i++) drops.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, age: 0, color: null });
  let dropCursor = 0;
  function spawnDrops(x, y, n, color){
    for (let k = 0; k < n; k++){
      const d = drops[dropCursor]; dropCursor = (dropCursor + 1) % DROP_MAX;
      d.color = color || null;
      const ang = rand() * Math.PI * 2, sp = 40 + rand() * 50;
      d.active = true; d.x = x; d.y = y; d.age = 0;
      d.vx = Math.cos(ang) * sp * 0.6; d.vy = -Math.abs(Math.sin(ang)) * sp - 30;
    }
  }
  function updateDrops(dt){
    for (let i = 0; i < DROP_MAX; i++){
      const d = drops[i]; if (!d.active) continue;
      d.age += dt; if (d.age >= 0.5){ d.active = false; continue; }
      d.vy += 300 * dt; d.x += d.vx * dt; d.y += d.vy * dt;
    }
  }
  function drawDrops(){
    ctx.fillStyle = game.palette.light;
    for (let i = 0; i < DROP_MAX; i++){
      const d = drops[i]; if (!d.active) continue;
      ctx.fillStyle = d.color || game.palette.light;
      ctx.globalAlpha = (1 - d.age / 0.5) * 0.9;
      ctx.fillRect(d.x - 1, d.y - 1, 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Pedras caindo e brilhos do céu ----------
  const stones = [], glows = [];
  const STONE_T = 0.25;
  function throwStone(x, y){
    stones.push({ x, y, age: 0 });
  }
  let lastNoteAt = -1, ascRun = 0, lastDegree = -1;
  function impact(x, y){
    const s = game.state;
    spawnRipple(x, y, { strength: 1, rings: 3 });
    spawnDrops(x, y, 3 + Math.floor(rand() * 4));
    s.ripples++;
    game.calm = Math.min(20, game.calm + 1);
    // Áudio: plop + nota (x → nota, y → oitava); nota só se >80 ms desde a anterior
    const nx = clamp(x / game.W, 0, 1), ny = clamp((y - game.horizonY) / (game.H - game.horizonY), 0, 1);
    // gain é relativo (1 = valor de projeto do §6; audio.js aplica os absolutos)
    game.audio.play('plop', { x: nx, y: ny, gain: 1 });
    const now = performance.now();
    if (now - lastNoteAt >= 80){
      game.audio.play('note', { x: nx, y: ny, gain: game.noteGain() });
      lastNoteAt = now;
      const deg = Math.min(4, Math.floor(nx * 5)); // "Melodia Acidental": 5 notas ascendentes
      ascRun = deg > lastDegree ? ascRun + 1 : 1; lastDegree = deg;
      if (ascRun >= 5) game.achievement('accidental_melody');
    }
    if (s.ripples === 1) game.achievement('first_stone');
    if (s.ripples >= 1000) game.achievement('thousand_ripples');
  }
  function updateStones(dt){
    for (let i = stones.length - 1; i >= 0; i--){
      const st = stones[i]; st.age += dt;
      if (st.age >= STONE_T){
        stones.splice(i, 1);
        if (st.dew){
          // gota de orvalho: anel menor, sem contar ripple
          spawnRipple(st.x, st.y, { strength: 0.55, rings: 2 });
          spawnDrops(st.x, st.y, 2);
          game.audio.play('dew', { x: st.x / game.W, y: 0.5, gain: 1 });
        } else impact(st.x, st.y);
      }
    }
    for (let i = glows.length - 1; i >= 0; i--){ glows[i].age += dt; if (glows[i].age >= 0.3) glows.splice(i, 1); }
  }
  function drawStones(){
    ctx.fillStyle = game.palette.light;
    for (const st of stones){
      const k = ease.easeInQuad(st.age / STONE_T);
      // pedra: arco leve; orvalho: cai reto da altura do junco
      const h = st.dew ? st.fallH : 40;
      const y = st.y - h * (1 - k), x = st.x - (st.dew ? 0 : 8) * (1 - k);
      ctx.globalAlpha = st.dew ? 0.6 : 0.9;
      ctx.beginPath(); ctx.arc(x, y, st.dew ? 1.5 : 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function drawGlows(){
    for (const g of glows){
      const k = 1 - g.age / 0.3;
      const sp = glowSprite(game.palette.light, 40);
      ctx.globalAlpha = 0.12 * Math.sin(Math.PI * (1 - k));
      ctx.drawImage(sp, g.x - 40, g.y - 40, 80, 80);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Reflexo da lua em fatias ----------
  function drawMoonReflection(){
    if (game.moonR <= 0 || game.moonY > game.horizonY) return;
    const P = game.palette, hy = game.horizonY;
    const len = Math.min(game.H - hy, game.moonR * 14);
    const baseW = game.moonR * 2.2 + 40; // ~80 px
    ctx.fillStyle = P.light;
    if (game.eco){
      // eco: um único retângulo esmaecido
      ctx.globalAlpha = 0.05;
      ctx.fillRect(game.moonX - baseW * 0.5, hy, baseW, len);
      ctx.globalAlpha = 1; return;
    }
    const slice = 3, n = Math.floor(len / slice);
    const t = game.t;
    for (let i = 0; i < n; i++){
      const y = hy + i * slice, f = 1 - i / n;
      const w = baseW * (0.35 + 0.65 * (1 - f)) * (0.9 + 0.1 * Math.sin(y * 0.11 + t * 1.3));
      const dx = Math.sin(y * 0.15 + t * 2) * 2 + rippleOffset(game.moonX, y);
      ctx.globalAlpha = 0.10 * f * f + 0.008;
      ctx.fillRect(game.moonX + dx - w * 0.5, y, w, slice);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Halo do cursor ----------
  function drawCursorHalo(){
    const m = game.mouse;
    if (!m.overWater || m.idleFor > 120 || m.x < 0) return;
    const boost = game.sinceClick < 0.3 ? 0.2 : 0;
    const a = 0.06 + boost;
    ctx.fillStyle = game.palette.light;
    for (let k = 3; k >= 1; k--){
      ctx.globalAlpha = a * (4 - k) / 3;
      ctx.beginPath(); ctx.ellipse(m.x, m.y, 7 * k, 7 * k * 0.35, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Desbloqueios ----------
  function checkUnlocks(){
    const s = game.state;
    for (const u of UNLOCKS){
      if (s.unlocked.indexOf(u.id) >= 0 || pending.indexOf(u.id) >= 0) continue;
      if (s.totalTime >= u.time || s.ripples >= u.ripples) pending.push(u.id);
    }
  }
  function applyUnlock(id){
    const s = game.state, u = UNLOCKS.find(x => x.id === id);
    s.unlocked.push(id);
    fadeStart[id] = game.t;
    if (id === 'dawn' && s.dawnAt < 0) s.dawnAt = s.totalTime;
    game.audio.play('unlock', { degree: cascadeDegree % 5, gain: 1 });
    cascadeDegree++;
    if (u && u.ach) game.achievement(u.ach);
    call('onUnlock', id, game);
    updateAmbient();
    UI.refreshCollection(u && u.icon);
  }
  function updatePending(dt){
    if (!pending.length){ cascadeTimer = 0; cascadeDegree = 0; return; }
    cascadeTimer -= dt;
    if (cascadeTimer <= 0){
      applyUnlock(pending.shift());
      cascadeTimer = 2.5; // cascata de boas-vindas
    }
  }
  function updateAmbient(){
    game.audio.ambient.set({
      moon: game.has('moon'), aurora: game.has('aurora'), fogOpen: game.has('fog_clear'),
      crickets: game.dayPhase < 0.5, wind: game.has('wind') ? 1 : 0
    });
  }

  // ---------- Modo ambiente ----------
  let dewTimer = 8, watchTimer = 0;
  function updateAmbientMode(dt){
    if (game.sinceClick < 0.001) watchTimer = 0; // houve clique neste frame
    watchTimer += dt;
    game.sinceClick += dt;
    if (game.sinceClick < 20){ dewTimer = 6 + rand() * 4; return; }
    dewTimer -= dt;
    if (dewTimer <= 0){
      dewTimer = 6 + rand() * 4;
      // gota cai de um junco (70%) ou de um ponto qualquer da água
      const per = (LQ.reeds && LQ.reeds.perches) ? LQ.reeds.perches(game) : [];
      let x, y, fallH = 40;
      if (per.length && rand() < 0.7){
        const p = per[Math.floor(rand() * per.length)];
        x = clamp(p.x + (rand() - 0.5) * 10, 10, game.W - 10);
        y = clamp(p.y + 40 + rand() * 80, game.horizonY + 20, game.H - 20);
        fallH = Math.max(20, y - p.y);
      } else {
        x = 40 + rand() * (game.W - 80);
        y = game.horizonY + 20 + rand() * (game.H - game.horizonY - 60);
      }
      stones.push({ x, y, age: 0, dew: true, fallH });
    }
    // "Só Olhando": 10 min sem clicar
    if (watchTimer >= 600) game.achievement('just_watching');
    if (game.sinceClick > game.state.stats.longestIdle) game.state.stats.longestIdle = Math.floor(game.sinceClick);
  }

  // ---------- Input ----------
  function canvasPos(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  let audioStarted = false;
  function ensureAudio(){
    if (audioStarted) return;
    audioStarted = true;
    game.audio.init();
    game.audio.setMuted(!!game.state.muted);
    game.audio.setTheme(game.state.theme);
    // névoa já dissipada em sessão anterior: lowpass já aberto (sem rampa de 60 s)
    game.audio.ambient.set({ fogOpen: game.has('fog_clear'), fogTime: 0.05 });
    game.audio.ambient.start();
    updateAmbient();
  }
  function onPointerDown(e){
    if (e.button !== undefined && e.button !== 0) return;
    ensureAudio();
    const p = canvasPos(e);
    game.mouse.x = p.x; game.mouse.y = p.y; game.mouse.idleFor = 0;
    UI.wake();
    // Primeiro os moradores
    for (let i = ents.length - 1; i >= 0; i--){
      const f = ents[i].def.onClick;
      if (f && f.call(ents[i].def, p.x, p.y, game)){ game.sinceClick = 0; return; }
    }
    if (p.y > game.horizonY){ throwStone(p.x, p.y); game.sinceClick = 0; }
    else glows.push({ x: p.x, y: p.y, age: 0 }); // brilho sutil, nunca erro
  }
  function onPointerMove(e){
    const p = canvasPos(e);
    game.mouse.x = p.x; game.mouse.y = p.y; game.mouse.idleFor = 0;
    game.mouse.overWater = p.y > game.horizonY;
    UI.wake();
  }
  function onPointerLeave(){ game.mouse.overWater = false; }

  // ---------- UI ----------
  const UI = {
    hideTimer: 0, collOpen: false, hover: false,
    init(){
      const ui = document.getElementById('ui');
      ui.addEventListener('pointerdown', e => e.stopPropagation());
      // ponteiro parado sobre a barra: ela não some debaixo do cursor
      ui.addEventListener('pointerenter', () => { UI.hover = true; UI.wake(); });
      ui.addEventListener('pointerleave', () => { UI.hover = false; UI.hideTimer = 0; });
      document.querySelectorAll('.ico').forEach(b => {
        b.addEventListener('click', e => { e.stopPropagation(); UI.act(b.dataset.act); });
      });
      UI.applyClasses();
      UI.refreshCollection(null, true);
    },
    act(a){
      const s = game.state;
      ensureAudio();
      if (a === 'sound'){ s.muted = !s.muted; game.audio.setMuted(s.muted); }
      else if (a === 'full'){
        let p = null;
        if (document.fullscreenElement){ if (document.exitFullscreen) p = document.exitFullscreen(); }
        else if (document.documentElement.requestFullscreen) p = document.documentElement.requestFullscreen();
        if (p && p.catch) p.catch(() => {}); // sem gesto/permissão: silencioso
      }
      else if (a === 'theme'){
        const list = LQ.themeList || THEME_LIST;
        s.theme = list[(list.indexOf(s.theme) + 1) % list.length];
        game.audio.setTheme(s.theme);
        call('onTheme', s.theme, game);
      }
      else if (a === 'coll'){ UI.collOpen = !UI.collOpen; document.getElementById('collection').classList.toggle('open', UI.collOpen); }
      else if (a === 'eco'){ s.eco = !s.eco; resize(); }
      UI.applyClasses(); save();
    },
    applyClasses(){
      const b = document.body, s = game.state;
      b.classList.toggle('muted', !!s.muted);
      b.classList.toggle('eco', !!s.eco);
    },
    wake(){ UI.hideTimer = 0; document.body.classList.remove('uihidden'); },
    update(dt){
      game.mouse.idleFor += dt;
      if (UI.hover) UI.hideTimer = 0; else UI.hideTimer += dt;
      if (UI.hideTimer > 3) document.body.classList.add('uihidden');
      document.body.classList.toggle('nocursor', game.mouse.idleFor > 120);
    },
    // Coleção: um ícone por morador acordado; `newIcon` nasce com fade
    refreshCollection(newIcon, silent){
      const el = document.getElementById('collection');
      const s = game.state, icons = [];
      for (const u of UNLOCKS) if (u.icon && s.unlocked.indexOf(u.id) >= 0) icons.push(u.icon);
      if (s.liliesBloomed > 0) icons.push('flower');
      let html = '';
      for (const ic of icons){
        html += '<svg class="' + (ic === newIcon && !silent ? 'new' : '') + '"><use href="#ic-' + ic + '"/></svg>';
      }
      el.innerHTML = html;
      // morador novo: a faixa aparece sozinha por alguns segundos (fade, sem texto)
      if (newIcon && !silent && !UI.collOpen){
        el.classList.add('open');
        clearTimeout(UI.peekTimer);
        UI.peekTimer = setTimeout(() => { if (!UI.collOpen) el.classList.remove('open'); }, 6000);
      }
    }
  };
  game.ui = UI;
  // Recomeçar do zero (dev/teste): impede o save de unload regravar o estado e recarrega
  LQ.reset = function(){
    resetting = true;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    location.reload();
  };

  // ---------- Desenho por camadas ----------
  // 'reeds' vem depois de 'water' (juncos ficam na margem, em primeiro plano)
  const LAYERS = ['sky', 'aurora', 'moon', 'mountains', 'water', 'reeds', 'lilies', 'fish', 'ripples', 'light', 'fog'];
  function draw(){
    if (paletteDirty) rebuildOffscreens();
    const W = game.W, H = game.H, hy = game.horizonY;
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(skyCv, 0, 0);
    for (const layer of LAYERS){
      if (layer === 'aurora'){ if (game.eco) continue; ctx.globalCompositeOperation = 'screen'; }
      else if (layer === 'light') ctx.globalCompositeOperation = game.lightBlend || 'lighter'; // tema claro (tinta): multiply
      else ctx.globalCompositeOperation = 'source-over';
      if (layer === 'water'){ ctx.drawImage(waterCv, 0, hy); }
      call('draw', layer, ctx, game);
      if (layer === 'water') drawMoonReflection();
      if (layer === 'ripples'){ drawRipples(); drawStones(); }
      if (layer === 'light'){ drawDrops(); drawGlows(); drawCursorHalo(); }
      ctx.globalAlpha = 1;
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------- Loop ----------
  let last = 0, saveTimer = 0, unlockTimer = 0, hiddenAt = 0, running = false;
  function frame(now){
    if (!running) return;
    requestAnimationFrame(frame);
    if (LQ.Platform && LQ.Platform.wallpaper && now - last < 66) return; // papel de parede: 15 fps
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
    game.t += dt;
    game.state.totalTime += dt;
    game.calm = Math.max(0, game.calm - 0.2 * dt);

    palTimer += dt;
    if (palTimer >= 0.5){ palTimer = 0; updateDayCycle(); stepPalette(); }
    unlockTimer += dt;
    if (unlockTimer >= 1){ unlockTimer = 0; checkUnlocks(); updateAmbient(); }
    updatePending(dt);
    updateAmbientMode(dt);
    updateStones(dt);
    updateRipples(dt);
    updateDrops(dt);
    call('update', dt, game);
    UI.update(dt);
    draw();

    saveTimer += dt;
    if (saveTimer >= 10){ saveTimer = 0; save(); }
  }
  function onVisibility(){
    if (document.hidden){
      running = false; hiddenAt = Date.now(); save();
    } else {
      // Volta: avança relógio (cap 8 h) e deixa a cascata mostrar o que acordou
      if (hiddenAt){ game.state.totalTime += Math.min((Date.now() - hiddenAt) / 1000, OFFLINE_CAP); hiddenAt = 0; }
      checkUnlocks();
      if (running) return; // já há um encadeamento de rAF
      running = true; last = performance.now(); requestAnimationFrame(frame);
    }
  }

  // ---------- Início ----------
  LQ.start = function(){
    game.state = load();
    game.platform = LQ.Platform || null;
    game.audio = LQ.Audio || audioStub;
    // Ganho offline (cap 8 h) + achievement de retorno após 24 h+
    const s = game.state, now = Date.now();
    if (s.lastSeen > 0){
      const away = (now - s.lastSeen) / 1000;
      s.totalTime += Math.min(Math.max(0, away), OFFLINE_CAP);
      if (away >= 86400) game.achievement('left_light_on');
    }
    canvas = document.getElementById('lake');
    ctx = canvas.getContext('2d', { alpha: false });
    resize();
    updateDayCycle();
    game.palette = targetPalette(); paletteDirty = true;

    call('init', game);
    started = true;
    UI.init();
    checkUnlocks(); // pendentes entram em cascata (2,5 s cada)
    cascadeTimer = pending.length > 1 ? 1.5 : 0;

    window.addEventListener('resize', resize);
    canvas.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerleave', onPointerLeave);
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('visibilitychange', onVisibility);
    window.addEventListener('beforeunload', save);
    window.addEventListener('pagehide', save);

    running = true; last = performance.now();
    requestAnimationFrame(frame);
  };
})();

<script>
// Juncos — silhuetas na margem (3 à esquerda desde o início, mais à direita com 'fireflies2').
// Path2D cacheado por junco; respiração 1.0→1.03→1.0 em 400 ms quando um anel nasce a <120 px;
// balanço ±3° (seno) com o unlock 'wind'. Expõe LQ.reeds.perches() para os vagalumes pousarem.
window.LQ = window.LQ || {};
(function(){
  'use strict';
  const LQ = window.LQ;
  const BREATH_T = 0.4, BREATH_R = 120, MAX_ANGLE = 3 * Math.PI / 180;
  const reeds = [];       // {side, nx, h, lean, path, tipX, tipY, phase, breath, angle, wx, wy}
  let lastW = 0, lastH = 0;

  // Constrói a Path2D de um junco em coordenadas locais (base na origem, y para cima é negativo)
  function buildPath(r, game){
    const H = game.H;
    const h = r.h * H, lean = r.lean * H;
    const p = new Path2D();
    // Caule: curva fina afunilando até a ponta
    const w0 = 3.2, tx = lean, ty = -h;
    p.moveTo(-w0 * 0.5, 0);
    p.quadraticCurveTo(lean * 0.35 - 1, -h * 0.55, tx - 0.6, ty);
    p.lineTo(tx + 0.6, ty);
    p.quadraticCurveTo(lean * 0.35 + 1, -h * 0.55, w0 * 0.5, 0);
    p.closePath();
    // Espiga (tipo taboa) em alguns juncos
    if (r.head){
      p.ellipse(tx, ty + h * 0.06, 2.6, h * 0.07, r.lean * 0.6, 0, Math.PI * 2);
    }
    // Uma ou duas folhas saindo do caule
    for (let i = 0; i < r.leaves; i++){
      const f = 0.25 + i * 0.28;                  // altura relativa da folha
      const sx = lean * f * 0.5, sy = -h * f;
      const dir = (i % 2 === 0 ? -1 : 1) * r.side;
      const lx = sx + dir * h * 0.16, ly = sy - h * 0.22;
      p.moveTo(sx, sy);
      p.quadraticCurveTo(sx + dir * h * 0.04, sy - h * 0.14, lx, ly);
      p.quadraticCurveTo(sx + dir * h * 0.09, sy - h * 0.08, sx + dir * 2, sy + 4);
      p.closePath();
    }
    r.path = p; r.tipX = tx; r.tipY = ty;
  }

  function makeReed(side, nx, rnd){
    return {
      side, nx,
      h: 0.16 + rnd() * 0.14,           // altura relativa a H
      lean: (rnd() * 0.06 + 0.02) * (rnd() < 0.5 ? -1 : 1),
      head: rnd() < 0.6, leaves: 1 + Math.floor(rnd() * 2),
      phase: rnd() * Math.PI * 2, speed: 0.6 + rnd() * 0.5,
      breath: 10, angle: 0, path: null, tipX: 0, tipY: 0, wx: 0, wy: 0
    };
  }

  function rebuild(game){
    for (const r of reeds) buildPath(r, game);
    lastW = game.W; lastH = game.H;
  }

  function baseY(game){ return game.H + 2; }   // base um pouco abaixo da borda inferior
  function baseX(r, game){ return r.nx * game.W; }

  const def = {
    init(game){
      const rnd = game.rand;
      reeds.length = 0;
      // 3 à esquerda (sempre)
      reeds.push(makeReed('L', 0.045, rnd), makeReed('L', 0.085, rnd), makeReed('L', 0.125, rnd));
      // 4 à direita (fade com 'fireflies2')
      reeds.push(makeReed('R', 0.905, rnd), makeReed('R', 0.935, rnd), makeReed('R', 0.965, rnd), makeReed('R', 0.985, rnd));
      for (const r of reeds){ r.side = r.side === 'L' ? -1 : 1; }
      rebuild(game);
    },

    onResize(game){ rebuild(game); },
    update(dt, game){
      if (game.W !== lastW || game.H !== lastH) rebuild(game);
      const wind = game.has('wind') ? game.unlockFade('wind') : 0;
      const by = baseY(game);
      for (const r of reeds){
        r.breath += dt;
        // Balanço: soma de dois senos lentos, amplitude ±3°
        const s = Math.sin(game.t * r.speed + r.phase) * 0.75 + Math.sin(game.t * r.speed * 2.3 + r.phase * 1.7) * 0.25;
        r.angle = MAX_ANGLE * s * wind;
        // Ponta em coordenadas de tela (para os vagalumes pousarem)
        const c = Math.cos(r.angle), sn = Math.sin(r.angle);
        r.wx = baseX(r, game) + r.tipX * c - r.tipY * sn;
        r.wy = by + r.tipX * sn + r.tipY * c;
      }
    },

    // Camada 'reeds' (depois da água): primeiro plano da margem
    draw(layer, ctx, game){
      if (layer !== 'reeds') return;
      const rightFade = game.has('fireflies2') ? game.unlockFade('fireflies2') : 0;
      const by = baseY(game);
      ctx.fillStyle = game.palette.dark;
      for (const r of reeds){
        const a = r.side < 0 ? 1 : rightFade;
        if (a <= 0.005) continue;
        let sc = 1;
        if (r.breath < BREATH_T) sc = 1 + 0.03 * Math.sin(Math.PI * r.breath / BREATH_T);
        ctx.globalAlpha = a;
        ctx.save();
        ctx.translate(baseX(r, game), by);
        ctx.rotate(r.angle);
        if (sc !== 1) ctx.scale(sc, sc);
        ctx.fill(r.path);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    },

    // Anel perto da base → respiração
    onRipple(x, y, game){
      const by = baseY(game);
      for (const r of reeds){
        if (r.side > 0 && !game.has('fireflies2')) continue;
        // distância ao segmento base→ponta (não só à base, que fica fora da tela)
        const bx = baseX(r, game), vx = r.wx - bx, vy = r.wy - by;
        const len2 = vx * vx + vy * vy || 1;
        const t = Math.max(0, Math.min(1, ((x - bx) * vx + (y - by) * vy) / len2));
        const dx = x - (bx + vx * t), dy = y - (by + vy * t);
        if (dx * dx + dy * dy < BREATH_R * BREATH_R) r.breath = 0;
      }
    }
  };

  LQ.register('reeds', def);

  // API para outras entidades (vagalumes): pontas dos juncos visíveis
  LQ.reeds = {
    perches(game){
      const out = [];
      const right = game.has('fireflies2');
      for (const r of reeds){
        if (r.side > 0 && !right) continue;
        out.push({ x: r.wx, y: r.wy, reed: r });
      }
      return out;
    }
  };
})();

<script>
// Vagalumes — 5 com 'fireflies', 15 com 'fireflies2'. Movimento = soma de 2 senos, pulso 2-4 s.
// Glow via game.sprite.glow na camada 'light'. Fogem 30 px do anel (ease 600 ms) e brilham 2 s
// com tilintar; clique = pulso + nota uma oitava acima. Alguns pousam nas pontas dos juncos e,
// com 3+ pousados próximos, linhas finas de constelação (alpha 0.15) ligam-os por alguns segundos.
window.LQ = window.LQ || {};
(function(){
  'use strict';
  const LQ = window.LQ;
  const MAX = 15, BASE = 5;
  const FLEE_R = 150, FLEE_D = 30, FLEE_T = 0.6, SHINE_T = 2.0;
  const HIT_R = 16, CONST_R = 110;
  const flies = [];
  let lastChime = -1e9, constAlpha = 0, constTimer = 0;
  const pairs = [];   // pares ligados por linhas de constelação

  function mk(rnd){
    return {
      // posição base normalizada (x 0..1, y 0..1 na faixa horizonte→fundo)
      bx: rnd(), by: 0.05 + rnd() * 0.85,
      ax: 0.02 + rnd() * 0.05, ay: 0.02 + rnd() * 0.04,      // amplitudes (fração de W/H)
      f1: 0.15 + rnd() * 0.2, f2: 0.31 + rnd() * 0.3,        // frequências dos senos
      p1: rnd() * 6.28, p2: rnd() * 6.28, p3: rnd() * 6.28, p4: rnd() * 6.28,
      period: 2 + rnd() * 2, pph: rnd() * 6.28,              // pulso 2-4 s
      drift: (rnd() - 0.5) * 0.01,                           // deriva lenta da base
      x: 0, y: 0, fx: 0, fy: 0, flee: 10, shine: 10,         // fuga e brilho (timers)
      state: 0, perch: null, st: 0, land: 0, px: 0, py: 0,    // 0 voa, 1 pousando, 2 pousado, 3 decolando
      sx: 0, sy: 0, wait: 8 + rnd() * 20,                     // origem do pouso; espera até tentar pousar
      born: -1                                                // game.t do nascimento (fade)
    };
  }

  function alive(game){
    if (!game.has('fireflies')) return 0;
    return game.has('fireflies2') ? MAX : BASE;
  }

  function freePos(f, game){
    const W = game.W, hy = game.horizonY, wh = game.H - hy, t = game.t;
    const x = (f.bx + f.ax * (Math.sin(t * f.f1 + f.p1) + 0.5 * Math.sin(t * f.f2 + f.p2))) * W;
    const y = hy + (f.by + f.ay * (Math.sin(t * f.f1 * 1.3 + f.p3) + 0.5 * Math.sin(t * f.f2 * 0.8 + f.p4))) * wh;
    return { x, y };
  }

  function chime(game, x, g){
    const now = game.t;
    if (now - lastChime < 0.15) return;   // quase subliminar, nunca em rajada
    lastChime = now;
    game.audio.play('firefly', { x: x / game.W, gain: g });
  }

  const def = {
    init(game){
      flies.length = 0;
      for (let i = 0; i < MAX; i++) flies.push(mk(game.rand));
      // já acordados em sessão anterior: nascem em t=0 (born<0 significa 'ainda não')
      if (game.has('fireflies')) for (let i = 0; i < alive(game); i++) flies[i].born = 0;
    },

    onUnlock(id, game){
      const n = alive(game);
      // cada um tilinta ao acordar (em update, quando cruza `born`) — coro esparso
      for (let i = 0; i < n; i++) if (flies[i].born < 0){ flies[i].born = game.t + (i % BASE) * 0.7; flies[i].woke = false; }
    },

    update(dt, game){
      const n = alive(game), rnd = game.rand, t = game.t;
      const perches = (LQ.reeds && LQ.reeds.perches) ? LQ.reeds.perches(game) : [];
      const W = game.W, H = game.H;
      for (let i = 0; i < MAX; i++){
        const f = flies[i];
        if (i >= n || f.born < 0 || t < f.born) continue;
        if (f.woke === false){ f.woke = true; const p0 = freePos(f, game); chime(game, p0.x, 1); }
        f.flee += dt; f.shine += dt;
        f.bx += f.drift * dt; if (f.bx < 0.02 || f.bx > 0.98) f.drift = -f.drift;
        const fp = freePos(f, game);

        if (f.state === 0){
          f.wait -= dt;
          // pousar nos juncos é comportamento da fase 6 (fireflies2, §3)
          if (f.wait <= 0 && perches.length && game.has('fireflies2') && rnd() < 0.5){
            f.perch = perches[Math.floor(rnd() * perches.length)].reed;
            f.state = 1; f.st = 0; f.sx = f.x; f.sy = f.y;
          } else if (f.wait <= 0) f.wait = 10 + rnd() * 20;
          f.x = fp.x; f.y = fp.y;
        } else if (f.state === 1){
          // Pousando: 2,5 s de aproximação suave até a ponta do junco
          f.st += dt;
          const k = game.ease.smoothstep(f.st / 2.5);
          const tx = f.perch.wx, ty = f.perch.wy - 3;
          f.x = f.sx + (tx - f.sx) * k + Math.sin(f.st * 5) * 6 * (1 - k);
          f.y = f.sy + (ty - f.sy) * k;
          if (f.st >= 2.5){ f.state = 2; f.land = 6 + rnd() * 14; }
        } else if (f.state === 2){
          f.land -= dt;
          f.x = f.perch.wx; f.y = f.perch.wy - 3;
          if (f.land <= 0 || f.flee < FLEE_T){
            // Decola: a base passa a ser onde está
            f.state = 0; f.perch = null; f.wait = 15 + rnd() * 25;
            f.bx = Math.min(0.98, Math.max(0.02, f.x / W));
            f.by = Math.min(0.9, Math.max(0.05, (f.y - game.horizonY) / (H - game.horizonY)));
            f.p1 = -t * f.f1; f.p2 = -t * f.f2; f.p3 = -t * f.f1 * 1.3; f.p4 = -t * f.f2 * 0.8;
          }
        }
        // Fuga do anel: 30 px em 600 ms, depois volta devagar
        if (f.flee < FLEE_T){
          const k = game.ease.easeOutQuad(f.flee / FLEE_T);
          f.x += f.fx * k; f.y += f.fy * k;
        } else if (f.flee < FLEE_T + 1.5){
          const k = 1 - (f.flee - FLEE_T) / 1.5;
          f.x += f.fx * k; f.y += f.fy * k;
        }
      }

      // Constelação: 3+ pousados a <110 px entre si
      pairs.length = 0;
      const perched = [];
      for (let i = 0; i < n; i++) if (flies[i].state === 2 && flies[i].born >= 0) perched.push(flies[i]);
      let cluster = false;
      if (perched.length >= 3){
        for (let a = 0; a < perched.length; a++){
          let near = 0;
          for (let b = 0; b < perched.length; b++){
            if (a === b) continue;
            const dx = perched[a].x - perched[b].x, dy = perched[a].y - perched[b].y;
            if (dx * dx + dy * dy < CONST_R * CONST_R){ near++; if (a < b) pairs.push(perched[a], perched[b]); }
          }
          if (near >= 2) cluster = true;
        }
      }
      if (cluster){
        constTimer += dt;
        // Aparece em 1,5 s, fica ~6 s, some em 2 s; depois descansa
        const c = constTimer % 14;
        constAlpha = c < 1.5 ? c / 1.5 : c < 7.5 ? 1 : c < 9.5 ? 1 - (c - 7.5) / 2 : 0;
      } else { constTimer = 0; constAlpha = Math.max(0, constAlpha - dt); }
    },

    draw(layer, ctx, game){
      if (layer !== 'light') return;
      const n = alive(game), t = game.t;
      if (!n) return;
      const P = game.palette;
      const dayFade = 1 - game.dayPhase;                // se retiram no amanhecer
      if (dayFade <= 0.01) return;
      const R = game.eco ? 10 : 14;
      const glow = game.sprite.glow(P.firefly, R);
      const eff = game.unlockFade('fireflies');

      // Linhas de constelação entre pousados
      if (constAlpha > 0.01 && pairs.length){
        ctx.strokeStyle = P.firefly; ctx.lineWidth = 1;
        ctx.globalAlpha = 0.15 * constAlpha * dayFade * game.unlockFade('fireflies2');
        ctx.beginPath();
        for (let i = 0; i < pairs.length; i += 2){ ctx.moveTo(pairs[i].x, pairs[i].y); ctx.lineTo(pairs[i + 1].x, pairs[i + 1].y); }
        ctx.stroke();
      }

      ctx.fillStyle = P.light;
      for (let i = 0; i < n; i++){
        const f = flies[i];
        if (f.born < 0 || t < f.born) continue;
        const bornK = game.ease.smoothstep((t - f.born) / 5);
        const fade = (i < BASE ? eff : game.unlockFade('fireflies2')) * bornK * dayFade;
        if (fade <= 0.01) continue;
        // Pulso lento (2-4 s) — respiração de luz
        let b = 0.5 + 0.5 * Math.sin(t * Math.PI * 2 / f.period + f.pph);
        b = 0.25 + 0.75 * b * b;
        if (f.state === 2) b *= 0.7;                    // pousado: mais quieto
        let shine = 0;
        if (f.shine < SHINE_T) shine = Math.sin(Math.PI * Math.min(1, f.shine / SHINE_T)) * 0.8;
        const a = Math.min(1, (b * 0.55 + shine)) * fade;
        const s = R * (1 + shine * 0.6);
        ctx.globalAlpha = a;
        ctx.drawImage(glow, f.x - s, f.y - s, s * 2, s * 2);
        // Núcleo claro de 1,5 px
        ctx.globalAlpha = Math.min(1, a * 1.4);
        ctx.fillRect(f.x - 0.75, f.y - 0.75, 1.5, 1.5);
      }
      ctx.globalAlpha = 1;
    },

    // Anel: quem está a <150 px foge 30 px e brilha 2 s (tilintar)
    onRipple(x, y, game){
      const n = alive(game);
      let any = false;
      for (let i = 0; i < n; i++){
        const f = flies[i];
        if (f.born < 0 || game.t < f.born) continue;
        const dx = f.x - x, dy = f.y - y, d2 = dx * dx + dy * dy;
        if (d2 > FLEE_R * FLEE_R || d2 < 1) continue;
        const d = Math.sqrt(d2);
        f.fx = dx / d * FLEE_D; f.fy = dy / d * FLEE_D;
        f.flee = 0; f.shine = 0; any = true;
      }
      if (any) chime(game, x, 0.5);
    },

    // Clique num vagalume: pulso de brilho + mesma nota uma oitava acima
    onClick(x, y, game){
      const n = alive(game);
      let best = null, bd = HIT_R * HIT_R;
      for (let i = 0; i < n; i++){
        const f = flies[i];
        if (f.born < 0 || game.t < f.born) continue;
        const dx = f.x - x, dy = f.y - y, d2 = dx * dx + dy * dy;
        if (d2 < bd){ bd = d2; best = f; }
      }
      if (!best) return false;
      best.shine = 0;
      best.fx = 0; best.fy = 0;
      const nx = Math.min(1, Math.max(0, best.x / game.W));
      const ny = Math.min(1, Math.max(0, (best.y - game.horizonY) / (game.H - game.horizonY)));
      game.audio.play('pulse', { x: nx, y: ny, gain: 1 });
      return true;
    }
  };

  LQ.register('fireflies', def);
  LQ.fireflies = { list: flies }; // leitura (depuração/outras entidades)
})();
