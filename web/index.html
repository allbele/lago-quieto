<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lago Quieto</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="lake"></canvas>

<!-- Coleção: faixa com ícones dos moradores acordados (sem texto) -->
<div id="collection" aria-hidden="true"></div>

<!-- Idle: HUD (moeda/taxa) e loja lateral — preenchidos por idle/hud.js -->
<div id="hud"></div>
<aside id="shop"></aside>

<!-- Barra inferior de ícones -->
<div id="ui">
  <button class="ico" id="btn-sound" data-act="sound">
    <svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5l4.5 3.5V6L7.5 9.5H4z"/><path class="on" d="M15.5 9a4 4 0 0 1 0 6"/><path class="on" d="M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  </button>
  <button class="ico" id="btn-full" data-act="full">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
  </button>
  <button class="ico" id="btn-theme" data-act="theme">
    <svg viewBox="0 0 24 24"><path d="M12 3.5s-5.5 6-5.5 10a5.5 5.5 0 0 0 11 0c0-4-5.5-10-5.5-10z"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5"/></svg>
  </button>
  <button class="ico" id="btn-coll" data-act="coll">
    <svg viewBox="0 0 24 24"><circle cx="7" cy="8" r="1.3"/><circle cx="12" cy="6.5" r="1.3"/><circle cx="17" cy="8" r="1.3"/><path d="M3 14.5c3-2.5 6 2.5 9 0s6-2.5 9 0"/><path d="M5 18.5c2.5-2 5 2 7 0s4.5-2 7 0"/></svg>
  </button>
  <button class="ico" id="btn-eco" data-act="eco">
    <svg viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 14-14 0 9-4.5 14-12 14"/><path d="M5 19c3-4 6-7 10-9"/></svg>
  </button>
  <!-- Modo: mostra o ícone do modo oposto (zen → raio, idle → lua) -->
  <button class="ico" id="btn-mode" data-act="mode">
    <svg class="to-idle" viewBox="0 0 24 24"><path d="M13 2.5L5 13.5h6l-1 8 9-11.5h-6l1-7.5z"/></svg>
    <svg class="to-zen" viewBox="0 0 24 24"><path d="M15 3.5a9 9 0 1 0 5.5 14.5A8 8 0 0 1 15 3.5z"/></svg>
  </button>
  <!-- Loja (só idle): anel / ondas concêntricas -->
  <button class="ico" id="btn-shop" data-act="shop">
    <svg viewBox="0 0 24 24"><ellipse cx="12" cy="13" rx="3" ry="1.2"/><ellipse cx="12" cy="13" rx="6.5" ry="2.6"/><ellipse cx="12" cy="13" rx="10" ry="4"/></svg>
  </button>
</div>
<style>
/* Botões de modo/loja: visibilidade por body.mode-zen / body.mode-idle */
#btn-mode .to-zen,#btn-shop{display:none}
body.mode-idle #btn-mode .to-idle{display:none}
body.mode-idle #btn-mode .to-zen{display:inline}
body.mode-idle #btn-shop{display:inline-block}
</style>

<!-- Ícones dos moradores (templates para a coleção) -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="ic-firefly" viewBox="0 0 24 24"><circle cx="12" cy="13" r="3.5"/><path d="M9.5 10.5L6 6M14.5 10.5L18 6"/></symbol>
  <symbol id="ic-fish" viewBox="0 0 24 24"><path d="M4 12c3-4 7-5.5 11-4.5 2 .5 3.5 2.5 5 4.5-1.5 2-3 4-5 4.5-4 1-8-.5-11-4.5z"/><path d="M4 12l-1.5-3.5M4 12l-1.5 3.5"/></symbol>
  <symbol id="ic-goldfish" viewBox="0 0 24 24"><path d="M4 12c3-4 7-5.5 11-4.5 2 .5 3.5 2.5 5 4.5-1.5 2-3 4-5 4.5-4 1-8-.5-11-4.5z"/><circle cx="16" cy="11" r=".8"/><path d="M11 8v8"/></symbol>
  <symbol id="ic-moon" viewBox="0 0 24 24"><path d="M15 3.5a9 9 0 1 0 5.5 14.5A8 8 0 0 1 15 3.5z"/></symbol>
  <symbol id="ic-mountain" viewBox="0 0 24 24"><path d="M2 19L9 7l4 6 2-3 7 9H2z"/></symbol>
  <symbol id="ic-lily" viewBox="0 0 24 24"><path d="M12 6a8 4 0 1 0 0 .01"/><path d="M12 6v4"/></symbol>
  <symbol id="ic-flower" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M12 4v4M12 16v4M4 12h4M16 12h4M6.5 6.5l3 3M14.5 14.5l3 3M17.5 6.5l-3 3M9.5 14.5l-3 3"/></symbol>
  <symbol id="ic-shooting" viewBox="0 0 24 24"><path d="M3 17L15 8"/><path d="M17 4l1 2.5 2.5 1-2.5 1L17 11l-1-2.5-2.5-1 2.5-1z"/></symbol>
  <symbol id="ic-frog" viewBox="0 0 24 24"><path d="M5 15c0-4 3-6 7-6s7 2 7 6-3 4-7 4-7 0-7-4z"/><circle cx="8.5" cy="9" r="2"/><circle cx="15.5" cy="9" r="2"/></symbol>
  <symbol id="ic-aurora" viewBox="0 0 24 24"><path d="M3 9c3-3 6 3 9 0s6-3 9 0M3 15c3-3 6 3 9 0s6-3 9 0"/></symbol>
  <symbol id="ic-bird" viewBox="0 0 24 24"><path d="M3 13c3-3 6-3 9 0 3-3 6-3 9 0"/><path d="M7 17c1.5-1.5 3.5-1.5 5 0 1.5-1.5 3.5-1.5 5 0"/></symbol>
  <symbol id="ic-reed" viewBox="0 0 24 24"><path d="M8 21c0-6 1-11 3-16M14 21c0-5 1-9 3-13M11 21c.5-4 .5-8 0-12"/><path d="M11 3.5v3.5"/></symbol>
  <symbol id="ic-star" viewBox="0 0 24 24"><path d="M12 4l1.8 4.6L18.5 9l-3.7 3.2 1.1 4.8L12 14.6 8.1 17l1.1-4.8L5.5 9l4.7-.4z"/></symbol>
  <symbol id="ic-coll" viewBox="0 0 24 24"><circle cx="7" cy="8" r="1.3"/><circle cx="12" cy="6.5" r="1.3"/><circle cx="17" cy="8" r="1.3"/><path d="M3 14.5c3-2.5 6 2.5 9 0s6-2.5 9 0"/><path d="M5 18.5c2.5-2 5 2 7 0s4.5-2 7 0"/></symbol>
</svg>

<script src="audio.js"></script>
<script src="platform.js"></script>
<script src="game.js"></script>
<script src="ent/reeds.js"></script>
<script src="ent/fireflies.js"></script>
<script src="ent/fish.js"></script>
<script src="ent/lilies.js"></script>
<script src="ent/frog.js"></script>
<script src="ent/sky.js"></script>
<script src="ent/fog.js"></script>
<script src="ent/themes.js"></script>
<script src="idle/util.js"></script>
<script src="idle/state.js"></script>
<script src="idle/data.js"></script>
<script src="idle/engine.js"></script>
<script src="idle/hud.js"></script>
<script src="idle/prestige.js"></script>
<script>LQ.boot();</script>
</body>
</html>
